function offerBuild(p, sp, done){
  if(p.buildBan > 0){ log('🚧 건설 허가 보류 중이라 지을 수 없습니다. (남은 '+p.buildBan+'턴)'); done(); return; }
  const options = [];
  if(!sp.bl.v) options.push(0);
  if(!sp.bl.b) options.push(1);
  if(!sp.bl.h) options.push(2);
  if(options.length===0){
    /* 별장, 빌딩, 호텔을 모두 지었으면 랜드마크를 세울 수 있다 */
    if(!sp.bl.L){ offerLandmark(p, sp, done); return; }
    log('🏰 <b>'+sp.name+'</b>은(는) 랜드마크까지 완성되어 더 지을 것이 없습니다.'); done(); return;
  }
  const curToll = calcToll(sp);
  /* 각 건물을 지었을 때의 통행료 미리보기 */
  const tollIfBuilt = (k)=>{
    const tmp = {bl:{v:sp.bl.v, b:sp.bl.b, h:sp.bl.h, L:sp.bl.L}};
    if(k===0) tmp.bl.v=1; else if(k===1) tmp.bl.b=1; else tmp.bl.h=1;
    return tollAtNow(sp, bldLevel(tmp));
  };
  const spring = buildCost(sp, 0) < sp.bc[0];
  const rows = options.map(k=>{
    const afford = p.cash >= buildCost(sp, k);
    return '<div class="brow2'+(afford?'':' na')+'" data-k="'+k+'">' +
      '<span class="bname">'+BICONS[k]+' '+BNAMES[k]+'</span>' +
      '<span class="bcost">'+fmt(buildCost(sp, k))+'원</span>' +
      '<span class="btoll">통행료 '+fmt(tollIfBuilt(k))+'원</span></div>';
  }).join('');
  const btns = options.map(k=>({
    l: BICONS[k]+' '+BNAMES[k]+' ('+fmt(buildCost(sp, k))+'원)',
    cls: 'alt',
    dis: p.cash < buildCost(sp, k),
    fn: ()=>{
      G.manualPrompt = false;
      const after = tollIfBuilt(k), cost = buildCost(sp, k);
      p.cash -= cost;
      book(p, 'out', 'prop', cost);
      p.stat.builds++;
      if(k===0) sp.bl.v=1; else if(k===1) sp.bl.b=1; else sp.bl.h=1;
      sfx('build');
      fxFlashCell(p.pos);
      fxDust(p.pos);
      log('🏗️ <b>'+esc(p.name)+'</b>이(가) <b>'+sp.name+'</b>에 '+BNAMES[k]+'을(를) 지었습니다. 통행료 '+fmt(after)+'원 <b class="neg">-'+fmt(cost)+'원</b>');
      renderAll();
      done();
    }
  }));
  btns.push({l:'짓지 않기', cls:'ghost', fn:()=>{ G.manualPrompt = false; done(); }});
  G.manualPrompt = options.some(k=>p.cash >= buildCost(sp, k));   /* 건물 건설도 직접 결정 (지을 돈이 없으면 그냥 넘어간다) */
  autoCancel();
  modal('건설: '+sp.name,
    '<p class="hint">별장, 빌딩, 호텔 중 <b>하나</b>를 골라 지을 수 있습니다. 다시 도착하면 다른 건물도 지을 수 있습니다.'+(spring ? ' 봄이라 건설비가 20% 쌉니다.' : '')+'</p>' +
    '<div class="blist2">'+rows+'</div>' +
    '<p class="btotal">현재 통행료 <b>'+fmt(curToll)+'원</b></p>' +
    '<div class="cashbar"><span class="pdot sm" style="background:'+p.color+'">'+PIECES[p.piece].ic+'</span> 보유 현금 <b class="pos">'+fmt(p.cash)+'원</b></div>',
    btns, GROUPS[sp.g].c);
}

function tollFlow(p, sp, done){
  const owner = G.players[sp.owner];
  const toll = finalToll(p, owner, sp);
  const proceed = ()=>{
    sfx(toll > 20 ? 'renthigh' : 'rentlow');
    pay(p, toll, owner, sp.name+' 통행료', (ok)=>{
      if(!ok){ done(); return; }
      owner.stat.tollIn += toll; p.stat.tollOut += toll;
      {
        const ci = SP.indexOf(sp);
        G.cityToll = G.cityToll || {}; G.cityHits = G.cityHits || {};
        G.cityToll[ci] = (G.cityToll[ci] || 0) + toll; G.cityHits[ci] = (G.cityHits[ci] || 0) + 1;
      }
      tokenAnim(p, 'sad', 1000); tokenSay(p, 'pay');
      setTimeout(()=>{ tokenAnim(owner, 'cheer', 900); tokenSay(owner, 'get'); }, 450);
      owner.stat.maxToll = Math.max(owner.stat.maxToll, toll);
      if(!G.biggest || toll > G.biggest.amt) G.biggest = {amt:toll, from:p.i, to:owner.i, city:sp.name, turn:G.turnNo};
      maybeTakeover(p, sp, owner, done);
    });
  };
  if(p.items.pass > 0){
    modal('통행료: '+sp.name,
      deedShort(sp, owner, toll) + '<p>우대권을 사용해 통행료를 면제받을 수 있습니다.</p>',
      [
        {l:'🎫 우대권 사용', cls:'alt', fn:()=>{
          p.items.pass--;
          const card = CARDS.filter(c=>c.k==='pass')[0];
          if(G.deck.indexOf(card)<0) G.deck.push(card);
          log('🎫 <b>'+esc(p.name)+'</b>이(가) 우대권으로 <b>'+sp.name+'</b> 통행료 '+fmt(toll)+'원을 면제받았습니다!');
          renderPlayers();
          done();
        }},
        {l:'지불하기 ('+fmt(toll)+'원)', cls:'primary', fn:proceed}
      ], '#8C2F2F');
    return;
  }
  modal('통행료: '+sp.name, deedShort(sp, owner, toll),
    [{l:'지불하기 ('+fmt(toll)+'원)', cls:'primary', fn:proceed}], '#8C2F2F');

/* 인수 가격. 누구나 인수할 수 있지만 등수가 높을수록 배율이 크다 (1등 2.5배 ~ 꼴찌 1.3배, 투자액 기준).
   랜드마크가 선 도시는 인수할 수 없고, 건물 3채가 다 선 도시는 1.5배 할증이 붙는다.
   빼앗기는 쪽은 투자액에 웃돈의 절반을 더 받고, 나머지 절반은 사회복지기금으로 간다. 인수할 수 없으면 null */
function rankOf(p){
  const al = alivePlayers().slice().sort((a,b)=>assets(b)-assets(a) || b.cash-a.cash);
  return {rank: al.indexOf(p) + 1, n: al.length};
}
function takeoverMult(p){
  const r = rankOf(p);
  if(r.n < 2 || r.rank < 1) return 1.3;
  return Math.round((2.5 - 1.2*(r.rank-1)/(r.n-1))*10)/10;
}
function takeoverDeal(p, sp){
  if(!G.opts.takeover) return null;
  if(sp.type!=='city' || sp.owner===null || sp.owner===p.i) return null;
  if(sp.bl.L) return null;                                         /* 랜드마크는 지킨다 */
  const full = !!(sp.bl.v && sp.bl.b && sp.bl.h);
  const base = takeoverMult(p);
  const mult = full ? Math.round(base*1.5*10)/10 : base;
  const inv = invested(sp);
  const cost = Math.round(inv*mult);
  const toOwner = Math.min(cost, Math.round(inv*(1 + (mult-1)*0.5)));
  return {cost:cost, toOwner:toOwner, toFund:cost - toOwner, mult:mult, base:base, full:full, rank:rankOf(p).rank, built:bldCount(sp) > 0};
}
function maybeTakeover(p, sp, owner, done){
  const deal = takeoverDeal(p, sp);
  if(!deal || !owner.alive || !p.alive || p.cash < deal.cost){ done(); return; }
  G.manualPrompt = true;               /* 인수도 직접 결정 (자동 인수 방지) */
  autoCancel();
  const what = '<p>'+(deal.built ? '건물째로 ' : '')+'이 도시를 인수할 수 있습니다. 지금 <b>'+deal.rank+'등</b>이라 투자액 '+fmt(invested(sp))+'원의 <b>'+deal.mult+'배</b>인 <b>'+fmt(deal.cost)+'원</b>을 냅니다.</p>' +
    (deal.full ? '<p class="hint">건물 3채가 모두 선 도시라 1.5배 할증이 붙었습니다.</p>' : '') +
    '<p class="hint">'+esc(owner.name)+'에게 '+fmt(deal.toOwner)+'원'+(deal.toFund ? ', 나머지 '+fmt(deal.toFund)+'원은 사회복지기금으로 갑니다.' : '이 갑니다.')+'</p>';
  modal('인수 기회: '+sp.name,
    deedHTML(sp) + what,
    [
      {l:'인수하기 ('+fmt(deal.cost)+'원)', cls:'primary', fn:()=>{
        G.manualPrompt = false;
        p.cash -= deal.cost;
        owner.cash += deal.toOwner;
        if(deal.toFund) G.fund += deal.toFund;
        book(p, 'out', 'prop', deal.cost); book(owner, 'in', 'prop', deal.toOwner);
        markEvent('takeover', p, p.name+'이(가) '+owner.name+'의 '+sp.name+' 인수 ('+fmt(deal.cost)+'원)');
        sp.owner = p.i;
        p.stat.takeovers = (p.stat.takeovers || 0) + 1;
        sfx(deal.built ? 'special' : 'buy');
        fxCoinFlow(playerPt(p), playerPt(owner), deal.cost);
        fxStamp(SP.indexOf(sp), '인수', p.color);
        fxOwnerClaim(p, sp);
        if(deal.built){ fxRing(cellPt(SP.indexOf(sp)), p.color); showBanner('인수', esc(p.name)+' · '+sp.name, p.color); }
        log('🤝 <b>'+esc(p.name)+'</b>이(가) <b>'+esc(owner.name)+'</b>의 <b>'+sp.name+'</b>'+bldStr(sp)+'을(를) '+fmt(deal.cost)+'원에 인수했습니다! ('+deal.rank+'등 배율 '+deal.mult+'배)', 'big');
        renderAll();
        checkEndgameSwap();
        syncMonopolies(true);
        if(G.over) return;
        done();
      }},
      {l:'괜찮습니다', cls:'ghost', fn:()=>{ G.manualPrompt = false; done(); }}
    ], GROUPS[sp.g].c);
}

/* ================= 황금열쇠 ================= */
function drawKey(p, done){
  p.stat.keys++;
  /* 순위별 풀: 같은 더미에서 뽑되, 지금 순위에 맞는 가중치로 고른다 (관리자가 지정한 카드가 있으면 그것) */
  let c = null;
  if(G.forceCard && G.deck.indexOf(G.forceCard) >= 0){ c = G.forceCard; G.forceCard = null; }
  if(!c){
    const W = KEY_WEIGHT[keyTier(p)];
    const pool = G.deck.map(card=>({card:card, w:W[cardKind(card)]})).filter(x=>x.w > 0);
    let r = Math.random() * pool.reduce((t,x)=>t+x.w, 0);
    for(const x of pool){ r -= x.w; if(r <= 0){ c = x.card; break; } }
    if(!c) c = pool.length ? pool[pool.length-1].card : G.deck[0];
  }
  /* 보관 카드(석방권, 우대권)는 쓸 때까지 더미에서 빠진다 */
  if(c.keep){ const at = G.deck.indexOf(c); if(at >= 0) G.deck.splice(at, 1); }
  sfx('card');
  fxKey(p.pos);
  fxSpark(cellPt(p.pos), '#E0B341', 14);
  fxFlashCell(p.pos);
  modal('🔑 황금열쇠',
    '<div class="keycard"><div class="keytitle">'+c.t+'</div><p>'+c.d+'</p></div>',
    [{l:'확인', cls:'primary', fn:()=>applyCard(p, c, done)}], '#B8860B');
}
/* 복권: 1 ~ 500만원.
   3% 확률로 450~500만원 대박, 나머지 97%는 1~449만원을 로그 스케일로 흩뿌려 대부분 소액. */
function lottoDraw(p){
  const lk = luck(p);
  if(lk < 0 && Math.random() < -lk*0.6) return 1 + Math.floor(Math.random()*15);   /* 1등의 복권은 대개 꽝에 가깝다 */
  if(Math.random() < 0.03 * (1 + lk)){
    return 450 + Math.floor(Math.random()*51);          /* 450 ~ 500 균등 (전체의 약 3%) */
  }
  const u = Math.random();
  const amt = Math.pow(449, Math.pow(u, 2.6));
  return Math.min(449, Math.max(1, Math.round(amt)));
}
function applyCard(p, c, done){
  if(c.k==='world'){
    paySalary(p, '세계일주 월급');
    if(G.fund>0){ const a=G.fund; G.fund=0; gain(p, a, '사회복지기금 수령'); renderCells(); }
    done();
  } else if(c.k==='island'){
    sendToJail(p, 3, (jailed)=>{
      if(jailed) log('🔒 <b>'+esc(p.name)+'</b>이(가) 감옥에 갇혔습니다.');
      renderPlayers(); done();
    });
  } else if(c.k==='space'){
    teleport(p, SPACE_IDX, true, ()=>{
      p.travel = 2;
      log('🚀 우주여행 승강장으로 이동했습니다. 다음 차례에 무료로 원하는 칸에 갈 수 있습니다.');
      renderPlayers(); done();
    });
  } else if(c.k==='goto'){
    teleport(p, c.to, true, ()=>resolveLanding(p, done));
  } else if(c.k==='fundgo'){
    teleport(p, FUND_IDX, true, ()=>{
      if(G.fund>0){ const a=G.fund; G.fund=0; gain(p, a, '사회복지기금 수령'); renderCells(); }
      else log('💰 접수처에 도착했지만 적립된 기금이 없습니다.');
      done();
    });
  } else if(c.k==='back'){
    p.pos = (p.pos + 44 - c.n) % 44;
    renderTokens();
    setTimeout(()=>resolveLanding(p, done), REDUCED ? 0 : 260);
  } else if(c.k==='gain'){
    gain(p, c.a, c.t);
    done();
  } else if(c.k==='lotto'){
    sfx('lotto');
    const amt = lottoDraw(p);
    const grand = amt >= 400;
    if(grand){ sfx('win'); fxScreen('rgba(255,214,102,.55)'); fxConfetti(playerPt(p), ['#FFD54A','#FF7A59','#6FD3A0','#5FA8E8','#fff'], 40); markEvent('lotto', p, p.name+', 복권 '+fmt(amt)+'원 당첨'); fxShow(playerPt(p), ['#FFD54A','#FF7A59','#6FD3A0','#5FA8E8','#FFFFFF'], 3); }
    gain(p, amt, '복권 당첨');
    modal('🎟️ 복권 추첨',
      '<div class="keycard"><div class="keytitle">복권 추첨</div>' +
      '<p class="big-amt">'+(grand?'🎉 ':'')+'당첨금 <b class="pos">'+fmt(amt)+'원</b>'+(grand?' 🎉':'')+'</p>' +
      '<p class="hint">'+(amt>=400?'전설적인 대박입니다!':amt>=100?'제법 큰 행운이네요.':amt>=30?'쏠쏠한 당첨입니다.':'소소하지만 공돈입니다.')+'</p></div>',
      [{l:'확인', cls:'primary', fn:done}], grand ? '#B8860B' : '#2E7D46');
  } else if(c.k==='pay'){
    if(p.cpEnjoyer){
      log('🚨 <b>'+esc(p.name)+'</b>(CP enjoyer): '+c.t+' '+fmt(c.a)+'원 납부를 면제받았습니다.');
      done();
    } else {
      pay(p, c.a, 'fund', c.t, ()=>done());
    }
  } else if(c.k==='perb'){
    let v=0,b=0,h=0;
    SP.forEach(sp=>{ if(sp.type==='city' && sp.owner===p.i){ v+=sp.bl.v; b+=sp.bl.b; h+=sp.bl.h; } });
    const total = v*c.f[0] + b*c.f[1] + h*c.f[2];
    if(total===0){ log('🏚️ 보유한 건물이 없어 낼 금액이 없습니다.'); done(); }
    else pay(p, total, 'fund', c.t+' (별장 '+v+', 빌딩 '+b+', 호텔 '+h+')', ()=>done());
  } else if(c.k==='escape'){
    p.items.escape++;
    log('🗝️ 보석 석방권을 획득했습니다.');
    renderPlayers(); done();
  } else if(c.k==='pass'){
    p.items.pass++;
    log('🎫 우대권을 획득했습니다.');
    renderPlayers(); done();
  } else if(c.k==='bday'){
    birthdayChain(p, alivePlayers().filter(x=>x.i!==p.i), done);
  } else if(c.k==='halfsale'){
    halfSale(p, done);
  } else if(c.k==='penalty'){
    penaltyGame(p, done);
  } else if(c.k==='ladder'){
    ladderGame(p, done);
  } else if(c.k==='oddeven'){
    oddEvenGame(p, done);
  } else if(c.k==='coin'){
    coinGame(p, done);
  } else if(c.k==='mindset'){
    const last = alivePlayers().every(o=>assets(o) >= assets(p));
    gain(p, last ? 40 : 10, last ? '꼴찌 응원금' : '응원금');
    done();
  } else if(c.k==='reroll'){
    G.extraRoll = true;
    log('🎲 <b>'+esc(p.name)+'</b>: 완전 럭키비키잖아! 이번 차례에 한 번 더 굴립니다.');
    done();
  } else if(c.k==='loan'){
    gain(p, c.a, c.t);
    p.loan = (p.loan || 0) + c.n;
    log('🏦 <b>'+esc(p.name)+'</b>: 다음 월급 '+p.loan+'번은 대출 이자로 빠져나갑니다.');
    renderPlayers();
    done();
  } else if(c.k==='richtax'){
    const rich = alivePlayers().slice().sort((x,y)=>assets(y)-assets(x) || y.cash-x.cash)[0];
    const amt = Math.round(rich.cash * 0.1);
    if(amt <= 0){ log('🏦 총자산 1위 <b>'+esc(rich.name)+'</b>은(는) 낼 현금이 없어 그냥 넘어갑니다.'); done(); }
    else pay(rich, amt, 'fund', '총자산 1위 세금', ()=>done());
  } else if(c.k==='hodl'){
    const n = ownedProps(p).length;
    if(n){ gain(p, c.a*n, '존버 보상 (부동산 '+n+'곳)'); }
    else log('🏚️ 가진 부동산이 없어 받을 것이 없습니다.');
    done();
  } else if(c.k==='gostart'){
    teleport(p, 0, false, ()=>{
      p.stat.laps++;
      paySalary(p, '갓생 월급');
      log('🏁 <b>'+esc(p.name)+'</b>이(가) 출발지에 도착했습니다.');
      done();
    });
  } else if(c.k==='bubble'){
    const props = ownedProps(p).sort((a,b)=>invested(SP[b]) - invested(SP[a]));
    if(!props.length){ log('🏚️ 가진 부동산이 없어 피해가 없습니다.'); done(); return; }
    sellToBank(p, props[0]);
    fxFlashCell(props[0]);
    done();
  } else if(c.k==='rentcap'){
    p.rentCap = c.n;
    log('📉 <b>'+esc(p.name)+'</b>: 임대료 규제. '+c.n+'턴 동안 내 땅 통행료가 절반입니다.');
    renderPlayers(); done();
  } else if(c.k==='permit'){
    p.buildBan = c.n;
    log('🚧 <b>'+esc(p.name)+'</b>: 건설 허가 보류. '+c.n+'턴 동안 건물을 지을 수 없습니다.');
    renderPlayers(); done();
  } else if(c.k==='typhoon'){
    /* 가장 높은 단계의 건물 (같으면 비싼 도시) 하나를 허문다 */
    let best = null;
    SP.forEach(sp=>{ if(sp.type==='city' && sp.owner===p.i && bldLevel(sp) > 0 && (!best || bldLevel(sp) > bldLevel(best) || (bldLevel(sp)===bldLevel(best) && sp.price > best.price))) best = sp; });
    if(!best){ log('🌀 태풍이 지나갔지만 무너질 건물이 없었습니다.'); done(); return; }
    const key = best.bl.L ? 'L' : best.bl.h ? 'h' : best.bl.b ? 'b' : 'v';
    best.bl[key] = 0;
    sfx('bad'); fxShake(); fxFlashCell(SP.indexOf(best));
    log('🌀 <b>'+esc(p.name)+'</b>: 태풍으로 <b>'+best.name+'</b>의 '+({L:'랜드마크',h:'호텔',b:'빌딩',v:'별장'})[key]+'이(가) 무너졌습니다. 통행료 '+fmt(calcToll(best))+'원', 'big');
    renderAll(); checkEndgameSwap(); done();
  } else if(c.k==='audit'){
    const amt = Math.round(p.cash * 0.2);
    if(amt <= 0){ log('🧾 낼 현금이 없어 그냥 넘어갑니다.'); done(); }
    else pay(p, amt, 'fund', '세무조사 추징금', ()=>done());
  } else if(c.k==='angel'){
    const others = alivePlayers().filter(o=>o!==p);
    const next = (k)=>{ if(k >= others.length || !p.alive){ done(); return; } pay(p, c.a, others[k], '기부', (ok)=>{ if(ok) next(k+1); else done(); }); };
    next(0);
  } else if(c.k==='freebuild'){
    /* 가장 비싼 내 도시에, 아직 없는 건물 가운데 가장 낮은 단계를 올려 준다 */
    let best = null;
    SP.forEach(sp=>{ if(sp.type==='city' && sp.owner===p.i && !(sp.bl.v && sp.bl.b && sp.bl.h) && (!best || sp.price > best.price)) best = sp; });
    if(!best){ gain(p, 10, c.t); done(); return; }
    const k = !best.bl.v ? 0 : !best.bl.b ? 1 : 2;
    if(k===0) best.bl.v = 1; else if(k===1) best.bl.b = 1; else best.bl.h = 1;
    sfx('build');
    fxFlashCell(SP.indexOf(best));
    log('🏗️ <b>'+esc(p.name)+'</b>: <b>'+best.name+'</b>에 '+BNAMES[k]+'이(가) 공짜로 올라갔습니다. 통행료 '+fmt(calcToll(best))+'원');
    renderAll();
    checkEndgameSwap();
    done();
  } else {
    done();
  }
}

/* ================= 황금열쇠 미니게임 =================
   승부차기, 사다리 타기, 홀짝, 코인 차트. 모두 자체 제한 시간이 있어 아무도 누르지 않아도 진행되고,
   AI 차례에는 스스로 플레이한다. 미니게임을 하는 동안에는 게임 시계가 멈춘다. */
function miniStart(){ G.hold = (G.hold || 0) + 1; }
function miniEnd(){ G.hold = Math.max(0, (G.hold || 0) - 1); }
const SELF = ' data-selfpaced="1"';     /* 이 표시가 있는 창은 자동 모드, AI 드라이버, 결정 제한 시간이 건드리지 않는다 */
function miniButton(label, fn){
  const bb = $('mBtns');
  bb.innerHTML = '';
  if(!label) return null;
  const b = document.createElement('button');
  b.className = 'btn primary';
  b.textContent = label;
  b.onclick = fn;
  bb.appendChild(b);
  return b;
}
/* 미니게임의 마지막 확인 버튼. 이때부터는 자동 모드, AI, 결정 제한 시간이 눌러도 된다 */
function miniFinal(fn){
  $('mBody').querySelectorAll('[data-selfpaced]').forEach(el=>el.removeAttribute('data-selfpaced'));
  miniButton('확인', fn);
  scheduleAuto(); aiSchedule(); shotStart();
}

/* ----- 승부차기: 방향을 고르고, 힘 조절 막대가 초록 구간일 때 찬다 ----- */
function penaltyGame(p, done){
  const KICKS = 3, PRIZE = [0, 10, 25, 50];
  const X = [22, 50, 78];                       /* 왼쪽, 가운데, 오른쪽 과녁의 가로 위치(%) */
  const DIRN = ['왼쪽', '가운데', '오른쪽'];
  const quick = MODE.autoEnd;                   /* 번개전은 제한 시간이 짧다 */
  const res = [];
  let timer = null, swinging = false;
  miniStart();
  const stop = ()=>{ if(timer){ clearInterval(timer); clearTimeout(timer); timer = null; } swinging = false; };
  const dots = ()=>'<div class="pk-dots">'+[0,1,2].map(i=>'<i class="'+(i < res.length ? (res[i] ? 'in' : 'out') : (i===res.length ? 'now' : ''))+'"></i>').join('')+'</div>';
  const field = ()=>
    '<div class="pk-field">' +
      '<div class="pk-frame"><div class="pk-zones">'+DIRN.map((n,i)=>'<button type="button" class="pk-zone" data-pk="'+i+'"><span>'+n+'</span></button>').join('')+'</div></div>' +
      '<div class="pk-keeper" id="pkKeeper"><i class="pk-head"></i><i class="pk-body"></i></div>' +
      '<div class="pk-spot"></div><div class="pk-ball" id="pkBall"></div>' +
    '</div>' +
    '<div class="pk-gauge idle" id="pkGauge"><i class="g-weak"></i><i class="g-ok"></i><i class="g-power"></i><i class="g-over"></i><b id="pkNeedle"></b></div>' +
    '<div class="pk-legend"><span>약함</span><span>보통</span><span class="pw">강슛</span><span>홈런</span></div>';

  function aim(){
    modal('승부차기 '+(res.length+1)+' / '+KICKS,
      '<div class="pk"'+SELF+'>'+dots()+field()+'<p class="mg-status" id="pkMsg">어디로 찰까요?</p></div>', [], '#2E7B55');
    if(p.ai){ timer = setTimeout(()=>power(Math.floor(Math.random()*3)), 650); return; }
    let left = quick ? 4 : 6;
    $('mBody').querySelectorAll('[data-pk]').forEach(b=>{ b.onclick = ()=>{ stop(); power(+b.dataset.pk); }; });
    timer = setInterval(()=>{
      left--;
      const m = $('pkMsg'); if(m) m.textContent = '어디로 찰까요? ('+left+')';
      if(left <= 0){ stop(); power(Math.floor(Math.random()*3)); }
    }, 1000);
  }
  /* 힘 조절: 바늘이 좌우로 오간다. 초록(강슛) 구간에서 차면 골키퍼가 방향을 맞혀도 들어간다 */
  function power(dir){
    $('mBody').querySelectorAll('[data-pk]').forEach(b=>{ b.disabled = true; b.classList.toggle('sel', +b.dataset.pk === dir); });
    const gauge = $('pkGauge'), needle = $('pkNeedle'), msg = $('pkMsg');
    if(gauge) gauge.classList.remove('idle');
    if(msg) msg.textContent = DIRN[dir]+'! 초록 구간에서 슛을 누르세요';
    const t0 = nowMs(), speed = quick ? 3.6 : 3.0;
    let g = 0;
    swinging = true;
    const swing = ()=>{
      if(!swinging) return;
      g = 0.5 - 0.5*Math.cos((nowMs() - t0)/1000*speed);
      if(needle) needle.style.left = (g*100).toFixed(1)+'%';
      RAF(swing);
    };
    RAF(swing);
    const fire = ()=>{ const v = g; stop(); miniButton(null); shoot(dir, v); };
    if(p.ai){
      /* 난이도가 높을수록 강슛 구간을 잘 맞힌다 */
      const aimAt = Math.random() < (p.diff==='high' ? 0.6 : p.diff==='mid' ? 0.35 : 0.12) ? rnd(0.64, 0.84) : Math.random();
      timer = setTimeout(()=>{ stop(); if(needle) needle.style.left = (aimAt*100).toFixed(1)+'%'; shoot(dir, aimAt); }, 750);
      return;
    }
    miniButton('슛!', fire);
    timer = setTimeout(fire, quick ? 3500 : 5000);
  }
  function shoot(dir, g){
    const kind = g > 0.86 ? 'over' : g < 0.22 ? 'weak' : g >= 0.62 ? 'power' : 'ok';
    let kd = Math.floor(Math.random()*3);                 /* 골키퍼가 몸을 던지는 방향 */
    const lk = luck(p);
    if(lk < 0 && Math.random() < -lk*0.35) kd = dir;      /* 숨은 운 보정: 1등의 슛은 골키퍼가 더 잘 읽는다 */
    if(lk > 0 && kd === dir && Math.random() < lk*0.5) kd = (dir + 1) % 3;
    if(kind==='weak') kd = dir;                           /* 힘없는 공은 보고 잡는다 */
    const goal = kind==='power' || (kind==='ok' && kd !== dir);
    const ball = $('pkBall'), keeper = $('pkKeeper'), msg = $('pkMsg');
    sfx('build');
    if(keeper){
      keeper.style.left = X[kd]+'%';
      keeper.classList.add(kd===0 ? 'dl' : kd===2 ? 'dr' : 'up');
    }
    if(ball){
      ball.classList.add('fly');
      if(kind==='weak') ball.classList.add('weak');
      ball.style.left = X[dir]+'%';
      ball.style.top = (kind==='over' ? -26 : kind==='weak' ? 88 : goal ? 46 : 74)+'px';
    }
    res.push(goal);
    timer = setTimeout(()=>{
      sfx(goal ? 'gamewin' : 'gamelose');
      if(msg) msg.innerHTML = goal
        ? '<b class="pos">골!</b> '+(kind==='power' ? (kd===dir ? '골키퍼가 읽었지만 너무 빨랐습니다' : '강슛이 그물을 흔듭니다') : '골키퍼가 반대로 뛰었습니다')
        : '<b class="neg">'+(kind==='over' ? '홈런!' : '막혔습니다')+'</b> '+(kind==='over' ? '공이 관중석으로 날아갔습니다' : kind==='weak' ? '힘이 없어 골키퍼 품에 안겼습니다' : '골키퍼가 방향을 읽었습니다');
      timer = setTimeout(()=>{ timer = null; if(res.length < KICKS) aim(); else finish(); }, 1150);
    }, 420);
  }
  function finish(){
    const goals = res.filter(Boolean).length, prize = PRIZE[goals];
    if(goals === KICKS){ sfx('win'); fxConfetti(playerPt(p), [p.color, '#2E7B55', '#F4F2EC', '#16171B'], 26); }
    modal('승부차기 결과',
      '<div class="pk">'+dots()+'<p class="big-amt">'+KICKS+'번 중 <b>'+goals+'골</b>'+(goals===KICKS ? ' · 해트트릭' : '')+'</p>' +
      '<p class="mg-status">'+(prize ? '상금 <b class="pos">'+fmt(prize)+'원</b>을 받습니다.' : '한 골도 넣지 못해 빈손으로 돌아갑니다.')+'</p></div>',
      [{l:'확인', cls:'primary', fn:()=>{
        miniEnd();
        log('⚽ <b>'+esc(p.name)+'</b>: 승부차기 '+KICKS+'번 중 '+goals+'골'+(goals===KICKS ? ', 해트트릭!' : ''));
        if(prize){ gain(p, prize, '승부차기 상금'); p.stat.mini++; }
        done();
      }}], '#2E7B55');
  }
  aim();
}

/* ----- 사다리 타기: 세 줄 가운데 하나를 골라 내려간다 ----- */
function ladderGame(p, done){
  const COLX = [50, 150, 250], TOP = 12, BOT = 158, LV = [36, 60, 84, 108, 132];
  /* 가로줄은 높이마다 왼쪽 칸 또는 오른쪽 칸에 하나씩. 양쪽이 모두 한 번은 나오게 한다 */
  let rungs;
  do { rungs = LV.map(()=>Math.random() < 0.5 ? 0 : 1); } while(rungs.every(r=>r===0) || rungs.every(r=>r===1));
  const prizes = [30, 10, -10];
  for(let i=prizes.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t = prizes[i]; prizes[i] = prizes[j]; prizes[j] = t; }
  let timer = null;
  miniStart();
  const lines = COLX.map(x=>'<line x1="'+x+'" y1="'+TOP+'" x2="'+x+'" y2="'+BOT+'"/>').join('') +
    rungs.map((r,i)=>'<line x1="'+COLX[r]+'" y1="'+LV[i]+'" x2="'+COLX[r+1]+'" y2="'+LV[i]+'"/>').join('');
  const slot = (v, shown, hit)=>'<span class="ld-prize'+(shown ? (v > 0 ? ' pos' : ' neg') : '')+(hit ? ' hit' : '')+'">'+(shown ? (v > 0 ? '+' : '-')+fmt(Math.abs(v))+'원' : '?')+'</span>';
  modal('사다리 타기',
    '<div class="ld"'+SELF+'>' +
      '<div class="ld-row">'+[0,1,2].map(i=>'<button type="button" class="ld-pick" data-ld="'+i+'">'+(i+1)+'번</button>').join('')+'</div>' +
      '<svg class="ld-svg" viewBox="0 0 300 170"><g class="ld-base">'+lines+'</g><polyline id="ldPath" points=""/></svg>' +
      '<div class="ld-row" id="ldPrizes">'+prizes.map(v=>slot(v, false, false)).join('')+'</div>' +
      '<p class="mg-status" id="ldMsg">몇 번 줄을 탈까요?</p></div>', [], '#7A62B6');
  function go(start){
    if(timer){ clearInterval(timer); timer = null; }
    $('mBody').querySelectorAll('[data-ld]').forEach(b=>{ b.disabled = true; b.classList.toggle('sel', +b.dataset.ld === start); });
    let c = start, len = 0;
    const pts = [[COLX[c], TOP]];
    const add = (x, y)=>{ const q = pts[pts.length-1]; len += Math.abs(x - q[0]) + Math.abs(y - q[1]); pts.push([x, y]); };
    LV.forEach((y,i)=>{
      const r = rungs[i];
      if(r === c){ add(COLX[c], y); c = c + 1; add(COLX[c], y); }
      else if(r + 1 === c){ add(COLX[c], y); c = c - 1; add(COLX[c], y); }
    });
    add(COLX[c], BOT);
    /* 숨은 운 보정: 도착 칸의 상금을 운에 따라 다른 칸과 맞바꾼다 (상금은 아직 가려져 있다) */
    const lk = luck(p);
    if(lk !== 0 && Math.random() < Math.abs(lk)*0.5){
      const want = lk < 0 ? Math.min.apply(null, prizes) : Math.max.apply(null, prizes);
      const j = prizes.indexOf(want);
      if(j !== c){ const t = prizes[c]; prizes[c] = prizes[j]; prizes[j] = t; }
    }
    const path = $('ldPath'), msg = $('ldMsg');
    if(path){
      path.setAttribute('points', pts.map(q=>q.join(',')).join(' '));
      path.style.stroke = p.color;
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
      void path.getBoundingClientRect();
      path.style.transition = 'stroke-dashoffset 1.5s linear';
      path.style.strokeDashoffset = '0';
    }
    if(msg) msg.textContent = (start+1)+'번 줄을 타고 내려갑니다…';
    sfx('lotto');
    const won = prizes[c];
    timer = setTimeout(()=>{
      timer = null;
      const box = $('ldPrizes');
      if(box) box.innerHTML = prizes.map((v,i)=>slot(v, true, i===c)).join('');
      sfx(won > 0 ? 'gamewin' : 'gamelose');
      if(msg) msg.innerHTML = won > 0 ? '<b class="pos">'+fmt(won)+'원</b>에 도착했습니다!' : '<b class="neg">꽝!</b> '+fmt(-won)+'원을 냅니다.';
      miniFinal(()=>{
        closeModal(); miniEnd();
        log('🪜 <b>'+esc(p.name)+'</b>: 사다리 타기 '+(start+1)+'번 줄 → '+(won > 0 ? '+' : '-')+fmt(Math.abs(won))+'원');
        if(won > 0){ gain(p, won, '사다리 타기'); p.stat.mini++; done(); }
        else pay(p, -won, 'fund', '사다리 타기 꽝', ()=>done());
      });
    }, REDUCED ? 300 : 1750);
  }
  if(p.ai){ timer = setTimeout(()=>go(Math.floor(Math.random()*3)), 650); return; }
  let left = MODE.autoEnd ? 4 : 6;
  $('mBody').querySelectorAll('[data-ld]').forEach(b=>{ b.onclick = ()=>go(+b.dataset.ld); });
  timer = setInterval(()=>{
    left--;
    const m = $('ldMsg'); if(m) m.textContent = '몇 번 줄을 탈까요? ('+left+')';
    if(left <= 0) go(Math.floor(Math.random()*3));
  }, 1000);
}

/* ----- 홀짝: 주사위 하나의 홀짝 맞히기 ----- */
function oddEvenGame(p, done){
  let timer = null;
  miniStart();
  modal('홀짝',
    '<div'+SELF+'><p class="hint">주사위 하나를 굴립니다. 맞히면 20만원을 받고, 틀리면 10만원을 사회복지기금에 냅니다.</p>' +
      '<div class="mg-dice"><div class="mg-face" id="oeDie">'+dieHTML(0)+'</div></div>' +
      '<div class="rps-row"><button type="button" class="oe-btn" data-oe="1">홀<span>1 · 3 · 5</span></button><button type="button" class="oe-btn" data-oe="0">짝<span>2 · 4 · 6</span></button></div>' +
      '<p class="mg-status" id="oeMsg">홀일까요, 짝일까요?</p></div>', [], '#B58E33');
  function pick(odd){
    if(timer){ clearInterval(timer); timer = null; }
    $('mBody').querySelectorAll('[data-oe]').forEach(b=>{ b.disabled = true; b.classList.toggle('sel', (+b.dataset.oe === 1) === odd); });
    const hit = Math.random() < luckProb(p, 0.5);                      /* 기본 반반, 숨은 운 보정 */
    const pool = [1,2,3,4,5,6].filter(x=>((x % 2 === 1) === odd) === hit);
    const v = pool[Math.floor(Math.random()*pool.length)], die = ()=>$('oeDie'), msg = $('oeMsg');
    if(msg) msg.textContent = (odd ? '홀' : '짝')+'에 걸었습니다…';
    sfx('dice');
    let n = 0;
    timer = setInterval(()=>{
      n++;
      if(die()) die().innerHTML = dieHTML(n < 9 ? 1 + Math.floor(Math.random()*6) : v);
      if(n < 9) return;
      clearInterval(timer); timer = null;
      const win = (v % 2 === 1) === odd;
      sfx(win ? 'gamewin' : 'gamelose');
      if(msg) msg.innerHTML = v+'! '+(v % 2 ? '홀' : '짝')+'입니다. '+(win ? '<b class="pos">맞혔습니다</b>' : '<b class="neg">틀렸습니다</b>');
      miniFinal(()=>{
        closeModal(); miniEnd();
        log('🎲 <b>'+esc(p.name)+'</b>: 홀짝 '+(odd ? '홀' : '짝')+'에 걸고 '+v+'이(가) 나왔습니다.');
        if(win){ gain(p, 20, '홀짝 적중'); p.stat.mini++; done(); }
        else pay(p, 10, 'fund', '홀짝 실패', ()=>done());
      });
    }, 95);
  }
  if(p.ai){ timer = setTimeout(()=>{ timer = null; pick(Math.random() < 0.5); }, 650); return; }
  let left = MODE.autoEnd ? 4 : 6;
  $('mBody').querySelectorAll('[data-oe]').forEach(b=>{ b.onclick = ()=>pick(+b.dataset.oe === 1); });
  timer = setInterval(()=>{
    left--;
    const m = $('oeMsg'); if(m) m.textContent = '홀일까요, 짝일까요? ('+left+')';
    if(left <= 0) pick(Math.random() < 0.5);
  }, 1000);
}

/* ----- 코인 차트: 오르는 동안 팔면 그 배수만큼 받고, 팔기 전에 떨어지면 전부 잃는다 -----
   떨어지는 지점 C 는 P(C > x) = 1.1 / x 를 따른다. 어디서 팔든 기대값은 투자금의 1.1배다. */
function coinGame(p, done){
  const stake = Math.min(20, p.cash);
  if(stake <= 0){ log('📈 <b>'+esc(p.name)+'</b>: 넣을 돈이 없어 차트만 구경했습니다.'); done(); return; }
  const CAP = 8, RATE = 0.30;                                  /* 배수 = e^(0.3 × 초) */
  const lk0 = luck(p);                                          /* 숨은 운 보정: 1등의 차트는 더 일찍 꺾인다 */
  const crashAt = Math.max(1.01, Math.min(CAP, 1.1 / (1 - Math.random()*0.999) * (lk0 < 0 ? 1/(1 - lk0*0.45) : 1 + lk0*0.25)));
  const target = p.ai ? (p.diff==='low' ? rnd(1.15, 1.5) : p.diff==='high' ? rnd(1.6, 2.6) : rnd(1.35, 2.1)) : 0;
  let m = 1, sold = 0, running = true, clock = 0, last = nowMs();
  const pts = [[0, 1]];
  miniStart();
  modal('가즈아!',
    '<div class="cn" id="cnBox"'+SELF+'>' +
      '<div class="cn-top"><span>투자금 <b>'+fmt(stake)+'원</b></span><span>지금 팔면 <b id="cnPay">'+fmt(stake)+'원</b></span></div>' +
      '<div class="cn-chart"><svg viewBox="0 0 300 120" preserveAspectRatio="none"><polyline id="cnLine" points="0,110"/></svg><div class="cn-mult" id="cnMult">×1.00</div></div>' +
      '<p class="mg-status" id="cnMsg">오르는 동안 익절을 누르세요. 떡락하면 전부 잃습니다.</p></div>', [], '#16171B');
  const btn = miniButton('익절', sell);
  function sell(){
    if(sold || !running) return;
    sold = m;
    if(btn) btn.disabled = true;
    sfx('coin');
    const msg = $('cnMsg'); if(msg) msg.innerHTML = '<b class="pos">×'+sold.toFixed(2)+'에 익절!</b> 차트는 어디까지 갈까요…';
  }
  function draw(crashed){
    const line = $('cnLine'), mult = $('cnMult'), payEl = $('cnPay');
    const maxT = Math.max(4, clock), maxM = Math.max(2.2, m);
    if(line) line.setAttribute('points', pts.map(q=>(q[0]/maxT*300).toFixed(1)+','+(110 - (q[1]-1)/(maxM-1)*100).toFixed(1)).join(' ') + (crashed ? ' '+(clock/maxT*300).toFixed(1)+',118' : ''));
    if(mult) mult.textContent = '×'+m.toFixed(2);
    if(payEl && !sold) payEl.textContent = fmt(Math.round(stake*m))+'원';
  }
  function finish(crashed){
    running = false;
    const box = $('cnBox'), msg = $('cnMsg');
    draw(crashed);
    if(crashed && box) box.classList.add('crash');
    const profit = sold ? Math.round(stake*sold) - stake : 0;
    if(sold){
      if(msg) msg.innerHTML = '<b class="pos">×'+sold.toFixed(2)+'에 익절, +'+fmt(profit)+'원</b><br>' +
        (crashed ? '차트는 ×'+crashAt.toFixed(2)+'에서 떡락했습니다. '+(crashAt > sold*1.5 ? '더 갈 수 있었지만 익절은 언제나 옳습니다.' : '절묘하게 빠져나왔습니다.')
                 : sold >= CAP ? '최고점에서 팔았습니다. 전설의 고점 매도!' : '차트는 ×'+CAP+'까지 올랐습니다. 조금 일찍 팔았지만 익절은 언제나 옳습니다.');
    } else {
      sfx('bad'); fxShake();
      if(msg) msg.innerHTML = '<b class="neg">×'+crashAt.toFixed(2)+'에서 떡락!</b> 투자금 '+fmt(stake)+'원이 사라졌습니다.';
    }
    miniFinal(()=>{
      closeModal(); miniEnd();
      if(sold){
        log('📈 <b>'+esc(p.name)+'</b>: 코인을 ×'+sold.toFixed(2)+'에 익절했습니다.');
        if(profit > 0){ gain(p, profit, '코인 익절'); p.stat.mini++; }
        done();
      } else {
        log('📉 <b>'+esc(p.name)+'</b>: 존버하다 ×'+crashAt.toFixed(2)+'에서 떡락을 맞았습니다.');
        pay(p, stake, 'fund', '코인 떡락', ()=>done());
      }
    });
  }
  function loop(){
    if(!running) return;
    const t = nowMs();
    let dt = (t - last)/1000; last = t;
    if(dt > 0.1) dt = 0.1;
    clock += dt * (sold ? 3 : 1);                                /* 판 뒤에는 결말만 빠르게 보여 준다 */
    m = Math.exp(RATE*clock);
    if(m >= crashAt){
      m = crashAt;
      pts.push([clock, m]);
      if(crashAt >= CAP && !sold){ sold = CAP; finish(false); }  /* 끝까지 오른 드문 경우: 최고점에서 자동으로 판다 */
      else finish(crashAt < CAP);
      return;
    }
    pts.push([clock, m]);
    if(target && !sold && m >= target) sell();
    draw(false);
    RAF(loop);
  }
  RAF(loop);
}

function admAction(a){
  if(!ADMIN) return;
  const p = G.players[admSel];
  const num = (id, def)=>{ const e = $(id); const v = e ? parseInt(e.value,10) : NaN; return isNaN(v) ? def : v; };

  if(a==='cashSet'){ const v = Math.max(0, num('admCash',0)); p.cash = v; admLog(esc(p.name)+'의 현금을 <b>'+fmt(v)+'원</b>으로 설정'); }
  else if(a==='cashAdd'){ const v = Math.max(0, num('admCash',0)); p.cash += v; sfx('coin'); fxFloat(playerPt(p),'+'+fmt(v),'pos'); admLog(esc(p.name)+'에게 <b class="pos">+'+fmt(v)+'원</b>'); }
  else if(a==='cashSub'){ const v = Math.max(0, num('admCash',0)); p.cash = Math.max(0, p.cash-v); sfx('pay'); fxFloat(playerPt(p),'-'+fmt(v),'neg'); admLog(esc(p.name)+'에게서 <b class="neg">-'+fmt(v)+'원</b>'); }
  else if(a==='fundSet'){ G.fund = Math.max(0, num('admFund',0)); admLog('사회복지기금을 <b>'+fmt(G.fund)+'원</b>으로 설정'); }
  else if(a==='fundGive'){
    const v = G.fund; if(v<=0){ admLog('기금이 비어 있습니다.'); } else {
      G.fund = 0; p.cash += v; sfx('coin'); fxConfetti(playerPt(p), [p.color,'#FFD54A','#fff'], 20);
      admLog(esc(p.name)+'이(가) 기금 <b class="pos">'+fmt(v)+'원</b>을 전액 수령');
    }
  }
  else if(a==='transfer'){
    const to = G.players[num('admTo',-1)];
    if(!to || to.i===p.i) return;
    const cash = p.cash, props = ownedProps(p);
    p.cash = 0; to.cash += cash;
    props.forEach(i=>{ SP[i].owner = to.i; });
    sfx('buy'); fxConfetti(playerPt(to), [to.color,'#FFD54A','#fff'], 22);
    admLog(esc(p.name)+' → <b>'+esc(to.name)+'</b> 현금 '+fmt(cash)+'원과 부동산 '+props.length+'곳 전부 이전');
  }
  else if(a==='bankrupt'){
    const raw = $('admDest') ? $('admDest').value : 'bank';
    const dest = (raw==='bank'||raw==='fund') ? raw : G.players[parseInt(raw,10)];
    if(!p.alive){ admLog('이미 탈락한 참가자입니다.'); }
    else {
      closeInfo();
      const wasIdle = gameIdle();
      admLog('<b>'+esc(p.name)+'</b>을(를) 강제 파산 처리');
      bankrupt(p, dest, ()=>{ if(!G.over && G.cur===p.i && wasIdle){ disarmFlick(); endTurn(); } });
      return;
    }
  }
  else if(a==='revive'){
    if(p.alive){ admLog('이미 생존 중입니다.'); }
    else { p.alive = true; if(p.cash<=0) p.cash = 50; G.over = false; sfx('win'); admLog('<b>'+esc(p.name)+'</b>을(를) 되살렸습니다. (현금 '+fmt(p.cash)+'원)'); }
  }
  else if(a==='unover'){ G.over = false; closeInfo(); admLog('승부를 취소하고 게임을 계속합니다.'); beginTurn(); return; }
  else if(a==='own'){ const i = num('admProp',-1); if(i>=0){ SP[i].owner = p.i; admLog('<b>'+SP[i].name+'</b>을(를) '+esc(p.name)+' 소유로 변경'); fxFlashCell(i); } }
  else if(a==='unown'){ const i = num('admProp',-1); if(i>=0){ SP[i].owner = null; if(SP[i].type==='city') SP[i].bl={v:0,b:0,h:0,L:0}; admLog('<b>'+SP[i].name+'</b>을(를) 매물로 되돌림'); fxFlashCell(i); } }
  else if(a.indexOf('bl-')===0){
    const i = num('admProp',-1);
    if(i>=0 && SP[i].type==='city'){
      const key = a.slice(3);
      if(key==='clear'){ SP[i].bl = {v:0,b:0,h:0,L:0}; admLog('<b>'+SP[i].name+'</b>의 건물을 전부 철거'); }
      else { SP[i].bl[key] = SP[i].bl[key] ? 0 : 1; admLog('<b>'+SP[i].name+'</b> 건물 변경 → 통행료 '+fmt(calcToll(SP[i]))+'원'); }
      fxFlashCell(i);
    } else admLog('도시 칸에만 건물을 지을 수 있습니다.');
  }
  else if(a==='move' || a==='moveSal'){
    const i = num('admMove', p.pos);
    closeInfo();
    admLog('<b>'+esc(p.name)+'</b>을(를) '+SP[i].name+'(으)로 이동'+(a==='moveSal'?' (월급 지급)':''));
    if(a==='moveSal') paySalary(p, '관리자 지급');
    teleport(p, i, false, ()=>{ renderAll(); openAdmin(); });
    return;
  }
  else if(a==='island'){ p.island = 3; p.cheongyeon = 0; p.pos = ISLAND_IDX; admLog('<b>'+esc(p.name)+'</b>을(를) 감옥으로 (3턴)'); }
  else if(a==='free'){ p.island = 0; p.trapped = 0; p.trapName=''; p.trapIcon=''; admLog('<b>'+esc(p.name)+'</b>의 감옥/구속 해제'); }
  else if(a==='cheong'){ p.cheongyeon = 2; p.island = 0; p.pos = CHEONGYEON_IDX; admLog('<b>'+esc(p.name)+'</b>을(를) 청연으로 (2턴)'); }
  else if(a==='travel'){ p.travel = 1; admLog('<b>'+esc(p.name)+'</b>에게 우주여행권 부여'); }
  else if(a==='escape'){ p.items.escape++; admLog('<b>'+esc(p.name)+'</b> 탈출권 '+p.items.escape+'장'); }
  else if(a==='pass'){ p.items.pass++; admLog('<b>'+esc(p.name)+'</b> 우대권 '+p.items.pass+'장'); }
  else if(a==='noitem'){ p.items = {escape:0, pass:0}; admLog('<b>'+esc(p.name)+'</b>의 아이템 비움'); }
  else if(a==='sal1' || a==='sal2' || a==='sal3'){ p.salaryMult = parseInt(a.slice(3),10); admLog('<b>'+esc(p.name)+'</b> 월급 '+p.salaryMult+'배'); }
  else if(a==='leader'){
    p.leader = !p.leader;
    if(p.leader){ p.underdog = false; p.tollBuff = false; p.salaryMult = 3; } else p.salaryMult = 1;
    admLog('<b>'+esc(p.name)+'</b> 우세(월급 3배) '+(p.leader?'켜짐':'꺼짐'));
  }
  else if(a==='underdog'){
    p.underdog = !p.underdog; p.tollBuff = p.underdog;
    if(p.underdog){ p.leader = false; p.salaryMult = 1; }
    admLog('<b>'+esc(p.name)+'</b> 열세(통행료＋25%) '+(p.underdog?'켜짐':'꺼짐'));
  }
  else if(a==='rig'){
    rigDice = [num('admD1',1), num('admD2',1)];
    admLog('다음 굴림을 <b>'+rigDice[0]+' + '+rigDice[1]+' = '+(rigDice[0]+rigDice[1])+'</b>로 고정'+(rigDice[0]===rigDice[1]?' (더블)':''));
  }
  else if(a==='unrig'){ rigDice = null; admLog('주사위 고정 해제'); }
  else if(a==='timeSet'){
    if(!MODE.limit){ admLog('무제한 방식에는 시계가 없습니다.'); }
    else { G.timeLeft = Math.max(1, num('admTime', 20))*1000; G.timeUp = false; renderClock(); admLog('남은 시간을 <b>'+fmtClock(G.timeLeft)+'</b>로 설정'); }
  }
  else if(a==='seasonNext'){ advanceSeason(); admLog('계절을 넘겼습니다.'); }
  else if(a==='cardNext'){
    const card = CARDS[num('admCard', 0)];
    if(G.deck.indexOf(card) < 0) G.deck.push(card);
    G.forceCard = card;
    admLog('다음 황금열쇠를 <b>'+esc(card.t)+'</b>(으)로 지정');
  }
  else if(a==='turn'){
    if(!p.alive){ admLog('탈락한 참가자에게는 차례를 줄 수 없습니다.'); }
    else { closeInfo(); G.cur = p.i; admLog('<b>'+esc(p.name)+'</b>의 차례로 변경'); beginTurn(); return; }
  }
  else if(a==='skip'){ closeInfo(); admLog('차례를 넘깁니다.'); endTurn(); return; }
  else if(a==='win'){
    if(!p.alive){ admLog('탈락한 참가자는 승리할 수 없습니다.'); }
    else {
      closeInfo();
      G.players.forEach(x=>{ if(x.i!==p.i) x.alive = false; });
      G.over = false;
      admLog('<b>'+esc(p.name)+'</b>을(를) 즉시 승자로 선언');
      renderAll(); checkWinner();
      return;
    }
  }
  admRefresh();
}

/* ================= 시작 화면 ================= */
let leaving = false;                 /* 새 게임으로 넘어갈 때는 나가기 확인을 띄우지 않는다 */
function newGame(){ leaving = true; window.location.reload(); }
let setupMode = 'standard';          /* blitz / standard / classic */
function renderModes(){
  $('gmRow').innerHTML = Object.keys(MODES).map(k=>
    '<button type="button" class="gm-btn'+(k===setupMode?' sel':'')+'" data-m="'+k+'">'+MODES[k].n+'<small>'+MODES[k].sub+'</small></button>').join('');
  $('gmDesc').textContent = MODES[setupMode].d;
  $('gmRow').querySelectorAll('.gm-btn').forEach(b=>b.addEventListener('click', ()=>{ setupMode = b.dataset.m; renderModes(); }));
}
let setupN = 3;
let setupPieces = [0, 1, 2, 3];   /* 플레이어별 선택한 피규어 (PIECES 인덱스) */
let setupAI = [false, false, false, false];       /* 각 슬롯이 AI 인가 */
let setupDiff = ['mid', 'mid', 'mid', 'mid'];     /* AI 난이도: low/mid/high */
const DIFF_LABEL = {low:'하', mid:'중', high:'상'};

function renderNameInputs(){
  const box = $('nameInputs');
  const prev = [];
  box.querySelectorAll('input[type="text"]').forEach(inp=>prev.push(inp.value));
  box.innerHTML = '';
  /* 1인 모드면 최소 1명은 사람, 나머지는 자동으로 AI 기본값 */
  for(let i=0;i<setupN;i++){
    const row = document.createElement('div');
    row.className = 'nrow' + (setupAI[i] ? ' ai' : '');
    const btn = document.createElement('button');
    btn.className = 'figbtn';
    btn.type = 'button';
    btn.title = PIECES[setupPieces[i]].n + ' (눌러서 바꾸기)';
    btn.appendChild(figureStage(PIECES[setupPieces[i]].k, PCOLORS[i], false));
    btn.addEventListener('click', ()=>openPiecePicker(i));
    row.appendChild(btn);
    const dot = document.createElement('span');
    dot.className = 'pdot';
    dot.style.background = PCOLORS[i];
    dot.textContent = i+1;
    row.appendChild(dot);

    const inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 8; inp.id = 'pname'+i;
    inp.placeholder = setupAI[i] ? ('AI '+(i+1)) : ('플레이어 '+(i+1));
    inp.disabled = setupAI[i];
    if(prev[i]) inp.value = prev[i];
    row.appendChild(inp);

    /* 사람/AI 토글 */
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'aitoggle' + (setupAI[i] ? ' on' : '');
    toggle.innerHTML = setupAI[i] ? icon('bot')+'AI' : icon('user')+'사람';
    toggle.addEventListener('click', ()=>{
      setupAI[i] = !setupAI[i];
      renderNameInputs();
    });
    row.appendChild(toggle);

    /* AI 난이도 선택 */
    if(setupAI[i]){
      const diffWrap = document.createElement('div');
      diffWrap.className = 'diffsel';
      ['low','mid','high'].forEach(d=>{
        const db = document.createElement('button');
        db.type = 'button';
        db.className = 'diffbtn' + (setupDiff[i]===d ? ' sel' : '');
        db.textContent = DIFF_LABEL[d];
        db.title = {low:'하 (소극적)', mid:'중 (보통)', high:'상 (공격적)'}[d];
        db.addEventListener('click', ()=>{ setupDiff[i] = d; renderNameInputs(); });
        diffWrap.appendChild(db);
      });
      row.appendChild(diffWrap);
    }
    box.appendChild(row);
  }
}
function openPiecePicker(pi){
  const taken = {};
  for(let i=0;i<setupN;i++) if(i!==pi) taken[setupPieces[i]] = i;
  const wrap = document.createElement('div');
  wrap.className = 'figpick';
  PIECES.forEach((pc, idx)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'figopt' + (setupPieces[pi]===idx ? ' sel' : '') + (taken[idx]!==undefined ? ' taken' : '');
    if(taken[idx]!==undefined) b.disabled = true;
    const w = document.createElement('div');
    w.className = 'fwrap';
    w.appendChild(figureStage(pc.k, taken[idx]!==undefined ? '#9A9A9A' : PCOLORS[pi], false));
    b.appendChild(w);
    const lab = document.createElement('div');
    lab.className = 'flabel';
    lab.textContent = pc.n + (taken[idx]!==undefined ? ' (사용중)' : '');
    b.appendChild(lab);
    b.addEventListener('click', ()=>{
      if(taken[idx]!==undefined) return;
      setupPieces[pi] = idx;
      closeInfo();
      renderNameInputs();
      sfx('card');
    });
    wrap.appendChild(b);
  });
  infoModal('말 고르기: 플레이어 '+(pi+1),
    '<p class="hint">보드 위에서 이 피규어가 당신의 말이 됩니다. 다른 사람이 고른 말은 선택할 수 없습니다.</p>',
    [{l:'닫기', cls:'ghost'}], PCOLORS[pi]);
  $('iBody').appendChild(wrap);
}
/* 번개전: 도시를 값에 따라 세 묶음으로 나눠 묶음마다 한 곳씩 별장과 함께 나눠 준다.
   (모노폴리 '짧은 게임'처럼 땅을 갖고 시작해 첫 턴부터 통행료가 오간다) */
function dealProperties(){
  const cities = [];
  SP.forEach((sp,i)=>{ if(sp.type==='city') cities.push(i); });
  cities.sort((x,y)=>SP[x].price - SP[y].price);
  const tiers = MODE.deal, per = Math.floor(cities.length / tiers);
  const got = G.players.map(()=>[]);
  for(let t=0;t<tiers;t++){
    const pool = cities.slice(t*per, t===tiers-1 ? cities.length : (t+1)*per);
    for(let i=pool.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
    G.players.forEach((pl,k)=>{
      const idx = pool[k];
      if(idx === undefined) return;
      SP[idx].owner = pl.i; SP[idx].bl.v = 1;
      got[k].push(SP[idx].name);
    });
  }
  G.players.forEach((pl,k)=>log('📜 <b>'+esc(pl.name)+'</b>: '+got[k].join(', ')+'에 별장을 한 채씩 갖고 시작합니다.'));
}
function startGame(){
  G.n = setupN;
  MODE = MODES[setupMode] || MODES.standard;
  AI_DELAY = MODE.aiDelay;
  G.opts.takeover = $('optTakeover').checked;
  G.opts.startCash = parseInt(document.querySelector('input[name="scash"]:checked').value, 10);
  G.players = [];
  for(let i=0;i<G.n;i++){
    const inp = $('pname'+i);
    const isAI = !!setupAI[i];
    const defName = isAI ? ('AI '+(i+1)+' ['+DIFF_LABEL[setupDiff[i]]+']') : ('플레이어 '+(i+1));
    const nm = (!isAI && inp && inp.value.trim()) || defName;
    G.players.push({i:i, name:nm, color:PCOLORS[i], piece:setupPieces[i], cash:G.opts.startCash, pos:0, alive:true, island:0, travel:0, cheongyeon:0, trapped:0, trapName:'', trapIcon:'', salaryMult:1, leader:false, underdog:false, tollBuff:false, jailCount:0, careWins:0, daycareWins:0, criminal:false, cpEnjoyer:false, bhacks:false, items:{escape:0, pass:0}, ai:isAI, diff:setupDiff[i],
      stat:{tollIn:0, tollOut:0, laps:0, buys:0, builds:0, keys:0, mini:0, maxToll:0, peak:0, roundsLed:0}, outAt:0,
      strat: (/[?&]sim\b/.test(location.search) && window.__STRATS) ? window.__STRATS[i] : null});
  }
  G.deck = CARDS.slice();
  for(let i=G.deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = G.deck[i]; G.deck[i] = G.deck[j]; G.deck[j] = tmp;
  }
  G.cur = 0; G.turnNo = 1; G.fund = 0; G.over = false; G.endgameApplied = false; G.stepping = false; G.specialOwner = null; G.buffOwner = {}; G.manualPrompt = false;
  G.round = 1; G.season = 0; G.year = 1; G.festival = null; G.mono = {};
  G.hist = []; G.leadChanges = 0; G.topNow = undefined; G.eg = null; G.biggest = null; G.startedAt = Date.now();
  G.histCash = []; G.histSeason = []; G.events = []; G.ledger = []; G.tollMatrix = []; G.cityToll = {}; G.cityHits = {}; G.payCat = null;
  G.timeLeft = MODE.limit*1000; G.timeUp = false; G.finalPhase = false; G.hold = 0; G.extraRoll = false;
  document.body.classList.remove('final');
  Object.keys(TOKELS).forEach(k=>{ const e=TOKELS[k]; if(e && e.parentNode) e.parentNode.removeChild(e); delete TOKELS[k]; });
  SP.forEach(sp=>{ if(sp.type==='city'){ sp.owner=null; sp.bl={v:0,b:0,h:0,L:0}; } if(sp.type==='veh') sp.owner=null; });
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('setup').classList.add('hidden');
  $('game').classList.remove('hidden');
  placeLog();
  fitDice();
  DICE.forEach(dieRender);
  startMusic();
  pickFestival();
  Ambient.start();
  log('🌍 <b>글로벌 마블</b> '+MODE.n+' 시작! '+G.n+'명이 시작 자금 '+fmt(G.opts.startCash)+'원으로 출발합니다.');
  log('🎯 '+MODE.d);
  if(G.opts.takeover) log('🤝 인수 규칙 적용: 통행료를 낸 뒤 그 도시를 인수할 수 있습니다. 1등은 투자액의 2.5배, 꼴찌는 1.3배를 냅니다.');
  if(MODE.deal) dealProperties();
  applySeason(false);
  syncMonopolies(false);
  renderAll();
  const sn = curSeason();
  log(icon(sn.ic)+'<b>'+sn.n+'</b>으로 시작합니다. '+sn.t+': '+sn.d+'. 축제 도시는 <b>'+SP[G.festival].name+'</b> (통행료 2배)');
  startClock();
  beginTurn();
}

/* ================= 초기화 ================= */
document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    const n = parseInt(b.dataset.n, 10);
    /* "1인"은 나 혼자 + AI 상대이므로 최소 2인 판으로 구성한다.
       버튼은 사람 수를 뜻하고, 부족한 자리는 AI로 자동 채운다. */
    if(n===1){
      setupN = 2; setupAI = [false, true, false, false]; setupDiff = ['mid','mid','mid','mid'];
    } else {
      setupN = n; setupAI = [false, false, false, false]; setupDiff = ['mid','mid','mid','mid'];
    }
    renderNameInputs();
  });
});
$('startBtn').addEventListener('click', startGame);
$('rulesBtn0').addEventListener('click', showRules);
$('rulesBtn').addEventListener('click', showRules);
$('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  $('muteBtn').innerHTML = icon(muted ? 'mute' : 'volume');
});
$('musicBtn').addEventListener('click', toggleMusic);
$('autoBtn').addEventListener('click', toggleAuto);
$('concedeBtn').addEventListener('click', concede);
$('sendBtn').addEventListener('click', openSend);

/* 숨은 관리자 입력칸: 비밀번호를 입력하면 열린다 */
(function(){
  const si = $('secretIn');
  if(!si) return;
  const tryUnlock = ()=>{
    if(si.value.trim() === ADMIN_PIN){ si.value = ''; si.blur(); unlockAdmin(); }
  };
  si.addEventListener('input', tryUnlock);
  si.addEventListener('keydown', e=>{ if(e.key === 'Enter') tryUnlock(); });
})();
$('resetBtn').addEventListener('click', ()=>{
  infoModal('새 게임', '<p>지금 게임을 끝내고 처음 화면으로 돌아갈까요?</p>', [
    {l:'새 게임 시작', cls:'danger', fn:newGame},
    {l:'계속 진행', cls:'ghost'}
  ]);
});

/* 안내 모달은 바깥을 누르거나 Esc 로 닫는다 */
$('iBack').addEventListener('click', (e)=>{ if(e.target === $('iBack')) closeInfo(); });
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){ if(infoOpen()) closeInfo(); return; }
  /* 스페이스/엔터: 사람 차례의 진행 버튼(던지기, 턴 마치기)을 누른다 */
  if(e.key !== ' ' && e.key !== 'Enter') return;
  if(e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target, tag = tg && tg.tagName;
  const shown = tg && tg.offsetParent !== null;       /* 숨겨진 버튼에 남은 포커스는 무시한다 */
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if((tag === 'BUTTON' || tag === 'A') && shown) return;
  if(!G.players.length || G.over || infoOpen() || modalOpen() || rolling) return;
  const p = curP();
  if(!p || p.ai) return;
  const act = $('actions').querySelector('[data-auto="1"]:not([disabled])');
  if(act){ e.preventDefault(); act.click(); }
});

/* 진행 중인 판을 실수로 닫거나 새로고침하지 않도록 한 번 물어본다 */
window.addEventListener('beforeunload', (e)=>{
  if(leaving || !G.players.length || G.over) return;
  e.preventDefault();
  e.returnValue = '';
});

document.querySelectorAll('[data-ic]').forEach(el=>{ el.innerHTML = icon(el.dataset.ic); });
 (function(){
  const box = $('heroFigs');
  if(!box) return;
  PIECES.forEach((pc, i)=>{
    const w = document.createElement('div');
    w.className = 'hero-fig';
    w.style.animationDelay = (-i*0.55)+'s';
    w.appendChild(figureStage(pc.k, PCOLORS[i % PCOLORS.length], false));
    box.appendChild(w);
  });
})();
$('stripe').innerHTML = Object.keys(GROUPS).filter(k=>k!=='vh').map(k=>'<span style="background:'+GROUPS[k].c+'"></span>').join('');
window.addEventListener('resize', ()=>{ placeLog(); fitDice(); });
if(/[?&]sim\b/.test(location.search)) window.__gm = {G:G, assets:assets, SP:SP, endGame:endGame};   /* 밸런스 시뮬레이션용 (주소에 ?sim 이 있을 때만) */
renderModes();
document.body.dataset.season = 'spring';
Scenery.mount();
Ambient.set('spring');
Ambient.start();
buildBoard();
buildDice();
renderNameInputs();
document.querySelector('.mode-btn[data-n="3"]').classList.add('sel');
})();
