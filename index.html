function invested(sp){
  if(sp.type==='veh') return sp.price;
  return sp.price + sp.bl.v*sp.bc[0] + sp.bl.b*sp.bc[1] + sp.bl.h*sp.bc[2] + (sp.bl.L ? sp.price*2 : 0);
}
function ownedProps(p){
  const r=[]; SP.forEach((sp,i)=>{ if((sp.type==='city'||sp.type==='veh') && sp.owner===p.i) r.push(i); });
  return r;
}
function assets(p){
  return p.cash + ownedProps(p).reduce((s,i)=>s+invested(SP[i]),0);
}
/* 현금 숫자는 바뀔 때 잠깐 굴러가며 따라간다 */
let cashRAF = 0;
function cashTick(){
  cashRAF = 0;
  let more = false;
  G.players.forEach(p=>{
    if(p.shown === p.cash) return;
    const d = p.cash - p.shown;
    p.shown = Math.abs(d) <= 1 ? p.cash : p.shown + Math.sign(d)*Math.max(1, Math.round(Math.abs(d)*0.22));
    const el = document.querySelector('[data-cash="'+p.i+'"]');
    if(el) el.textContent = fmt(p.shown)+'원';
    if(p.shown !== p.cash) more = true;
  });
  if(more) cashRAF = RAF(cashTick);
}
function renderPlayers(){
  const box = $('players'); box.innerHTML='';
  /* 순위: 나보다 총자산이 많은 생존자 수 + 1. 모두 같으면 표시하지 않는다 */
  const alive = alivePlayers(), worth = alive.map(assets);
  const ranked = alive.length > 1 && Math.max.apply(null, worth) > Math.min.apply(null, worth);
  const maxWorth = Math.max(1, Math.max.apply(null, worth.length ? worth : [1]));
  G.players.forEach(p=>{
    if(p.shown === undefined || REDUCED) p.shown = p.cash;
    const rank = (ranked && p.alive) ? 1 + alive.filter(o=>assets(o) > assets(p)).length : 0;
    const chips = ownedProps(p).map(i=>{
      const sp=SP[i];
      return '<span class="chip" style="background:'+GROUPS[sp.g].c+'" title="'+sp.name+'"></span>';
    }).join('');
    const st = !p.alive ? '<span class="st dead">파산</span>' :
      p.trapped>0 ? '<span class="st isl">'+(p.trapIcon||'🏥')+' '+(p.trapName||'')+' '+p.trapped+'턴</span>' :
      p.cheongyeon>0 ? '<span class="st cy">청연 수업 '+p.cheongyeon+'턴</span>' :

      p.travel>0 ? '<span class="st trv">우주여행 대기</span>' : '';
    const items = (p.items.escape?'<span class="itm">🗝️ 탈출권 ×'+p.items.escape+'</span>':'') +
                  (p.items.pass?'<span class="itm">🎫 우대권 ×'+p.items.pass+'</span>':'') +
                  (p.loan>0?'<span class="itm">🏦 대출 이자 '+p.loan+'번</span>':'') +
                  (p.rentCap>0?'<span class="itm">📉 임대료 규제 '+p.rentCap+'턴</span>':'') +
                  (p.buildBan>0?'<span class="itm">🚧 건설 보류 '+p.buildBan+'턴</span>':'') +

                  (p.salaryMult>1 && !p.leader?'<span class="itm">💵 월급 '+p.salaryMult+'배</span>':'') +
                  (p.leader && EG.richSalary !== 1 ?'<span class="itm">👑 우세 월급 '+EG.richSalary+'배</span>':'') +
                  (p.underdog?'<span class="itm">🔥 역전 찬스 통행료 +'+Math.round((p.tollBuff||0)*100)+'%</span>':'') +
                  Object.keys(BUFFS).map(k=>{

                    if(cnt > 0 && (owner === null || owner === undefined) && p.alive) return '<span class="itm prog" title="'+b.n+': '+b.d+'">'+b.unit+' '+cnt+'/'+b.need+'</span>';

                  }).join('');

      '<div class="prow1"><span class="pdot" style="background:'+p.color+'">'+PIECES[p.piece].ic+'</span><b class="pname">'+esc(p.name)+'</b>'+st+'</div>' +
      (p.alive ? '<div class="pbar"><i style="width:'+Math.max(2, Math.round(assets(p)/maxWorth*100))+'%;background:'+p.color+'"></i></div>' : '') +
      '<div class="prow2"><span>현금 <b data-cash="'+p.i+'">'+fmt(p.shown)+'원</b></span><span class="tot">총자산 '+fmt(assets(p))+'원'+(rank ? '<i class="rk">'+rank+'위</i>' : '')+'</span></div>' +

      (items ? '<div class="prow4">'+items+'</div>' : ''));

function placeLog(){
  const l = $('log'), dock = $('logDock'), con = $('console'), bd = $('board');
  if(!l || !dock || !con || !bd) return;
  const w = bd.clientWidth;
  if(!w) return;                                   /* 아직 화면에 없음 */

}

/* ================= 모달, 액션 버튼 ================= */
let autoMode = false;
let autoTimer = null;
const AUTO_DELAY = 850;   /* 자동 진행 간격 (ms) */

/* 자동 모드: 화면이 바뀔 때마다 호출되어, 살지 말지 결정(구매 모달)만 남기고
   주사위 굴리기, 각종 확인, 턴 마치기를 자동으로 눌러준다. */
function autoCancel(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer = null; } }
function scheduleAuto(){
  if(!autoMode || G.over) return;
  if(curP() && curP().ai) return;   /* AI 차례는 AI 드라이버가 처리 */
  autoCancel();
  autoTimer = setTimeout(autoStep, AUTO_DELAY);
}
function autoStep(){
  autoTimer = null;
  if(!autoMode || G.over) return;
  if(infoOpen()){ scheduleAuto(); return; }   /* 규칙이나 칸 정보를 읽는 동안은 기다린다 */
  /* 모달이 열려 있으면: 구매 결정 모달만 사람 몫으로 남기고 나머지는 기본 버튼 자동 클릭 */
  if(modalOpen()){
    if(G.manualPrompt) return;              /* 땅 구입/건설/인수는 직접 결정 */
    if($('mBody').querySelector('[data-selfpaced]')) return;   /* 미니게임은 직접 한다 */
    if(modalWho && modalWho.ai) return;     /* AI에게 묻는 모달은 AI가 처리 */
    const abtn = $('mBtns').querySelector('[data-auto="1"]')
              || $('mBtns').querySelector('.btn.primary:not([disabled])')
              || [...$('mBtns').querySelectorAll('.btn:not([disabled])')].pop();
    if(abtn){ abtn.click(); scheduleAuto(); }
    return;
  }
  /* 액션 버튼: 자동 진행용으로 지정된 버튼을 누른다 */
  const act = $('actions').querySelector('[data-auto="1"]:not([disabled])');
  if(act){ act.click(); scheduleAuto(); }
}

/* 진행 모달: 게임 흐름이 답을 기다리는 창. opts.who 는 이 창에 답해야 하는 참가자
   (생략하면 현재 차례). 자동 모드와 AI 드라이버가 이 값을 보고 누가 누를지 정한다. */
let modalWho = null;
function modalOpen(){ return !$('mBack').classList.contains('hidden'); }
function modal(title, body, btns, headColor, opts){
  autoCancel();
  $('mBox').classList.remove('wide');
  modalWho = (opts && opts.who) || null;
  $('mTitle').innerHTML = iconize(josa(title));
  $('mTitle').style.setProperty('--hc', headColor || '');
  $('mBody').innerHTML = iconize(josa(body));
  const bb = $('mBtns'); bb.innerHTML='';
  let autoIdx = -1;
  (btns||[]).forEach((b,i)=>{
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls||'ghost');
    el.innerHTML = iconize(b.l);
    if(b.dis) el.disabled = true;
    if(b.auto) { el.setAttribute('data-auto','1'); autoIdx = i; }
    el.onclick = ()=>{ if(!b.keep) closeModal(); if(b.fn) b.fn(); };

  if(autoIdx < 0){

}

   진행 모달 위에 따로 뜨므로 서로 덮어쓰지 않고, 열려 있는 동안 자동 모드와 AI는 기다린다. */

function setActions(list){

  /* 자동 진행 대상 미지정 시: 던지기/도전/턴 마치기 같은 단일 진행 버튼을 기본 지정 */
  if(!a.querySelector('[data-auto="1"]')){

  log(autoMode ? '⏩ 자동 모드를 켰습니다. 주사위와 턴 넘기기가 자동으로 진행되며, 땅 구입 여부만 직접 결정합니다.' : '⏸️ 자동 모드를 껐습니다.');

function fxOn(){ return !REDUCED && !!$('fx'); }
function fxPut(el, ms){
  const layer = $('fx');
  if(!layer) return;
  layer.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, ms);
}
function ctrOf(el){
  if(!el || !el.getBoundingClientRect) return null;
  const r = el.getBoundingClientRect();
  if(!r.width && !r.height) return null;
  return {x:r.left + r.width/2, y:r.top + r.height/2};
}
function cellPt(idx){ return ctrOf(document.querySelector('.cell[data-idx="'+idx+'"]')); }
function playerPt(p){
  const cell = document.querySelector('.cell[data-idx="'+p.pos+'"]');

}

/* ================= 칸별 특수 효과 =================
   우주여행: 로켓이 포물선을 그리며 날아간다 / 순간이동: 소용돌이 포털 / 감옥: 철창이 내려온다
   황금열쇠: 열쇠가 빛나며 떠오른다 / 기금, 월급: 동전이 쏟아진다 */
function cellRect(idx){ const c = document.querySelector('.cell[data-idx="'+idx+'"]'); return c ? c.getBoundingClientRect() : null; }
function fxRocket(fromIdx, toIdx, color){
  if(!fxOn()) return 0;
  const a = cellPt(fromIdx), b = cellPt(toIdx);
  if(!a || !b) return 0;
  const el = document.createElement('div');
  el.className = 'fxrocket';
  el.style.setProperty('--c', color || '#fff');
  el.innerHTML = '<i class="flame"></i>' + icon('p-rocket');
  const mid = {x:(a.x+b.x)/2, y:Math.min(a.y, b.y) - Math.max(140, Math.hypot(b.x-a.x, b.y-a.y)*0.45)};
  const N = 28, frames = [];
  for(let i=0;i<=N;i++){
    const t = i/N, u = 1-t;
    const x = u*u*a.x + 2*u*t*mid.x + t*t*b.x, y = u*u*a.y + 2*u*t*mid.y + t*t*b.y;
    const dx = 2*u*(mid.x-a.x) + 2*t*(b.x-mid.x), dy = 2*u*(mid.y-a.y) + 2*t*(b.y-mid.y);
    const ang = Math.atan2(dy, dx)*180/Math.PI + 90;
    const sc = 0.7 + Math.sin(t*Math.PI)*0.9;
    frames.push({transform:'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,-50%) rotate('+ang.toFixed(1)+'deg) scale('+sc.toFixed(2)+')', opacity: i===N ? 0 : 1});
  }
  fxPut(el, 1250);
  if(el.animate) el.animate(frames, {duration:1100, easing:'cubic-bezier(.45,.05,.35,1)', fill:'forwards'});
  /* 꼬리 불꽃 */
  for(let k=1;k<12;k++) setTimeout(()=>{
    const t = k/12, u = 1-t;
    fxSpark({x:u*u*a.x + 2*u*t*mid.x + t*t*b.x, y:u*u*a.y + 2*u*t*mid.y + t*t*b.y}, k%2 ? '#FFB347' : '#FFE08A', 3);
  }, k*85);
  fxRing(a, '#FFB347');
  setTimeout(()=>{ fxRing(b, color || '#fff'); fxSpark(b, '#FFE08A', 14); }, 1050);
  return 1100;
}

/* 돈이 오갈 때: 동전이 낸 사람에게서 받는 쪽으로 줄지어 포물선을 그리며 날아간다 */
function arcPt(a, m, b, t){ const u = 1 - t; return {x:u*u*a.x + 2*u*t*m.x + t*t*b.x, y:u*u*a.y + 2*u*t*m.y + t*t*b.y}; }
function fxCoinFlow(a, b, amt){
  if(!fxOn() || !a || !b) return;
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  if(dist < 8){ fxSpark(b, '#FFD54A', 6); return; }
  const n = Math.max(3, Math.min(14, Math.round(2 + Math.sqrt(Math.max(1, amt))*0.8)));
  const dur = Math.round(560 + Math.min(320, dist*0.4));
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'fxcoin2';
    const lift = Math.max(46, dist*0.38) * (0.75 + Math.random()*0.5);
    const m = {x:(a.x + b.x)/2 + (Math.random() - 0.5)*50, y:Math.min(a.y, b.y) - lift};
    const frames = [];
    for(let k=0;k<=12;k++){
      const t = k/12, q = arcPt(a, m, b, t);
      frames.push({transform:'translate('+q.x.toFixed(1)+'px,'+q.y.toFixed(1)+'px) translate(-50%,-50%) rotateY('+(k*70)+'deg) scale('+(0.65 + Math.sin(t*Math.PI)*0.55).toFixed(2)+')', opacity:k===12 ? 0.3 : 1});
    }
    const delay = i*55;
    el.style.opacity = '0';
    fxPut(el, dur + delay + 80);
    if(el.animate) el.animate(frames, {duration:dur, delay:delay, easing:'cubic-bezier(.45,.05,.45,1)', fill:'both'});
  }
  setTimeout(()=>{ fxSpark(b, '#FFD54A', 8); fxRing(b, '#FFD54A'); }, dur + (n-1)*55);
}

function fxStream(a, b, color, ms){
  if(!fxOn() || !a || !b) return;
  ms = ms || 420;
  const m = {x:(a.x + b.x)/2, y:Math.min(a.y, b.y) - Math.max(60, Math.hypot(b.x - a.x, b.y - a.y)*0.3)};
  const el = document.createElement('div');
  el.className = 'fxstream';
  el.style.setProperty('--c', color || '#B9A6FF');
  const frames = [];
  for(let k=0;k<=16;k++){
    const t = k/16, q = arcPt(a, m, b, t), u = 1 - t;
    const dx = 2*u*(m.x - a.x) + 2*t*(b.x - m.x), dy = 2*u*(m.y - a.y) + 2*t*(b.y - m.y);
    frames.push({transform:'translate('+q.x.toFixed(1)+'px,'+q.y.toFixed(1)+'px) rotate('+(Math.atan2(dy, dx)*180/Math.PI).toFixed(1)+'deg)', opacity:k===16 ? 0 : 1});
  }
  fxPut(el, ms + 60);
  if(el.animate) el.animate(frames, {duration:ms, easing:'cubic-bezier(.5,0,.4,1)', fill:'forwards'});
  for(let k=1;k<8;k++) setTimeout(()=>fxSpark(arcPt(a, m, b, k/8), color || '#B9A6FF', 2), k*ms/8);
}

function fxMonoWave(g, color){
  if(!fxOn()) return;
  const cells = SP.map((s, i)=>i).filter(i=>SP[i].type==='city' && SP[i].g===g);
  cells.forEach((i, k)=>setTimeout(()=>{ fxFlashCell(i); fxRing(cellPt(i), color); fxSpark(cellPt(i), color, 6); }, k*150));
  setTimeout(()=>fxShow(cellPt(cells[Math.floor(cells.length/2)]), [color, '#FFFFFF', '#FFD54A'], 2), cells.length*150);
}

function tokenEl(p){ const el = TOKELS[p.i]; return el && el.isConnected ? el : null; }
function tokenAnim(p, cls, ms){
  if(!fxOn()) return;
  const el = tokenEl(p);
  if(!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), ms || 900);
}
function tokenSay(p, kind){
  if(!fxOn()) return;
  const el = tokenEl(p);
  const lines = TALK[kind];
  if(!el || !lines) return;
  const r = el.getBoundingClientRect();
  const b = document.createElement('div');
  b.className = 'fxbubble';
  /* 근처에 이미 떠 있는 말풍선이 있으면 그 위로 비켜 띄운다 */
  let x = r.left + r.width/2, y = r.top + 2;
  for(let tries = 0; tries < 4; tries++){
    const hit = [...document.querySelectorAll('.fxbubble')].some(o=>Math.abs(parseFloat(o.style.left) - x) < 110 && Math.abs(parseFloat(o.style.top) - y) < 30);
    if(!hit) break;
    y -= 34;
  }
  b.style.left = x+'px'; b.style.top = y+'px';
  b.style.setProperty('--c', p.color);
  b.textContent = lines[Math.floor(Math.random()*lines.length)];
  fxPut(b, 1700);
}
function othersOn(p){ return G.players.filter(o=>o!==p && o.alive && o.pos===p.pos); }
function tokenMeet(p){
  const others = othersOn(p);
  if(!others.length) return;
  tokenAnim(p, 'bump', 600);
  tokenSay(p, 'meet');
  others.forEach((o,k)=>setTimeout(()=>{ tokenAnim(o, 'knock', 600); if(k===0) setTimeout(()=>tokenSay(o, 'knocked'), 380); }, 140));
}
function tokenFaint(p){
  if(!fxOn()) return;
  const el = tokenEl(p);
  if(!el) return;
  const r = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.className = 'token fxfaint';
  ghost.style.position = 'fixed';
  ghost.style.left = r.left+'px'; ghost.style.top = r.top+'px'; ghost.style.width = r.width+'px'; ghost.style.height = r.height+'px';
  ghost.style.fontSize = getComputedStyle(el).fontSize;
  fxPut(ghost, 1300);
}

function gain(p, amt, why, cat){
  p.cash += amt;
  book(p, 'in', cat || 'luck', amt);
  sfx('coin');
  const pt = playerPt(p);
  fxFloat(pt, '+'+fmt(amt), 'pos');
  log('💵 <b>'+esc(p.name)+'</b> '+why+' <b class="pos">+'+fmt(amt)+'원</b>');
  renderPlayers();
  checkEndgameSwap();
}
function paySalary(p, why){
  if(p.loan > 0){
    p.loan--;
    log('🏦 <b>'+esc(p.name)+'</b>: 이번 월급은 대출 이자로 빠져나갔습니다.'+(p.loan ? ' (남은 '+p.loan+'번)' : ' 대출을 다 갚았습니다.'));
    renderPlayers();
    return;
  }
  let m = p.salaryMult || 1;
  const boost = catchUpSalary(p) && m < 1.5;
  if(boost) m = 1.5;                                  /* 역전 월급 (최후 2인 혜택과는 겹치지 않는다) */
  sfx('salary');
  fxCoins(cellPt(0), 10);
  gain(p, Math.round(salaryNow() * m), (why || '월급') + (boost ? ' (역전 보너스 1.5배)' : m !== 1 ? ' ('+m+'배)' : ''), 'salary');
}
function pay(from, amt, dest, why, cb){
  /* dest: 'bank' | 'fund' | 플레이어 객체 */
  const destName = dest==='bank' ? '은행' : dest==='fund' ? '사회복지기금' : dest.name;
  const settle = ()=>{
    const fromPt = playerPt(from);
    const toPt = (dest!=='bank' && dest!=='fund') ? playerPt(dest) : null;
    from.cash -= amt;
    if(dest==='fund') G.fund += amt;
    else if(dest!=='bank') dest.cash += amt;
    const cat = payCat(dest, why);
    book(from, 'out', cat, amt); book(dest, 'in', cat, amt);
    if(cat==='toll') tollMat(from, dest, amt);
    fxCoinFlow(fromPt, toPt || (dest==='fund' ? cellPt(FUND_IDX) : null), amt);
    sfx('pay');
    fxFloat(fromPt, '-'+fmt(amt), 'neg');
    if(toPt) fxFloat(toPt, '+'+fmt(amt), 'pos');
    log('💸 <b>'+esc(from.name)+'</b> → '+esc(destName)+' '+why+' <b class="neg">-'+fmt(amt)+'원</b>');
    renderAll();
    checkEndgameSwap();
    cb(true);
  };
  if(from.cash >= amt){ settle(); return; }
  const raiseMax = from.cash + ownedProps(from).reduce((s,i)=>s+Math.floor(invested(SP[i])/2),0);
  if(raiseMax < amt){
    modal('💥 파산 위기',
      '<p><b>'+esc(from.name)+'</b>이(가) '+why+'(으)로 <b>'+fmt(amt)+'원</b>을 내야 하지만, 모든 부동산을 처분해도 마련할 수 없습니다.</p>' +
      '<p>남은 현금은 <b>'+esc(destName)+'</b>'+((dest==='bank'||dest==='fund')?'(으)로':'에게')+' 가고, 부동산은 모두 건물이 헐린 빈 땅으로 돌아갑니다.</p>',
      [{l:'파산 처리', cls:'danger', fn:()=>{ G.payCat = payCat(dest, why); bankrupt(from, dest, cb); }}], '#8C2F2F', {who:from});
    return;
  }
  sellFlow(from, amt, why, settle);
}
function sellToBank(p, idx){
  const sp = SP[idx];
  const val = Math.floor(invested(sp)/2);
  sp.owner = null;
  if(sp.type==='city') sp.bl = {v:0,b:0,h:0,L:0};
  p.cash += val;
  book(p, 'in', 'prop', val);
  sfx('coin');
  log('🏦 <b>'+esc(p.name)+'</b>이(가) <b>'+sp.name+'</b>을(를) 은행에 '+fmt(val)+'원에 매각했습니다.');
  renderAll();
  checkEndgameSwap();
  syncMonopolies(false);
}
function sellFlow(from, amt, why, onReady){
  const rerun = ()=>{
    const need = amt - from.cash;
    if(need <= 0){
      modal('자금 마련 완료',
        '<p>필요한 금액이 준비되었습니다.</p><p class="big-amt">'+why+': <b class="neg">'+fmt(amt)+'원</b></p>',
        [{l:'지불하기', cls:'primary', fn:onReady}], null, {who:from});
      return;
    }
    const rows = ownedProps(from).map(i=>{
      const sp = SP[i], val = Math.floor(invested(sp)/2);
      return '<div class="sellrow"><span class="chip" style="background:'+GROUPS[sp.g].c+'"></span>' +
        '<span class="srn">'+sp.name+bldStr(sp)+'</span>' +
        '<button class="btn mini" data-sell="'+i+'">'+fmt(val)+'원에 매각</button></div>';
    }).join('');
    modal('현금이 부족합니다',
      '<p><b>'+esc(from.name)+'</b>: '+why+' <b>'+fmt(amt)+'원</b> 중 <b class="neg">'+fmt(need)+'원</b>이 부족합니다.</p>' +
      '<p class="hint">부동산을 은행에 매각해 자금을 마련하세요. 매각가는 투자액의 절반입니다.</p>' +
      '<div class="selllist" data-need="'+need+'">'+rows+'</div>', [], '#8C2F2F', {who:from});
    $('mBody').querySelectorAll('[data-sell]').forEach(btn=>{
      btn.onclick = ()=>{ sellToBank(from, parseInt(btn.dataset.sell,10)); rerun(); };
    });
  };
  rerun();
}
function bankrupt(from, dest, cb){
  tokenFaint(from);
  from.alive = false;
  from.outAt = G.turnNo;
  const cash = from.cash; from.cash = 0;
  const props = ownedProps(from);
  {
    const cat = G.payCat || 'luck';
    G.payCat = null;
    book(from, 'out', cat, cash); book(dest, 'in', cat, cash);
    if(cat==='toll' && cash > 0 && dest && typeof dest === 'object') tollMat(from, dest, cash);
    markEvent('bankrupt', from, from.name+' 파산');
  }
  /* 부동산은 누구에게도 넘어가지 않고 건물이 헐린 빈 땅으로 돌아간다. 한 사람에게 몰아주면 판이 기울기 때문 */
  props.forEach(i=>{ SP[i].owner = null; if(SP[i].type==='city') SP[i].bl = {v:0,b:0,h:0,L:0}; fxFlashCell(i); });
  if(dest!=='bank' && dest!=='fund'){
    dest.cash += cash;
    log('💥 <b>'+esc(from.name)+'</b> 파산! 남은 현금 '+fmt(cash)+'원만 <b>'+esc(dest.name)+'</b>에게 가고, 부동산 '+props.length+'곳은 빈 땅으로 돌아갑니다.', 'big');
  } else {
    if(dest==='fund') G.fund += cash;
    log('💥 <b>'+esc(from.name)+'</b> 파산! 부동산 '+props.length+'곳이 빈 땅으로 돌아갑니다.', 'big');
  }
  /* 보관하던 석방권, 우대권 카드는 더미로 되돌린다 */
  ['escape','pass'].forEach(k=>{
    if(from.items[k] > 0){
      const card = CARDS.filter(c=>c.k===k)[0];
      if(card && G.deck.indexOf(card) < 0) G.deck.push(card);
    }
  });
  from.items = {escape:0, pass:0};
  from.loan = 0; from.rentCap = 0; from.buildBan = 0;
  from.travel = 0; from.island = 0; from.cheongyeon = 0; from.trapped = 0; from.trapName=''; from.trapIcon='';
  from.leader = false; from.underdog = false; from.tollBuff = false; from.criminal = false; from.cpEnjoyer = false; from.bhacks = false;
  Object.keys(G.buffOwner || {}).forEach(k=>{ if(G.buffOwner[k] === from.i) G.buffOwner[k] = null; });   /* 파산하면 능력은 다시 주인을 찾는다 */
  sfx('bad');
  fxShake();
  fxScreen('rgba(200,50,40,.55)');
  renderAll();
  checkEndgame();
  checkWinner();
  if(!G.over) syncMonopolies(true);
  if(cb) cb(false);
}

/* ================= 이동 ================= */
function stepMove(p, steps, cb){
  if(REDUCED){
    for(let s=0;s<steps;s++){ p.pos=(p.pos+1)%44; if(p.pos===0){ p.stat.laps++; paySalary(p); } }
    renderTokens(); cb(); return;
  }
  let s = 0;
  G.stepping = true;
  const iv = setInterval(()=>{
    fxTrail(p.pos, p.color);
    p.pos = (p.pos+1)%44;
    if(p.pos===0){ p.stat.laps++; paySalary(p); }
    sfx('tick');
    renderTokens();
    s++;
    if(s < steps && othersOn(p).length) tokenAnim(p, 'leap', 260);   /* 다른 말 위로 폴짝 */
    if(s>=steps){
      clearInterval(iv);
      G.stepping = false;
      renderTokens();
      fxFlashCell(p.pos);
      tokenMeet(p);
      setTimeout(cb, othersOn(p).length ? 520 : 200);
    }
  }, MODE.stepMs);
}
function teleport(p, dest, giveSalary, cb){
  if(giveSalary && dest < p.pos) paySalary(p);
  const from = cellPt(p.pos);
  p.pos = dest;
  renderTokens();
  if(from){ fxRing(from, p.color); fxStream(from, cellPt(dest), p.color, 360); }
  fxRing(cellPt(dest), p.color);
  fxFlashCell(dest);
  setTimeout(cb, REDUCED ? 0 : 260);
}

/* ================= 턴 진행 ================= */
/* ================= AI 플레이어 =================
   시뮬레이션 결과: 공격적으로 사고 즉시 건물(특히 호텔)을 짓는 쪽이 강하고,
   현금만 쥐고 있으면 거의 진다. 난이도는 그 공격성으로 조절한다.
   하(low): 소극적, 건물 거의 안 지음 / 중(mid): 적당히 / 상(high): 최적 공격형. */
let aiTimer = null;
let AI_DELAY = 700;

function aiCancel(){ if(aiTimer){ clearTimeout(aiTimer); aiTimer = null; } }
/* AI가 움직여야 할 때: 현재 차례가 AI이거나, AI에게 답을 묻는 모달(통행료 마련 등)이 떠 있을 때 */
function aiSchedule(){
  if(G.over || !G.players.length) return;
  const p = curP();
  if(!((p && p.ai) || (modalOpen() && modalWho && modalWho.ai))) return;
  aiCancel();
  aiTimer = setTimeout(aiStep, AI_DELAY);
}

/* 난이도별 파라미터 */
function aiParams(diff){
  if(diff==='low')  return { reserve:70, buyMax:15, buildAggr:0.15, wantLandmark:false, takeover:false, buyVeh:false };
  if(diff==='high') return { reserve:5,  buyMax:999, buildAggr:1.0, wantLandmark:true, takeover:true, buyVeh:true };
  return              { reserve:35, buyMax:999, buildAggr:0.6, wantLandmark:true, takeover:false, buyVeh:true }; /* mid */
}
/* 이 도시를 p 가 가지면 그 지역 독점이 완성되는가 */
function completesGroup(p, sp){
  if(sp.type!=='city') return false;
  return SP.every(o=>o.type!=='city' || o.g!==sp.g || o===sp || o.owner===p.i);
}
/* 이 도시만 남기고 한 상대가 그 지역을 다 가졌는가 (사서 막아야 하는 땅) */
function blocksGroup(p, sp){
  if(sp.type!=='city') return false;
  const rest = SP.filter(o=>o.type==='city' && o.g===sp.g && o!==sp);
  return rest.length > 0 && rest[0].owner!==null && rest[0].owner!==p.i && rest.every(o=>o.owner===rest[0].owner);
}
/* ================= AI 전략(성격) =================
   전략이 정해진 AI는 땅 구입, 건설, 인수, 우주여행 목적지를 이 규칙대로 고른다.
   (그 밖의 판단, 예를 들어 미니게임과 우대권 사용은 난이도 '중'의 기본 판단을 따른다) */
const BUILD_MAX = (p, sp, reserve)=>{                /* 지을 수 있는 가장 높은 건물부터 */
  if(sp.bl.v && sp.bl.b && sp.bl.h && !sp.bl.L) return p.cash - buildCost(sp,'L') >= reserve ? 'L' : null;
  if(!sp.bl.h && p.cash - buildCost(sp,2) >= reserve) return 2;
  if(!sp.bl.b && p.cash - buildCost(sp,1) >= reserve) return 1;
  if(!sp.bl.v && p.cash - buildCost(sp,0) >= reserve) return 0;
  return null;
};
const BUILD_CHEAP = (p, sp, reserve)=>{              /* 싼 건물부터 차근차근 */
  if(!sp.bl.v && p.cash - buildCost(sp,0) >= reserve) return 0;
  if(!sp.bl.b && p.cash - buildCost(sp,1) >= reserve) return 1;
  if(!sp.bl.h && p.cash - buildCost(sp,2) >= reserve) return 2;
  if(sp.bl.v && sp.bl.b && sp.bl.h && !sp.bl.L && p.cash - buildCost(sp,'L') >= reserve) return 'L';
  return null;
};
const groupMine = (p, sp)=>SP.filter(o=>o.type==='city' && o.g===sp.g && o.owner===p.i).length;
const groupRival = (p, sp)=>SP.some(o=>o.type==='city' && o.g===sp.g && o.owner!==null && o.owner!==p.i);
const STRATS = {
  builder:   {n:'개발 집중', d:'보이는 땅은 다 사고, 가장 비싼 건물부터 바로 올린다',
    buy:(p,sp,pr)=>p.cash - pr >= 5,
    build:(p,sp)=>BUILD_MAX(p, sp, 5),
    takeover:(p,sp,cost)=>p.cash - cost >= 15},
  landlord:  {n:'땅 부자', d:'땅과 교통수단을 최대한 많이 사고 건물은 짓지 않는다',
    buy:(p,sp,pr)=>p.cash - pr >= 0,
    build:()=>null,
    takeover:(p,sp,cost)=>p.cash - cost >= 10},
  saver:     {n:'현금 보수', d:'현금 80만원을 늘 남겨 두고 남는 돈으로만 사고 짓는다',
    buy:(p,sp,pr)=>p.cash - pr >= 80,
    build:(p,sp)=>BUILD_CHEAP(p, sp, 80),
    takeover:()=>false},
  monopolist:{n:'독점 집중', d:'경쟁자가 없는 지역만 모으고, 독점한 지역에만 건물을 몰아 짓는다',
    buy:(p,sp,pr)=>{
      if(p.cash < pr) return false;
      if(sp.type!=='city') return false;
      if(completesGroup(p, sp) || blocksGroup(p, sp)) return true;
      return !groupRival(p, sp) && p.cash - pr >= 5;
    },
    build:(p,sp)=>groupOwner(sp.g)===p.i ? BUILD_MAX(p, sp, 0) : (groupMine(p, sp) >= 2 ? BUILD_CHEAP(p, sp, 40) : null),
    takeover:(p,sp,cost)=>completesGroup(p, sp) && p.cash >= cost},
  premium:   {n:'고가 지역', d:'땅값 24만원 이상인 비싼 도시와 교통수단만 사서 크게 짓는다',
    buy:(p,sp,pr)=>(sp.type==='veh' || sp.price >= 24) && p.cash - pr >= 5,
    build:(p,sp)=>BUILD_MAX(p, sp, 10),
    takeover:(p,sp,cost)=>sp.price >= 24 && p.cash - cost >= 20},
  budget:    {n:'저가 다수', d:'땅값 18만원 이하인 싼 도시만 사서 빠르게 꽉 채운다',
    buy:(p,sp,pr)=>sp.type==='city' && sp.price <= 18 && p.cash - pr >= 5,
    build:(p,sp)=>BUILD_MAX(p, sp, 5),
    takeover:(p,sp,cost)=>sp.price <= 18 && p.cash - cost >= 15},
  random:    {n:'무작위', d:'살지, 지을지, 무엇을 지을지를 동전 던지기로 정한다',
    buy:(p,sp,pr)=>p.cash >= pr && Math.random() < 0.5,
    build:(p,sp)=>{ if(Math.random() < 0.5) return null; const o = [0,1,2].filter(k=>!sp.bl[['v','b','h'][k]] && p.cash >= buildCost(sp,k)); return o.length ? o[Math.floor(Math.random()*o.length)] : null; },
    takeover:(p,sp,cost)=>p.cash >= cost && Math.random() < 0.3},
  balanced:  {n:'균형 (기본 AI)', d:'지금 게임의 난이도 \'중\' AI와 같다', buy:null, build:null, takeover:null}
};
const stratOf = (p)=>(p && p.strat && STRATS[p.strat] && STRATS[p.strat].buy) ? STRATS[p.strat] : null;

/* 빈 땅 구입 결정 */
function aiWantBuy(p, sp){
  const S = stratOf(p);
  if(S) return S.buy(p, sp, buyPrice(sp));
  const P = aiParams(p.diff), price = buyPrice(sp);
  if(sp.type==='veh' && !P.buyVeh) return false;
  /* 독점을 완성하거나 상대의 독점을 막는 땅은 여유 자금을 깨서라도 산다 */
  if(p.diff!=='low' && p.cash >= price && (completesGroup(p, sp) || blocksGroup(p, sp))) return true;
  if(p.cash - price < P.reserve) return false;
  if(sp.type==='city' && sp.price > P.buyMax && p.diff==='low') return false;
  return true;
}
/* 어떤 건물을 지을지: 0(별장)/1(빌딩)/2(호텔)/'L'(랜드마크)/null */
function aiPickBuild(p, sp){
  const S = stratOf(p);
  if(S) return S.build(p, sp);
  const P = aiParams(p.diff);
  /* 중/하는 가끔 건너뛴다 (상은 buildAggr 1.0 이라 항상 짓는다) */
  if(Math.random() > P.buildAggr) return null;
  /* 풀하우스면 랜드마크 */
  if(sp.bl.v && sp.bl.b && sp.bl.h && !sp.bl.L){
    if(P.wantLandmark && p.cash - buildCost(sp, 'L') >= P.reserve) return 'L';
    return null;
  }
  /* 상: 호텔 우선, 중: 빌딩까지, 하: 별장만 가끔 */
  if(p.diff==='high'){
    if(!sp.bl.h && p.cash - buildCost(sp, 2) >= P.reserve) return 2;
    if(!sp.bl.b && p.cash - buildCost(sp, 1) >= P.reserve) return 1;
    if(!sp.bl.v && p.cash - buildCost(sp, 0) >= P.reserve) return 0;
  } else if(p.diff==='mid'){
    if(!sp.bl.b && p.cash - buildCost(sp, 1) >= P.reserve) return 1;
    if(!sp.bl.v && p.cash - buildCost(sp, 0) >= P.reserve) return 0;
    if(!sp.bl.h && p.cash - buildCost(sp, 2) >= P.reserve*1.4) return 2;
  } else {
    if(!sp.bl.v && p.cash - buildCost(sp, 0) >= P.reserve) return 0;
  }
  return null;
}
function aiWantTakeover(p, sp){
  const deal = takeoverDeal(p, sp);
  if(!deal || p.cash < deal.cost) return false;
  const cost = deal.cost;
  const S = stratOf(p);
  if(S) return S.takeover(p, sp, cost);
  const P = aiParams(p.diff);
  if(p.diff!=='low' && completesGroup(p, sp)) return true;                  /* 독점이 완성되면 인수 */
  if(p.cash - cost < Math.max(P.reserve, 30)) return false;
  if(deal.built) return p.diff!=='low' && calcToll(sp) >= 20 && deal.mult <= 2;   /* 건물째 인수: 돈 되는 도시를, 배율이 너무 크지 않을 때만 */
  return P.takeover;
}
/* 돈이 모자랄 때 무엇을 팔지: 한 번에 메울 수 있으면 통행료 수입이 가장 적은 것,
   안 되면 매각가가 가장 큰 것부터 판다. */
function aiPickSell(p, need){
  const props = ownedProps(p).map(i=>({i:i, val:Math.floor(invested(SP[i])/2), toll:calcToll(SP[i])}));
  if(!props.length) return -1;
  const cover = props.filter(x=>x.val >= need);
  if(cover.length){ cover.sort((a,b)=>a.toll-b.toll || a.val-b.val); return cover[0].i; }
  props.sort((a,b)=>b.val-a.val);
  return props[0].i;
}
/* 우주여행 목적지: 살 만한 빈 땅 → 건물을 더 올릴 내 도시 → 기금 접수처 → 출발지(월급) */
function aiPickTravel(p, fee){
  const S = stratOf(p);
  if(S){
    /* 전략대로 살 땅 가운데 가장 비싼 곳 → 건물을 올릴 내 도시 → 기금 → 출발지 */
    let best = -1;
    const saved = p.cash; p.cash = saved - (fee||0);
    SP.forEach((sp,i)=>{
      if(i===p.pos || sp.owner!==null || (sp.type!=='city' && sp.type!=='veh')) return;
      if(S.buy(p, sp, buyPrice(sp)) && (best<0 || sp.price > SP[best].price)) best = i;
    });
    if(best < 0) SP.forEach((sp,i)=>{
      if(i===p.pos || sp.type!=='city' || sp.owner!==p.i) return;
      if(S.build(p, sp) !== null && (best<0 || sp.price > SP[best].price)) best = i;
    });
    p.cash = saved;
    if(best >= 0) return best;
    return (G.fund >= 20 && p.pos !== FUND_IDX) ? FUND_IDX : 0;
  }
  const P = aiParams(p.diff);
  const cash = p.cash - (fee||0);
  if(p.diff !== 'low'){
    let best = -1, bestScore = -1;
    SP.forEach((sp,i)=>{
      if(i===p.pos || sp.owner!==null) return;
      if(sp.type!=='city' && !(sp.type==='veh' && P.buyVeh)) return;
      const done = completesGroup(p, sp) || blocksGroup(p, sp);
      if(cash - buyPrice(sp) < (done ? 0 : P.reserve)) return;
      const score = sp.price + (done ? 1000 : 0);                 /* 독점이 걸린 땅이 최우선 */
      if(best<0 || score > bestScore){ best = i; bestScore = score; }
    });
    if(best>=0) return best;
    SP.forEach((sp,i)=>{
      if(sp.type!=='city' || sp.owner!==p.i || i===p.pos) return;
      const full = sp.bl.v && sp.bl.b && sp.bl.h;
      const can = (!sp.bl.v && cash-buildCost(sp, 0) >= P.reserve) || (!sp.bl.b && cash-buildCost(sp, 1) >= P.reserve) ||
                  (!sp.bl.h && cash-buildCost(sp, 2) >= P.reserve) ||
                  (full && !sp.bl.L && P.wantLandmark && cash-buildCost(sp, 'L') >= P.reserve);
      if(can && (best<0 || sp.price > SP[best].price)) best = i;
    });
    if(best>=0) return best;
  }
  return (G.fund >= 20 && p.pos !== FUND_IDX) ? FUND_IDX : 0;
}

/* 열려 있는 진행 모달을 AI가 대신 선택한다. 처리했으면 true. */
function aiHandleModal(p){
  if(!modalOpen()) return false;
  const title = $('mTitle').textContent;
  const body = $('mBody');
  const btns = [...$('mBtns').querySelectorAll('.btn')];
  const click = (re, fallbackFirst)=>{
    const b = btns.find(x=>re.test(x.textContent) && !x.disabled);
    if(b){ b.click(); return true; }
    if(fallbackFirst){ const f = btns.find(x=>!x.disabled); if(f){ f.click(); return true; } }
    return false;
  };
  if(body.querySelector('[data-selfpaced]')) return true;        /* 황금열쇠 미니게임은 AI 차례에 스스로 진행된다 */
  /* 본문 안에서 고르는 창들 (아래쪽 버튼이 없다) */
  const sellList = body.querySelector('.selllist[data-need]');
  if(sellList){
    const i = aiPickSell(p, parseInt(sellList.dataset.need, 10) || 0);
    const b = body.querySelector('[data-sell="'+i+'"]') || body.querySelector('[data-sell]');
    if(b){ b.click(); return true; }
    return false;
  }
  const halfs = [...body.querySelectorAll('[data-hs]')];
  if(halfs.length){
    /* 반액 대매출: 투자액이 가장 적은 것을 내놓는다 */
    halfs.sort((x,y)=>invested(SP[+x.dataset.hs]) - invested(SP[+y.dataset.hs]));
    halfs[0].click(); return true;
  }
  const grid = body.querySelector('.pickgrid[data-fee]');
  if(grid){
    const b = body.querySelector('[data-go="'+aiPickTravel(p, parseInt(grid.dataset.fee, 10) || 0)+'"]');
    if(b){ b.click(); return true; }
    return click(/주사위/, true);
  }
  const hands = [...body.querySelectorAll('.rps-btn')];
  if(hands.length){
    /* 요양원 가위바위보: 아직 안 냈으면 아무 손이나 낸다. 결과는 타이머가 공개한다 */
    if(!hands.some(h=>h.classList.contains('sel'))) hands[Math.floor(Math.random()*hands.length)].click();
    return true;
  }
  const sp = SP[p.pos];
  if(title.indexOf('매물')>=0){
    if(sp && aiWantBuy(p, sp) && p.cash>=buyPrice(sp)) return click(/구입하기/, false) || click(/사지 않기/);
    return click(/사지 않기/);
  }
  if(title.indexOf('랜드마크')>=0){
    if(sp && aiPickBuild(p, sp)==='L' && p.cash>=buildCost(sp, 'L')) return click(/랜드마크 건설/) || click(/짓지 않기/);
    return click(/짓지 않기/);
  }
  if(title.indexOf('건설')>=0){
    if(sp){
      const choice = aiPickBuild(p, sp);
      if(choice===0) return click(/별장/) || click(/짓지 않기/);
      if(choice===1) return click(/빌딩/) || click(/짓지 않기/);
      if(choice===2) return click(/호텔/) || click(/짓지 않기/);
    }
    return click(/짓지 않기/);
  }
  if(title.indexOf('인수')>=0){
    if(sp && aiWantTakeover(p, sp)) return click(/인수하기/) || click(/괜찮습니다/);
    return click(/괜찮습니다/);
  }
  if(title.indexOf('통행료')>=0){
    /* 우대권: 통행료가 크거나 현금으로 못 낼 때만 쓴다 (하 난이도는 못 낼 때만) */
    const passBtn = btns.find(x=>/우대권/.test(x.textContent) && !x.disabled);
    if(passBtn && sp && sp.owner!==null && sp.owner!==p.i){
      const toll = finalToll(p, G.players[sp.owner], sp);
      if(toll > p.cash || (p.diff!=='low' && toll >= 15)){ passBtn.click(); return true; }
    }
    return click(/지불하기/, true);
  }
  /* 그 외 모달(황금열쇠, 순간이동, 특별버프 획득 등)은 기본(primary/마지막) 클릭 */
  const def = btns.find(x=>x.classList.contains('primary') && !x.disabled) || btns.filter(x=>!x.disabled).pop();
  if(def){ def.click(); return true; }
  return false;
}

function aiStep(){
  aiTimer = null;
  if(G.over) return;
  if(infoOpen()){ aiSchedule(); return; }     /* 사람이 규칙이나 칸 정보를 읽는 동안은 기다린다 */
  /* 모달 우선 처리. 사람에게 묻는 모달(예: 생일 축하금 마련)은 건드리지 않는다 */
  if(modalOpen()){
    const who = modalWho || curP();
    if(who && who.ai) aiHandleModal(who);
    aiSchedule();
    return;
  }
  const p = curP();
  if(!p || !p.ai) return;
  /* 액션 버튼: 던지기/도전/턴 마치기/이용 등 진행 버튼을 누른다 */
  const acts = [...$('actions').querySelectorAll('.btn:not([disabled])')];
  if(acts.length){
    /* 감옥: 아직 살 땅이 넉넉히 남아 있으면 석방권을 써서 바로 나온다 */
    const out = acts.find(b=>/탈출권/.test(b.textContent));
    const unowned = SP.filter(sp=>(sp.type==='city'||sp.type==='veh') && sp.owner===null).length;
    const pick = (out && p.diff!=='low' && unowned >= 6) ? out
      : (acts.find(b=>/던지기|도전|턴 마치기|이용|확인/.test(b.textContent)) || acts[0]);
    pick.click();
    aiSchedule();
    return;
  }
  /* 아무것도 없으면 잠시 후 다시 */
  aiSchedule();
}

function beginTurn(){
  if(G.over) return;
  disarmFlick();
  hideSum();
  G.pendingDouble = false; G.extraRoll = false; G.chain = 0;
  const p = curP();
  if(p.rentCap > 0) p.rentCap--;                       /* 악재 카드는 자기 차례가 올 때마다 1턴씩 줄어든다 */
  if(p.buildBan > 0) p.buildBan--;
  renderBanner(); renderPlayers(); renderTokens();
  log('<span class="turnline"><i class="tl-dot" style="background:'+p.color+'"></i>'+G.turnNo+'턴 · <b>'+esc(p.name)+'</b></span>');
  if(p.ai){ aiSchedule(); }   /* AI 차례면 자동으로 진행 */
  if(p.trapped > 0){ trappedTurn(p); return; }
  if(p.cheongyeon > 0){ cheongyeonTurn(p); return; }
  if(p.island > 0){ islandTurn(p); return; }
  if(p.travel > 0){ travelTurn(p); return; }
  rollTurn();
}
/* '윤성'이 이름에 들어간 플레이어는 요양원/어린이집에 걸리면 2턴 갇히고
   매 턴 1~50만원을 확률적으로 얻는다. */
function isYoonseong(p){ return (p.name || '').indexOf('윤성') >= 0; }
function trapReward(){ return 1 + Math.floor(Math.random()*50); }   /* 1 ~ 50만원 */
function yoonseongTrap(p, place, icon, done){
  if(!isYoonseong(p)) return false;
  p.trapped = 2; p.trapName = place; p.trapIcon = icon;
  log(icon+' <b>'+esc(p.name)+'</b>은(는) '+place+'에서 헤어나오지 못합니다. 2턴 동안 갇힙니다!');
  const amt = trapReward();
  gain(p, amt, place+' 봉사 사례');
  fxFlashCell(p.pos);
  modal(icon+' '+place+'에 붙잡히다',
    '<div class="keycard"><div class="keytitle">'+place+'</div>' +
    '<p><b>'+esc(p.name)+'</b>님은 정이 넘쳐 '+place+'을(를) 떠나지 못합니다.</p>' +
    '<p class="hint">앞으로 2턴 동안 이곳에 머무릅니다. 대신 매 턴 1만원에서 50만원까지 사례를 받습니다. (이번 턴 '+fmt(amt)+'원)</p></div>',
    [{l:'확인', cls:'primary', fn:done}], '#2E7D46');
  renderPlayers();
  return true;
}
function trappedTurn(p){
  const amt = trapReward();
  gain(p, amt, (p.trapName || '봉사') + ' 사례');
  p.trapped--;
  const icon = p.trapIcon || '🏥';
  log(icon+' <b>'+esc(p.name)+'</b>: '+(p.trapName||'')+'에서 봉사하며 '+fmt(amt)+'원을 받았습니다.' +
    (p.trapped>0 ? ' (남은 '+p.trapped+'턴)' : ' 드디어 나왔습니다!'));
  if(p.trapped===0){ p.trapName=''; p.trapIcon=''; }
  renderPlayers();
  offerEndTurn();
}
function cheongyeonTurn(p){
  gain(p, 20, '청연 수업료');
  p.cheongyeon--;
  log('📐 <b>'+esc(p.name)+'</b>: "당신은 대치청연에서 여준영과 수학을 가르치고 있습니다." 20만원을 받았습니다.' + (p.cheongyeon>0 ? ' (남은 '+p.cheongyeon+'턴)' : ' 수업이 끝났습니다.'));
  renderPlayers();
  offerEndTurn();
}
/* ================= 송금 =================
   자기 차례의 사람이, 게임이 입력을 기다리는 동안 다른 생존자에게 현금을 보낸다. */
function openSend(){
  if(G.over || !G.players.length) return;
  const p = curP();
  if(!p || !p.alive) return;
  if(p.ai){ infoModal('송금', '<p>지금은 <b>'+esc(p.name)+'</b>의 차례입니다. 송금은 자기 차례에만 할 수 있습니다.</p>', [{l:'확인', cls:'primary'}]); return; }
  if(!gameIdle()){ infoModal('송금', '<p>이동과 처리가 끝난 뒤에 다시 눌러 주세요. 주사위를 던지기 전이나 턴을 마치기 전에 보낼 수 있습니다.</p>', [{l:'확인', cls:'primary'}]); return; }
  const others = alivePlayers().filter(o=>o!==p);
  if(!others.length || p.cash <= 0){ infoModal('송금', '<p>보낼 수 있는 상대나 현금이 없습니다.</p>', [{l:'확인', cls:'primary'}]); return; }
  let to = others[0];
  const body =
    '<div class="sd">' +
      '<p class="hint"><span class="pdot sm" style="background:'+p.color+'">'+PIECES[p.piece].ic+'</span> <b>'+esc(p.name)+'</b>의 현금 <b>'+fmt(p.cash)+'원</b>에서 보냅니다.</p>' +
      '<div class="sd-to">'+others.map(o=>'<button type="button" class="sd-pick'+(o===to?' sel':'')+'" data-to="'+o.i+'"><span class="pdot sm" style="background:'+o.color+'">'+PIECES[o.piece].ic+'</span>'+esc(o.name)+'</button>').join('')+'</div>' +
      '<div class="sd-amt"><input id="sendAmt" type="number" min="1" max="'+p.cash+'" value="'+Math.min(10, p.cash)+'" inputmode="numeric"><span>만원</span></div>' +
      '<div class="sd-quick">'+[5,10,30,50].filter(v=>v<=p.cash).map(v=>'<button type="button" data-q="'+v+'">'+v+'만</button>').join('')+'<button type="button" data-q="'+p.cash+'">전액</button></div>' +
      '<p class="mg-status" id="sendMsg"></p>' +
    '</div>';
  infoModal('송금', body, [
    {l:'보내기', cls:'primary', keep:true, fn:()=>{
      const amt = parseInt($('sendAmt').value, 10);
      const msg = $('sendMsg');
      if(!(amt > 0)){ msg.innerHTML = '<span class="neg">1만원 이상 입력하세요.</span>'; return; }
      if(amt > p.cash){ msg.innerHTML = '<span class="neg">현금이 '+fmt(p.cash)+'원뿐입니다.</span>'; return; }
      if(curP() !== p || !gameIdle()){ closeInfo(); return; }
      closeInfo();
      const a0 = playerPt(p), b0 = playerPt(to);
      p.cash -= amt; to.cash += amt;
      book(p, 'out', 'gift', amt); book(to, 'in', 'gift', amt);
      sfx('coin');
      fxFloat(a0, '-'+fmt(amt), 'neg'); fxFloat(b0, '+'+fmt(amt), 'pos'); fxCoinFlow(a0, b0, amt);
      log('💸 <b>'+esc(p.name)+'</b> → <b>'+esc(to.name)+'</b> 송금 <b class="neg">'+fmt(amt)+'원</b>');
      renderAll();
      checkEndgameSwap();
    }},
    {l:'취소', cls:'ghost'}
  ]);
  $('iBody').querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click', ()=>{
    to = G.players[+b.dataset.to];
    $('iBody').querySelectorAll('[data-to]').forEach(x=>x.classList.toggle('sel', x===b));
  }));
  $('iBody').querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click', ()=>{ $('sendAmt').value = b.dataset.q; }));
}

/* 게임이 사람의 입력(던지기, 턴 마치기 등)을 기다리며 멈춰 있는가 */
function gameIdle(){
  return !G.over && !rolling && !G.stepping && !modalOpen() && !!$('actions').querySelector('.btn');
}
function concede(){
  if(G.over || !G.players.length) return;
  const p = curP();
  if(!p.alive){ return; }
  if(p.ai){
    infoModal('🏳️ 기권', '<p>지금은 <b>'+esc(p.name)+'</b>의 차례입니다. 기권은 자기 차례에만 할 수 있습니다.</p>',
      [{l:'확인', cls:'primary'}], '#8C2F2F');
    return;
  }
  if(!gameIdle()){
    infoModal('🏳️ 기권', '<p>이동과 처리가 끝난 뒤에 다시 눌러 주세요. 주사위를 던지기 전이나 턴을 마치기 전에 기권할 수 있습니다.</p>',
      [{l:'확인', cls:'primary'}], '#8C2F2F');
    return;
  }
  infoModal('🏳️ 기권',
    '<p><b>'+esc(p.name)+'</b>님이 기권하시겠습니까?</p>' +
    '<p class="hint">기권하면 즉시 파산 처리되어 게임에서 빠집니다. 소유하던 부동산은 모두 매물로 풀립니다.</p>',
    [
      {l:'🏳️ 기권하기', cls:'danger', fn:()=>{
        if(curP()!==p || !p.alive || !gameIdle()) return;   /* 확인하는 사이 상황이 바뀌었으면 취소 */
        disarmFlick();
        setActions([]);
        log('🏳️ <b>'+esc(p.name)+'</b>이(가) 기권을 선언했습니다.', 'big');
        bankrupt(p, 'bank', ()=>{ if(!G.over) endTurn(); });
      }},
      {l:'취소', cls:'ghost'}
    ], '#8C2F2F');
}
function endTurn(){
  if(G.over) return;
  G.pendingDouble = false; G.chain = 0;
  if(autoEndT){ clearTimeout(autoEndT); autoEndT = null; }
  let i = G.cur;
  do { i = (i+1)%G.n; } while(!G.players[i].alive);
  if(i <= G.cur){                    /* 모두 한 번씩 돌아 라운드가 끝났다 */
    if(G.timeUp){ endGame('time'); return; }
    nextRound();
    if(G.over) return;
  }
  G.cur = i; G.turnNo++;
  beginTurn();
}
function endOfAction(){
  if(G.over) return;
  const p = curP();
  if(!p.alive){ endTurn(); return; }
  if((G.pendingDouble || G.extraRoll) && p.island===0 && p.cheongyeon===0 && p.trapped===0 && p.travel===0){
    log(G.pendingDouble ? '🎲 더블 보너스! 한 번 더 굴립니다.' : '🎲 보너스 굴림! 한 번 더 굴립니다.');
    if(G.pendingDouble) G.pendingDouble = false; else G.extraRoll = false;
    rollTurn();
    return;
  }
  G.extraRoll = false;
  offerEndTurn();
}

/* ================= 3D 물리 주사위 =================
   좌표계: 바닥면의 로컬 좌표. x = 화면 오른쪽, y = 바닥 앞쪽(+가 보는 사람 쪽), h = 바닥에서의 높이.
   바닥을 30도만 기울여 위에서 내려다보므로 윗면(나온 눈)이 가장 크게 보인다.
   물리 세계는 트레이 높이를 WORLD_H 로 본 가상 크기로 고정하고, 화면에는 배율(DSCALE)로 맞춘다. */
const DIE_PX = 46, HALF = DIE_PX / 2, REST_H = HALF;
const TILT_DEG = 30, TILT = TILT_DEG * Math.PI / 180, COS_T = Math.cos(TILT), SIN_T = Math.sin(TILT);
const WORLD_H = 186;
const GRAV = 4200;        /* 중력 (px/s^2) */
const RESTITUTION = 0.36; /* 바닥 반발 계수 */
const WALL = 0.55;        /* 벽 반발 계수 */
const SETTLE_K = 14;      /* 면 정렬 토크 세기 */
const HIT_DIST = DIE_PX * 1.1;   /* 두 주사위 중심이 이보다 가까우면 부딪친 것으로 본다 */
const HIT_BOUNCE = 0.5;          /* 주사위끼리의 반발 계수 */
const nowMs = () => (window.performance && performance.now) ? performance.now() : Date.now();
const RAF = window.requestAnimationFrame
  ? (f) => window.requestAnimationFrame(f)
  : (f) => setTimeout(f, 16);
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);

/* --- 벡터, 쿼터니언 [w,x,y,z] --- */
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
function qMul(a,b){
  return [
    a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
    a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
    a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
    a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]
  ];
}
function qNorm(q){
  const n = Math.sqrt(q[0]*q[0]+q[1]*q[1]+q[2]*q[2]+q[3]*q[3]) || 1;
  return [q[0]/n,q[1]/n,q[2]/n,q[3]/n];
}
function qFromAxis(ax, ang){
  const s = Math.sin(ang/2);
  return qNorm([Math.cos(ang/2), ax[0]*s, ax[1]*s, ax[2]*s]);
}
function qRotVec(q, v){
  const t = cross([q[1],q[2],q[3]], v).map(c => c*2);
  const c2 = cross([q[1],q[2],q[3]], t);
  return [v[0]+q[0]*t[0]+c2[0], v[1]+q[0]*t[1]+c2[1], v[2]+q[0]*t[2]+c2[2]];
}
function randomQuat(){ /* Shoemake 균등 랜덤 회전 */
  const u1=Math.random(), u2=Math.random(), u3=Math.random();
  const s1=Math.sqrt(1-u1), s2=Math.sqrt(u1);
  return qNorm([s2*Math.cos(2*Math.PI*u3), s1*Math.sin(2*Math.PI*u2), s1*Math.cos(2*Math.PI*u2), s2*Math.sin(2*Math.PI*u3)]);
}
/* 면 법선: +Z=1, -Z=6, +X=3, -X=4, +Y=2, -Y=5 (마주보는 면의 합은 7) */
const FACE_Q = {
  1:[1,0,0,0],
  6:qFromAxis([1,0,0],  Math.PI),
  3:qFromAxis([0,1,0], -Math.PI/2),
  4:qFromAxis([0,1,0],  Math.PI/2),
  2:qFromAxis([1,0,0],  Math.PI/2),
  5:qFromAxis([1,0,0], -Math.PI/2)
};
function faceAxes(q){
  return [qRotVec(q,[1,0,0]), qRotVec(q,[0,1,0]), qRotVec(q,[0,0,1])];
}
/* 위를 향한 면의 눈금 (물리 결과가 곧 주사위 값) */
function readValue(q){
  const a = faceAxes(q), bx=a[0], by=a[1], bz=a[2];
  const cand = [[bz[2],1],[-bz[2],6],[bx[2],3],[-bx[2],4],[by[2],2],[-by[2],5]];
  let best = cand[0];
  for(const c of cand) if(c[0] > best[0]) best = c;
  return best[1];
}
/* 위를 향한 면의 법선 벡터 */
function upNormal(q){
  const a = faceAxes(q), bx=a[0], by=a[1], bz=a[2];
  const neg = (v)=>[-v[0],-v[1],-v[2]];
  const c = [bz, neg(bz), bx, neg(bx), by, neg(by)];
  let best = c[0];
  for(const v of c) if(v[2] > best[2]) best = v;
  return best;
}
/* 윗면을 정확히 수평으로 눕힌다. 바닥에서 돌아간 각도(요)는 그대로 두어 멈춘 자세가 자연스럽다 */
function flattenQ(q){
  const n = upNormal(q);
  const ax = cross(n, [0,0,1]);
  const len = Math.sqrt(ax[0]*ax[0]+ax[1]*ax[1]+ax[2]*ax[2]);
  if(len < 1e-6) return qNorm(q);
  return qNorm(qMul(qFromAxis([ax[0]/len, ax[1]/len, ax[2]/len], Math.acos(clamp(n[2], -1, 1))), q));
}

/* --- 트레이 크기에 맞춘 배율과 벽 위치 --- */
const BOUNDS = {x:150, y0:-30, y1:74};
let DSCALE = 1;
function fitDice(){
  const stage = $('diceStage'), floor = $('diceFloor');
  if(!stage || !floor) return;
  const W = stage.clientWidth, H = stage.clientHeight;
  if(!W || !H) return;
  DSCALE = H / WORLD_H;
  const k = DSCALE.toFixed(4);
  floor.style.transform = 'rotateX('+TILT_DEG+'deg) scale3d('+k+','+k+','+k+')';
  const halfW = W / DSCALE / 2, halfH = WORLD_H / 2;
  BOUNDS.x  = Math.max(HALF + 6, halfW - HALF - 12);
  BOUNDS.y1 = Math.max(12, (halfH - 14) / COS_T - HALF);                      /* 앞쪽 벽 */
  BOUNDS.y0 = -Math.max(6, (halfH - DIE_PX * SIN_T - 12) / COS_T - HALF);    /* 뒤쪽 벽: 주사위 키만큼 여유를 둔다 */
}
const restSpot = (i) => ({x:(i ? 1 : -1) * 33, y:22});

/* --- 주사위 만들기와 그리기 --- */
let DICE = [];
const LIGHT = (()=>{ const v = [-0.40, 0.38, 0.83], n = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]); return [v[0]/n, v[1]/n, v[2]/n]; })();
function pipHTML(v){
  let h = '';
  for(let i=1;i<=9;i++) h += '<span class="'+(PIPS[v].indexOf(i)>=0?'pip':'')+'"></span>';
  return h;
}
function buildDice(){
  const floor = $('diceFloor');
  if(!floor) return;
  floor.innerHTML = ''; DICE = [];
  for(let i=0;i<2;i++){
    const sh = document.createElement('div');
    sh.className = 'dshadow';
    floor.appendChild(sh);
    const el = document.createElement('div');
    el.className = 'd3';
    let h = '';
    for(let v=1;v<=6;v++) h += '<div class="core c'+v+'"></div>';
    for(let v=1;v<=6;v++) h += '<div class="face f'+v+'">'+pipHTML(v)+'</div>';
    el.innerHTML = h;
    floor.appendChild(el);
    const faces = {}, shv = {};
    for(let v=1;v<=6;v++) faces[v] = el.querySelector('.f'+v);
    DICE.push({el:el, sh:sh, faces:faces, shv:shv, q:[1,0,0,0], x:0, y:0, h:REST_H,
               vx:0, vy:0, vh:0, w:[0,0,0], done:true, aligned:true, value:1, n:0});
  }
  showFaceStatic(DICE[0], 5, 0);
  showFaceStatic(DICE[1], 3, 1);
  const tray = $('diceTray');
  if(tray){
    tray.addEventListener('pointerdown', onDiceDown);
    tray.addEventListener('pointermove', onDiceMove);
    tray.addEventListener('pointerup', onDiceUp);
    tray.addEventListener('pointercancel', onDiceUp);
  }
}
/* 면이 빛을 받는 정도에 따라 어둡게 덮는다. 구르는 동안 면마다 밝기가 달라져 입체감이 산다 */
function shadeFace(d, v, dot){
  const sh = ((0.6 - 0.6*Math.max(0, dot)) * 0.74).toFixed(2);
  if(d.shv[v] !== sh){ d.shv[v] = sh; d.faces[v].style.setProperty('--sh', sh); }
}
function dieRender(d){
  const q = qNorm(d.q);
  const w = clamp(q[0], -1, 1);
  const ang = 2*Math.acos(w);
  const s = Math.sqrt(Math.max(0, 1-w*w));
  let ax=1, ay=0, az=0;
  if(s > 1e-6){ ax=q[1]/s; ay=q[2]/s; az=q[3]/s; }
  d.el.style.transform = 'translate3d('+d.x.toFixed(2)+'px,'+d.y.toFixed(2)+'px,'+d.h.toFixed(2)+'px) ' +
    'rotate3d('+ax.toFixed(4)+','+ay.toFixed(4)+','+az.toFixed(4)+','+ang.toFixed(4)+'rad)';
  /* 그림자: 높이 뜰수록 옅고 넓어지며, 빛의 반대쪽으로 조금 밀린다 */
  const lift = Math.max(0, d.h - REST_H), t = Math.min(1, lift/110);
  d.sh.style.transform = 'translate3d('+(d.x + 3 + lift*0.24).toFixed(2)+'px,'+(d.y - 2 - lift*0.18).toFixed(2)+'px,0.3px) scale('+(1 + t*0.6).toFixed(3)+')';
  d.sh.style.opacity = (0.6 - t*0.42).toFixed(3);
  const a = faceAxes(q);
  const lx = a[0][0]*LIGHT[0] + a[0][1]*LIGHT[1] + a[0][2]*LIGHT[2];
  const ly = a[1][0]*LIGHT[0] + a[1][1]*LIGHT[1] + a[1][2]*LIGHT[2];
  const lz = a[2][0]*LIGHT[0] + a[2][1]*LIGHT[1] + a[2][2]*LIGHT[2];
  shadeFace(d, 3, lx); shadeFace(d, 4, -lx);
  shadeFace(d, 2, ly); shadeFace(d, 5, -ly);
  shadeFace(d, 1, lz); shadeFace(d, 6, -lz);
}
function showFaceStatic(d, v, i){
  /* 살짝 비뚤게 놓아 손으로 내려놓은 듯 보이게 한다 */
  d.q = qMul(qFromAxis([0,0,1], i ? -0.24 : 0.17), FACE_Q[v]);
  d.value = v; d.done = true; d.aligned = true; d.n = 0;
  const r = restSpot(i);
  d.x = r.x; d.y = r.y; d.h = REST_H;
  d.vx = d.vy = d.vh = 0; d.w = [0,0,0];
  dieRender(d);
}

/* --- 물리 --- */
function integrateQ(d, dt){
  const dq = qMul([0, d.w[0], d.w[1], d.w[2]], d.q);
  d.q = qNorm([d.q[0]+0.5*dq[0]*dt, d.q[1]+0.5*dq[1]*dt, d.q[2]+0.5*dq[2]*dt, d.q[3]+0.5*dq[3]*dt]);
}
/* 멈출 무렵 가장 위를 향한 면을 수평으로 눕히는 보정 토크 */
function settleTorque(d, dt){
  const n = upNormal(d.q);
  const dot = clamp(n[2], -1, 1);
  if(dot > 0.9985){
    d.aligned = true;
    d.w = [d.w[0]*0.3, d.w[1]*0.3, d.w[2]*0.3];
    return;
  }
  d.aligned = false;
  const ax = cross(n, [0,0,1]);
  const len = Math.sqrt(ax[0]*ax[0]+ax[1]*ax[1]+ax[2]*ax[2]) || 1;
  const k = Math.acos(dot) * SETTLE_K;
  d.w = [d.w[0]*0.35 + ax[0]/len*k, d.w[1]*0.35 + ax[1]/len*k, d.w[2]*0.35 + ax[2]/len*k];
}
const FIXED_DT = 1/180;      /* 고정 시간간격: 기기 성능과 무관하게 같은 결과 */
const DAMP_AT = 390, SNAP_AT = 720, DAMP_K = 0.98991;
let rigDice = null;          /* 관리자 모드에서 다음 굴림의 눈금을 지정 */
let simSilent = false;       /* 헤드리스 탐색 중에는 소리를 내지 않는다 */

/* flick 이 있으면 손에서 놓은 던지기(손가락 속도를 그대로 싣는다), 없으면 제자리에서 톡 튀어 오른다 */
function launchDie(d, i, flick){
  d.done = false; d.aligned = false; d.n = 0;
  d.q = randomQuat();                       /* 자세부터 완전 무작위: 어느 눈이든 같은 확률 */
  d.x = clamp(d.x, -BOUNDS.x, BOUNDS.x);
  d.y = clamp(d.y, BOUNDS.y0, BOUNDS.y1);
  let sp;
  if(flick){
    sp = clamp(flick.speed, 300, 2400);
    d.vx = clamp(flick.vx, -1500, 1500)*0.55 + (i ? 1 : -1)*rnd(20, 90) + rnd(-50, 50);
    d.vy = clamp(flick.vy, -1500, 1500)*0.55 + rnd(-60, 60);
    d.vh = 360 + sp*0.2 + rnd(0, 120);
    d.h = Math.max(d.h, REST_H + 6);
  } else {
    sp = rnd(700, 1300);
    d.vx = (i ? 1 : -1)*rnd(50, 180) + rnd(-70, 70);
    d.vy = rnd(-170, 80);
    d.vh = rnd(640, 860);
    d.h = Math.max(d.h, REST_H + 2);
  }
  const m = 7 + sp/280 + Math.random()*8;   /* 강한 무작위 스핀 → 결과 균등 무작위 */
  d.w = [(Math.random()*2-1)*m, (Math.random()*2-1)*m, (Math.random()*2-1)*m];
}
function stepDie(d, dt){
  if(d.done) return;
  d.n++;
  d.vh -= GRAV*dt;
  d.x += d.vx*dt; d.y += d.vy*dt; d.h += d.vh*dt;
  integrateQ(d, dt);
  if(d.x >  BOUNDS.x){ d.x =  BOUNDS.x; d.vx = -d.vx*WALL; }
  if(d.x < -BOUNDS.x){ d.x = -BOUNDS.x; d.vx = -d.vx*WALL; }
  if(d.y > BOUNDS.y1){ d.y = BOUNDS.y1; d.vy = -d.vy*WALL; }
  if(d.y < BOUNDS.y0){ d.y = BOUNDS.y0; d.vy = -d.vy*WALL; }
  let onFloor = false;
  if(d.h <= REST_H){
    d.h = REST_H; onFloor = true;
    if(d.vh < -45){
      if(Math.abs(d.vh) > 260 && !simSilent) sfx('tick');   /* 부딪히는 소리 */
      d.vh = -d.vh*RESTITUTION;
      const c = cross([0,0,1], [d.vx, d.vy, 0]);            /* 구르는 회전 부여 */
      const k = 1/(HALF*1.2);
      d.w = [d.w[0]*0.55 + c[0]*k, d.w[1]*0.55 + c[1]*k, d.w[2]*0.55 + c[2]*k];
    } else d.vh = 0;
    const f = 1 - Math.min(1, 6.5*dt);                      /* 바닥 마찰 */
    d.vx *= f; d.vy *= f;
  }
  const lin = Math.sqrt(d.vx*d.vx + d.vy*d.vy + d.vh*d.vh);
  const spin = Math.sqrt(d.w[0]*d.w[0] + d.w[1]*d.w[1] + d.w[2]*d.w[2]);
  if(onFloor){ const gd = 1-Math.min(1, 2.2*dt); d.w = [d.w[0]*gd, d.w[1]*gd, d.w[2]*gd]; } /* 회전 마찰 */
  if(onFloor && lin < 110 && spin < 9) settleTorque(d, dt);
  else { const ad = 1-1.2*dt; d.w = [d.w[0]*ad, d.w[1]*ad, d.w[2]*ad]; }
  if(d.n > DAMP_AT){                                        /* 수렴 보조 */
    d.vx *= DAMP_K; d.vy *= DAMP_K;
    d.w = [d.w[0]*DAMP_K, d.w[1]*DAMP_K, d.w[2]*DAMP_K];
  }
  if(d.n > SNAP_AT){ snapDie(d); return; }                  /* 안전망 */
  if(onFloor && lin < 8 && spin < 0.5 && d.aligned) snapDie(d);
}
/* 주사위끼리 부딪치면 서로 밀어내고 튕긴다. 이미 멈춘 주사위는 밀리지 않는다.
   무작위 요소가 없어 같은 출발 상태면 언제나 같은 결과가 나온다. */
function collideDice(a, b){
  if(a.done && b.done) return;
  let dx = b.x-a.x, dy = b.y-a.y, dz = b.h-a.h;
  let d2 = dx*dx + dy*dy + dz*dz;
  if(d2 >= HIT_DIST*HIT_DIST) return;
  if(dx*dx + dy*dy < 16){ dx += 6; d2 = dx*dx + dy*dy + dz*dz; }   /* 정확히 포개지면 옆으로 미끄러지게 */
  const dist = Math.sqrt(d2) || 1, nx = dx/dist, ny = dy/dist, nz = dz/dist;
  const pen = Math.max(0, HIT_DIST - dist);
  const ma = a.done ? 0 : 1, mb = b.done ? 0 : 1, tot = ma + mb;
  a.x -= nx*pen*ma/tot; a.y -= ny*pen*ma/tot; a.h = Math.max(REST_H, a.h - nz*pen*ma/tot);
  b.x += nx*pen*mb/tot; b.y += ny*pen*mb/tot; b.h = Math.max(REST_H, b.h + nz*pen*mb/tot);
  const rv = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny + (b.vh-a.vh)*nz;
  if(rv >= 0) return;
  const j = -(1 + HIT_BOUNCE)*rv/tot;
  const k = Math.min(9, -rv/90);                                    /* 부딪친 방향으로 살짝 돌려 준다 */
  if(ma){ a.vx -= j*nx; a.vy -= j*ny; a.vh -= j*nz; a.w = [a.w[0] + ny*k, a.w[1] - nx*k, a.w[2] + k*0.4]; a.aligned = false; }
  if(mb){ b.vx += j*nx; b.vy += j*ny; b.vh += j*nz; b.w = [b.w[0] - ny*k, b.w[1] + nx*k, b.w[2] - k*0.4]; b.aligned = false; }
  if(-rv > 240 && !simSilent) sfx('tick');
}
function snapDie(d){
  d.value = readValue(d.q);
  d.q = flattenQ(d.q);
  d.h = REST_H; d.vx = d.vy = d.vh = 0; d.w = [0,0,0];
  d.done = true; d.aligned = true;
}
function dieSnap(d){ return {q:d.q.slice(), x:d.x, y:d.y, h:d.h, vx:d.vx, vy:d.vy, vh:d.vh, w:d.w.slice()}; }
function dieLoad(d, s){
  d.q = s.q.slice(); d.x = s.x; d.y = s.y; d.h = s.h;
  d.vx = s.vx; d.vy = s.vy; d.vh = s.vh; d.w = s.w.slice();
  d.n = 0; d.done = false; d.aligned = false;
}
function stepPair(a, b){
  stepDie(a, FIXED_DT); stepDie(b, FIXED_DT); collideDice(a, b);
}
/* 지정한 눈금이 실제로 나오는 출발 상태를 물리로 찾는다.
   결과를 나중에 덮어쓰는 것이 아니라, 그 눈금이 나오는 진짜 굴림을 골라 던진다.
   두 주사위가 서로 부딪치므로 한 쌍을 함께 굴려 본다. */
function findLaunchPair(flick, target){
  const ghost = (d)=>({q:d.q.slice(), x:d.x, y:d.y, h:d.h, vx:0, vy:0, vh:0, w:[0,0,0], done:false, aligned:false, value:1, n:0});
  const prev = simSilent; simSilent = true;
  let found = null;
  for(let t=0; t<3000 && !found; t++){
    const a = ghost(DICE[0]), b = ghost(DICE[1]);
    launchDie(a, 0, flick); launchDie(b, 1, flick);
    const snaps = [dieSnap(a), dieSnap(b)];
    let g = 0;
    while((!a.done || !b.done) && g < 1500){ stepPair(a, b); g++; }
    if(!a.done) snapDie(a);
    if(!b.done) snapDie(b);
    if(a.value === target[0] && b.value === target[1]) found = snaps;
  }
  simSilent = prev;
  return found;
}
function startDiceSim(flick, done){
  fitDice();
  const rig = rigDice; rigDice = null;
  const snaps = rig ? findLaunchPair(flick, rig) : null;
  DICE.forEach((d,i)=>{ if(snaps) dieLoad(d, snaps[i]); else launchDie(d, i, flick); });
  renderBanner();
  let last = nowMs(), acc = 0, fired = false;
  function loop(){
    const t = nowMs();
    let dt = (t-last)/1000; last = t;
    if(!(dt > 0)) dt = 0.016;
    if(dt > 0.05) dt = 0.05;
    acc += dt;
    let guard = 0;
    while(acc >= FIXED_DT && guard < 60){          /* 고정 스텝으로 결정론적 적분 */
      stepPair(DICE[0], DICE[1]);
      acc -= FIXED_DT; guard++;
    }
    if(DICE[0].done && DICE[1].done){
      /* 드물게 포개진 채 멈췄으면 눈은 그대로 두고 자리만 떼어 놓는다 */
      const a = DICE[0], b = DICE[1];
      let dx = b.x-a.x, dy = b.y-a.y, dd = Math.sqrt(dx*dx+dy*dy);
      if(dd < DIE_PX*1.04){
        if(dd < 0.01){ dx = 1; dy = 0; dd = 1; }
        const push = (DIE_PX*1.04 - dd)/2;
        a.x = clamp(a.x - dx/dd*push, -BOUNDS.x, BOUNDS.x); b.x = clamp(b.x + dx/dd*push, -BOUNDS.x, BOUNDS.x);
        a.y = clamp(a.y - dy/dd*push, BOUNDS.y0, BOUNDS.y1); b.y = clamp(b.y + dy/dd*push, BOUNDS.y0, BOUNDS.y1);
      }
      DICE.forEach(dieRender);
      if(!fired){ fired = true; setTimeout(()=>done(DICE[0].value, DICE[1].value), 220); }
      return;
    }
    DICE.forEach(dieRender);
    RAF(loop);
  }
  RAF(loop);
}

/* --- 던지기 흐름: 버튼을 누르거나, 주사위를 잡아 끌다가 놓아서 던진다 --- */
let rolling = false, diceArmed = null, diceHold = null;
function setDiceHint(on){
  const tray = $('diceTray');
  if(!tray) return;
  const p = G.players.length ? curP() : null;
  tray.classList.toggle('armed', !!on);
  tray.classList.toggle('human', !!on && !!p && !p.ai);
  const h = $('diceHint');
  if(h) h.textContent = on ? '주사위를 잡아서 던지거나 버튼을 누르세요' : '';
}
function armFlick(resolve){ diceArmed = {resolve:resolve}; setDiceHint(true); }
function disarmFlick(){ diceArmed = null; endHold(); setDiceHint(false); }
function showSum(a, b){
  const el = $('diceSum');
  if(!el) return;
  el.innerHTML = '<span>'+a+' + '+b+'</span><b>'+(a+b)+'</b>'+(a===b ? '<i class="tag">더블</i>' : '');
  el.classList.toggle('dbl', a===b);
  el.classList.add('show');
}
function hideSum(){ const el = $('diceSum'); if(el) el.classList.remove('show', 'dbl'); }
function runThrow(flick, done){
  if(REDUCED){
    const rig = rigDice; rigDice = null;
    const v1 = rig ? rig[0] : 1+Math.floor(Math.random()*6);
    const v2 = rig ? rig[1] : 1+Math.floor(Math.random()*6);
    showFaceStatic(DICE[0], v1, 0); showFaceStatic(DICE[1], v2, 1);
    renderBanner();
    setTimeout(()=>done(v1,v2), 240);
    return;
  }
  startDiceSim(flick, done);
}
function beginThrow(flick, resolve){
  if(rolling || !resolve) return;
  disarmFlick();
  rolling = true;
  setActions([]);
  hideSum();
  sfx('dice');
  runThrow(flick, (a,b)=>{ rolling = false; showSum(a, b); resolve(a,b); });
}
function launchThrow(resolve){ beginThrow(null, resolve); }

/* 화면 좌표를 바닥 좌표로 (원근은 무시한 근사) */
function trayPoint(e){
  const r = $('diceStage').getBoundingClientRect();
  return {x:(e.clientX - (r.left + r.width/2)) / DSCALE, y:(e.clientY - (r.top + r.height/2)) / (DSCALE*COS_T)};
}
function endHold(){
  const hd = diceHold;
  if(!hd) return;
  diceHold = null;
  const tray = $('diceTray');
  if(tray){
    tray.classList.remove('holding');
    try { tray.releasePointerCapture(hd.id); } catch(err){}
  }
}
/* 잡고 있는 동안: 두 주사위가 손가락을 따라 떠다니며 구른다 */
function holdLoop(){
  const hd = diceHold;
  if(!hd) return;
  const t = nowMs();
  let dt = (t - hd.last)/1000; hd.last = t;
  if(!(dt > 0)) dt = 0.016;
  if(dt > 0.05) dt = 0.05;
  const f = 1 - Math.pow(0.0006, dt);
  DICE.forEach((d,i)=>{
    const tx = clamp(hd.pt.x + (i ? 1 : -1)*HALF*1.22, -BOUNDS.x, BOUNDS.x);
    const ty = clamp(hd.pt.y + (i ? 6 : -6), BOUNDS.y0, BOUNDS.y1);
    d.x += (tx - d.x)*f; d.y += (ty - d.y)*f; d.h += (REST_H + 30 - d.h)*f;
    integrateQ(d, dt);
    dieRender(d);
  });
  RAF(holdLoop);
}
function onDiceDown(e){
  if(!diceArmed || rolling || diceHold) return;
  if(G.players.length && curP().ai) return;             /* AI 차례의 주사위는 건드리지 않는다 */
  if(e.button !== undefined && e.button > 0) return;
  fitDice();
  const pt = trayPoint(e), t = nowMs();
  diceHold = {id:e.pointerId, pt:pt, samples:[{x:pt.x, y:pt.y, t:t}], sx:e.clientX, sy:e.clientY, last:t, tick:t, moved:0};
  const tray = $('diceTray');
  tray.classList.add('holding');
  try { tray.setPointerCapture(e.pointerId); } catch(err){}
  hideSum();
  if(REDUCED) return;
  DICE.forEach(d=>{
    d.done = true;                                       /* 물리는 멈춰 두고 손이 움직인다 */
    const m = rnd(6, 10);
    d.w = [(Math.random()*2-1)*m, (Math.random()*2-1)*m, (Math.random()*2-1)*m];
  });
  RAF(holdLoop);
}
function onDiceMove(e){
  const hd = diceHold;
  if(!hd || e.pointerId !== hd.id) return;
  const pt = trayPoint(e), t = nowMs();
  hd.moved += Math.abs(e.clientX - hd.sx) + Math.abs(e.clientY - hd.sy);
  hd.sx = e.clientX; hd.sy = e.clientY;
  hd.pt = pt;
  hd.samples.push({x:pt.x, y:pt.y, t:t});
  if(hd.samples.length > 10) hd.samples.shift();
  if(hd.moved > 46 && t - hd.tick > 80){                 /* 흔들면 달그락 소리가 나고 더 세게 구른다 */
    hd.moved = 0; hd.tick = t;
    sfx('tick');
    DICE.forEach(d=>{ const m = rnd(9, 15); d.w = [(Math.random()*2-1)*m, (Math.random()*2-1)*m, (Math.random()*2-1)*m]; });
  }
}
function onDiceUp(e){
  const hd = diceHold;
  if(!hd || (e.pointerId !== undefined && e.pointerId !== hd.id)) return;
  const t = nowMs(), pt = (e.type === 'pointerup') ? trayPoint(e) : hd.pt;
  hd.samples.push({x:pt.x, y:pt.y, t:t});
  /* 놓기 직전 0.1초 동안의 손가락 속도 */
  let a = hd.samples[hd.samples.length-1];
  for(const sm of hd.samples){ if(t - sm.t <= 110){ a = sm; break; } }
  const b = hd.samples[hd.samples.length-1];
  const dt = Math.max(0.016, (b.t - a.t)/1000);
  const vx = (b.x - a.x)/dt, vy = (b.y - a.y)/dt;
  const speed = Math.sqrt(vx*vx + vy*vy);
  const resolve = diceArmed && diceArmed.resolve;
  endHold();
  if(!resolve || rolling) return;
  beginThrow(speed > 140 ? {vx:vx, vy:vy, speed:speed} : null, resolve);
}

/* --- 턴 주사위 --- */
function rollTurn(){
  const p = curP();
  p.travel = 0;
  const resolve = (d1,d2)=>resolveRoll(p,d1,d2);
  armFlick(resolve);
  setActions([{l:'🎲 던지기', cls:'primary', fn:()=>launchThrow(resolve)}]);
}
function resolveRoll(p, d1, d2){
  const dbl = d1===d2;
  if(dbl) fxDouble();
  log('🎲 <b>'+esc(p.name)+'</b>: '+d1+' + '+d2+' = <b>'+(d1+d2)+'</b>'+(dbl?' <b class="dblmark">더블!</b>':''));
  if(dbl){
    G.chain++;
    if(G.chain>=3){
      log('🚨 연속 더블 3회! <b>'+esc(p.name)+'</b>은(는) 즉시 감옥으로 이송됩니다.', 'big');
      G.pendingDouble = false;
      sendToJail(p, 3, ()=>{ renderAll(); offerEndTurn(); });
      return;
    }
    G.pendingDouble = true;
  } else {
    G.pendingDouble = false;
  }
  stepMove(p, d1+d2, ()=>resolveLanding(p, endOfAction));
}

/* ----- 감옥 ----- */
function islandTurn(p){
  log('🔒 <b>'+esc(p.name)+'</b>은(는) 감옥에 갇혀 있습니다. (남은 '+p.island+'턴)');
  const resolve = (d1,d2)=>resolveIslandRoll(p,d1,d2);
  armFlick(resolve);
  const acts = [{l:'🎲 더블에 도전', cls:'primary', fn:()=>launchThrow(resolve)}];
  if(p.items.escape > 0){
    acts.push({l:'🗝️ 탈출권 사용', cls:'alt', fn:()=>{
      disarmFlick();
      p.items.escape--;
      p.island = 0;
      const card = CARDS.filter(c=>c.k==='escape')[0];
      if(G.deck.indexOf(card)<0) G.deck.push(card);
      log('🗝️ <b>'+esc(p.name)+'</b>이(가) 보석 석방권을 사용했습니다!');
      renderPlayers();
      rollTurn();
    }});
  }
  setActions(acts);
}
function resolveIslandRoll(p, d1, d2){
  log('🎲 <b>'+esc(p.name)+'</b>: '+d1+' + '+d2+(d1===d2?' <b class="dblmark">더블!</b>':''));
  if(d1===d2){
    p.island = 0;
    log('🎉 더블! <b>'+esc(p.name)+'</b>이(가) 감옥에서 풀려납니다.');
    renderPlayers();
    stepMove(p, d1+d2, ()=>resolveLanding(p, endOfAction));
  } else {
    p.island--;
    if(p.island===0) log('⏳ 탈출 실패. 고립이 끝나 다음 차례부터 자유롭게 이동합니다.');
    else log('⏳ 석방 실패. 감옥에서 '+p.island+'턴 더 기다립니다.');
    renderPlayers();
    offerEndTurn();
  }
}

/* ----- 우주여행 ----- */
function travelTurn(p){
  const ownerIdx = SP[SHUTTLE_IDX].owner;
  const free = p.travel===2 || ownerIdx===null || ownerIdx===p.i || p.cpEnjoyer;
  const owner = free ? null : G.players[ownerIdx];
  const feeTxt = free ? (p.cpEnjoyer && ownerIdx!==null && ownerIdx!==p.i ? 'CP enjoyer 면제' : '무료') : '이용료 '+fmt(SPACE_FEE)+'원을 '+esc(owner.name)+'에게 지불';
  log('🚀 <b>'+esc(p.name)+'</b>은(는) 우주여행을 이용할 수 있습니다. ('+feeTxt+')');

  setActions([
    {l:'🚀 우주여행 이용', cls:'alt', dis:!canUse, hint:'이용료가 부족합니다', fn:()=>openTravelPicker(p, free ? 0 : SPACE_FEE, owner)},
    {l:'🎲 그냥 주사위 굴리기', fn:()=>{ rollTurn(); }}
  ]);
}
/* 이용료는 목적지를 고르는 순간에 낸다. 고르지 않고 취소하면 돈을 내지 않는다. */
function openTravelPicker(p, fee, owner){
  let rows = '';

    if(i===p.pos) return;
    let sub = '';
    if(sp.type==='city' || sp.type==='veh'){
      sub = sp.owner===null ? fmt(buyPrice(sp)) : (sp.owner===p.i ? '내 땅' : esc(G.players[sp.owner].name));
    }
    const col = (sp.type==='city'||sp.type==='veh') ? GROUPS[sp.g].c : '#8A8272';
    rows += '<button class="pick" data-go="'+i+'"><span class="pickband" style="background:'+col+'"></span>' +

  });

    (fee ? ' 목적지를 고르면 이용료 <b>'+fmt(fee)+'원</b>을 <b>'+esc(owner.name)+'</b>에게 냅니다.' : '') + '</p>' +
    '<div class="pickgrid" data-fee="'+(fee||0)+'">'+rows+'</div>',

  $('mBody').querySelectorAll('[data-go]').forEach(btn=>{

      closeModal();

        log('🚀 <b>'+esc(p.name)+'</b>이(가) <b>'+SP[dest].name+'</b>(으)로 우주여행을 떠납니다.');
        sfx('space');
        const fly = fxRocket(p.pos, dest, p.color);
        if(fly){ const el = tokenEl(p); if(el) el.style.opacity = '0'; }
        setTimeout(()=>{ const el = tokenEl(p); if(el) el.style.opacity = ''; teleport(p, dest, true, ()=>{ tokenMeet(p); resolveLanding(p, endOfAction); }); }, fly);
      };
      if(fee && owner && owner.alive) pay(p, fee, owner, '우주여행 이용료', (ok)=>{ if(ok) go(); else endOfAction(); });

}

/* ================= 도착 처리 ================= */
function resolveLanding(p, done){
  const sp = SP[p.pos];
  if(p.pos===HANOI_IDX){
    log('🧒 <b>황설희</b>: "용돈이다~" 하노이에서 <b>'+esc(p.name)+'</b>의 10만원을 가져갑니다.');
    sfx('coin');
    pay(p, 10, 'bank', '황설희 용돈', (ok)=>{ if(ok) routeLanding(p, sp, done); else done(); });
    return;
  }
  routeLanding(p, sp, done);
}
function routeLanding(p, sp, done){
  if(sp.type==='start'){ log('🏁 출발지에 도착했습니다.'); done(); return; }
  if(sp.type==='key'){ drawKey(p, done); return; }
  if(sp.type==='island'){
    if(!p.criminal){
      sfx('jail');
      log('🔒 <b>'+esc(p.name)+'</b>이(가) 감옥에 갇혔습니다!');
    }
    sendToJail(p, 3, ()=>{ renderPlayers(); done(); });
    return;
  }
  if(sp.type==='space'){
    p.travel = 1;
    sfx('space');
    log('🚀 우주여행 승강장! 다음 차례에 원하는 칸으로 이동할 수 있습니다.');
    renderPlayers(); done(); return;
  }
  if(sp.type==='fund'){
    if(G.fund>0){ const a=G.fund; G.fund=0; sfx('fundget'); fxCoins(cellPt(FUND_IDX), 30); tokenAnim(p, 'cheer', 900); tokenSay(p, 'rich'); gain(p, a, '사회복지기금 수령'); renderCells(); }
    else log('💰 사회복지기금 접수처. 아직 적립된 기금이 없습니다.');
    done(); return;
  }
  if(sp.type==='teleport'){ teleportCell(p, done); return; }
  if(sp.type==='cheongyeon'){
    p.cheongyeon = 2;
    sfx('coin');
    log('📐 <b>'+esc(p.name)+'</b>이(가) 청연에 도착했습니다. 여준영과 수학 수업을 시작합니다. (2턴)');
    modal('📐 청연',
      '<div class="keycard"><div class="keytitle">청연</div>' +
      '<p>당신은 대치청연에서 여준영과 수학을 가르치고 있습니다.</p>' +
      '<p class="hint">앞으로 2턴 동안 매 턴 20만원을 받습니다. 다만 감옥처럼 그동안은 자리를 뜰 수 없습니다.</p></div>',
      [{l:'확인', cls:'primary', fn:done}], '#B8860B');
    renderPlayers(); return;
  }
  if(sp.type==='care'){ if(yoonseongTrap(p, '요양원', '🏥', done)) return; nursingHome(p, done); return; }
  if(sp.type==='daycare'){ if(yoonseongTrap(p, '어린이집', '🧸', done)) return; daycare(p, done); return; }
  if(sp.owner===null){ offerBuy(p, sp, done); return; }
  if(sp.owner===p.i){
    if(sp.type==='city') offerBuild(p, sp, done);
    else { sfx('mine'); log('✨ 내 소유의 <b>'+sp.name+'</b>에 도착했습니다.'); done(); }
    return;
  }
  tollFlow(p, sp, done);
}

        tokenMeet(p);
        setTimeout(done, REDUCED ? 0 : 420);
      }, REDUCED ? 0 : 420);
    }}], '#6B4F9E');
}

/* ----- 요양원: 가위바위보 3판 2선승 (3초 타이머, 비기지 않음) ----- */
function nursingHome(p, done){
  miniStart();
  let pw = 0, hw = 0;
  const HANDS = [{k:'rock',e:'✊',n:'바위'},{k:'paper',e:'✋',n:'보'},{k:'scissors',e:'✌️',n:'가위'}];
  const beats = (a,b)=> (a==='rock'&&b==='scissors')||(a==='paper'&&b==='rock')||(a==='scissors'&&b==='paper');
  let timer = null;
  function clearTimer(){ if(timer){ clearInterval(timer); timer = null; } }

  function choose(){
    let left = 3, picked = null;
    const head = '<p class="hint">3초 안에 하나를 고르세요! 시간이 끝나면 어르신의 손이 공개됩니다. (비기면 그 판은 다시)</p>' +
      '<p class="scoreline">나 <b>'+pw+'</b> : <b>'+hw+'</b> 어르신</p>';
    modal('🏥 요양원 가위바위보',
      head +
      '<div class="mg-timer" id="rpsT">3</div>' +
      '<div class="rps-row">' + HANDS.map(h=>'<button class="rps-btn" data-h="'+h.k+'">'+h.e+'<span>'+h.n+'</span></button>').join('') + '</div>' +
      '<p class="mg-status" id="rpsMsg">무엇을 낼까요?</p>',
      [], '#2E7D46');
    const msg = ()=>$('rpsMsg'), tEl = ()=>$('rpsT');
    $('mBody').querySelectorAll('.rps-btn').forEach(b=>{
      b.onclick = ()=>{
        picked = b.dataset.h;
        $('mBody').querySelectorAll('.rps-btn').forEach(x=>x.classList.toggle('sel', x===b));
        if(msg()) msg().textContent = HANDS.find(h=>h.k===picked).n + '! 어르신의 손을 기다립니다…';
        sfx('rps');
      };
    });
    sfx('countdown');
    timer = setInterval(()=>{
      if(infoOpen()) return;               /* 규칙 창 등에 가려져 있는 동안은 시간을 멈춘다 */
      left--;
      if(tEl()){ if(left>0) tEl().textContent = left; else tEl().innerHTML = icon('help'); }
      if(left>0) sfx('countdown');
      if(left<=0){
        clearTimer();
        reveal(picked);
      }
    }, 1000);
  }
  function reveal(mine){
    /* 비기지 않도록: 어르신은 무승부가 아닌 손 중에서 뽑는다. 미선택 시 나에게 불리하게(어르신 승) */
    if(!mine){
      mine = HANDS[Math.floor(Math.random()*3)].k;   /* 임의 배정 후 어르신이 이기게 */
      const winning = HANDS.find(h=>beats(h.k, mine)).k;
      finishHand(mine, winning);
      return;
    }
    /* 어르신은 나를 이기거나 지는 손 중 무작위(비김 제외) */
    const notTie = HANDS.filter(h=>h.k!==mine).map(h=>h.k);
    const loseTo = notTie.find(k=>beats(mine, k)), winOver = notTie.find(k=>beats(k, mine));
    const his = Math.random() < luckProb(p, 0.5) ? loseTo : winOver;   /* 기본은 반반, 숨은 운 보정 */
    finishHand(mine, his);
  }
  function finishHand(mine, his){
    const me = HANDS.find(h=>h.k===mine), he = HANDS.find(h=>h.k===his);
    const iWon = beats(mine, his);
    if(iWon) pw++; else hw++;
    sfx('reveal');
    const line = '<p class="mg-reveal">나 '+me.e+' <span class="mg-vs">VS</span> '+he.e+' 어르신 '+(iWon?'<b class="pos">승</b>':'<b class="neg">패</b>')+'</p>';
    if(pw>=2 || hw>=2){
      const won = pw>=2;
      sfx(won ? 'gamewin' : 'gamelose');
      modal('🏥 요양원 가위바위보',
        '<p class="scoreline">나 <b>'+pw+'</b> : <b>'+hw+'</b> 어르신</p>' + line +
        '<p class="mg-status">최종 <b>'+pw+' : '+hw+'</b> — '+(won?'승리! 20만원을 받습니다.':'패배… 15만원을 냅니다.')+'</p>',
        [{l:'확인', cls:'primary', fn:()=>settle(won)}], won ? '#2E7D46' : '#8C2F2F');
    } else {
      modal('🏥 요양원 가위바위보',
        '<p class="scoreline">나 <b>'+pw+'</b> : <b>'+hw+'</b> 어르신</p>' + line +
        '<p class="mg-status">다음 판으로!</p>',
        [{l:'다음 판 ➜', cls:'alt', fn:choose}], '#2E7D46');
    }
  }
  function settle(won){
    miniEnd();
    if(won){
      gain(p, 20, '요양원 가위바위보 승리'); p.stat.mini++;
      p.careWins = (p.careWins || 0) + 1;
      if(p.careWins >= BUFFS.bhacks.need && !p.bhacks && claimSpecial(p, 'bhacks')){
        p.bhacks = true;
        buffFx(p, 'bhacks');
        log('🥤 <b>'+esc(p.name)+'</b>: 카스, 카스, 카스!! <b>박카스의 기운</b> 능력 획득!', 'big');
        renderPlayers();
        modal('🥤 카스, 카스, 카스!!',
          '<div class="keycard" style="background:#2c1b3a;color:#efe4f4"><div class="keytitle" style="color:#D6A8FF">카스, 카스, 카스!!</div>' +
          '<p>박카스 할머니들을 따라갔군요… 당신은 그곳에서 태윤성을 만나 특별한 기운을 받았습니다.</p>' +
          '<p class="hint" style="color:#d4c4e0">이제 <b>박카스의 기운</b>입니다. 건물이 2채 이상인 내 타일의 통행료가 20% 오릅니다.</p></div>',
          [{l:'확인', cls:'primary', fn:done}], '#2c1b3a');
        return;
      }
      done();
    } else {
      pay(p, 15, 'fund', '요양원 가위바위보 패배', ()=>done());
    }
  }
  choose();
}

/* ----- 어린이집: 주사위 대결 3판 2선승 (직접 굴리고, 비기지 않음) ----- */
function daycare(p, done){
  miniStart();
  let pw = 0, cw = 0, round = 0;
  /* 비기지 않도록: 내 주사위는 1~6, 아이는 나와 다른 값에서 뽑는다 */
  function rollPair(){
    const me = 1 + Math.floor(Math.random()*6);
    let ch;
    do { ch = 1 + Math.floor(Math.random()*6); } while(ch === me);
    /* 숨은 운 보정: 결과가 운과 어긋나면 일정 확률로 두 눈을 맞바꾼다 */
    const lk = luck(p), iWin = me > ch;
    if((lk < 0 && iWin && Math.random() < -lk*0.4) || (lk > 0 && !iWin && Math.random() < lk*0.4)) return [ch, me];
    return [me, ch];
  }
  /* faces = [내 눈, 아이 눈]. 0 이면 아직 굴리지 않은 주사위 */
  function board(topHTML, showBtn, faces){
    faces = faces || [0, 0];
    const dice = '<div class="mg-dice">' +
      '<div class="mg-side"><div class="mg-lab">나</div><div class="mg-face" id="mgMe">'+dieHTML(faces[0])+'</div></div>' +
      '<div class="mg-vs">VS</div>' +
      '<div class="mg-side"><div class="mg-lab">아이</div><div class="mg-face" id="mgCh">'+dieHTML(faces[1])+'</div></div></div>';
    modal('🧸 어린이집 주사위 대결',
      '<p class="hint">아이와 3판 2선승! 매 판 서로 주사위를 굴려 높은 수가 이깁니다. (비기면 다시 굴립니다)</p>' +
      '<p class="scoreline">나 <b>'+pw+'</b> : <b>'+cw+'</b> 아이</p>' + dice +
      (topHTML||''),
      showBtn ? [{l:'🎲 내 주사위 굴리기', cls:'alt', keep:true, fn:play}] : [], '#C9871A');
  }
  function play(){
    round++;
    const [md, cd] = rollPair();
    const roll6 = ()=>1 + Math.floor(Math.random()*6);
    /* 내 주사위 굴리는 연출 */
    sfx('dice');
    let ticks = 0;
    const meEl = ()=>$('mgMe'), chEl = ()=>$('mgCh');
    board('<p class="mg-status">주사위를 굴리는 중…</p>', false, [roll6(), 0]);
    const iv = setInterval(()=>{
      if(meEl()) meEl().innerHTML = dieHTML(roll6());
      ticks++;
      if(ticks >= 8){
        clearInterval(iv);
        if(meEl()) meEl().innerHTML = dieHTML(md);
        sfx('reveal');
        /* 아이 차례 */
        setTimeout(()=>{
          board('<p class="mg-status">아이가 주사위를 굴립니다…</p>', false, [md, roll6()]);
          let ct = 0;
          const iv2 = setInterval(()=>{
            if(chEl()) chEl().innerHTML = dieHTML(roll6());
            sfx('countdown');
            ct++;
            if(ct >= 7){
              clearInterval(iv2);
              if(chEl()) chEl().innerHTML = dieHTML(cd);
              sfx('reveal');
              const iWon = md > cd;
              if(iWon) pw++; else cw++;
              setTimeout(()=>finishRound(md, cd, iWon), 500);
            }
          }, 130);
        }, 450);
      }
    }, 90);
  }
  function finishRound(md, cd, iWon){
    const faces = [md, cd];
    const line = iWon ? '<b class="pos">이겼습니다!</b>' : '<b class="neg">졌습니다!</b>';
    if(pw>=2 || cw>=2){
      const won = pw>=2;
      sfx(won ? 'gamewin' : 'gamelose');
      board('<p class="mg-status">'+line+' 최종 <b>'+pw+' : '+cw+'</b> — '+(won?'승리! 20만원을 받습니다.':'패배… 15만원을 냅니다.')+'</p>', false, faces);
      const bb = $('mBtns'); bb.innerHTML='';
      const el = document.createElement('button'); el.className='btn primary'; el.textContent='확인';
      el.onclick = ()=>{ closeModal(); settle(won); };
      bb.appendChild(el);
    } else {
      board('<p class="mg-status">'+line+' 다음 판을 이어갑니다.</p>', true, faces);
    }
  }
  function settle(won){
    miniEnd();
    if(won){
      gain(p, 20, '어린이집 주사위 승리'); p.stat.mini++;
      p.daycareWins = (p.daycareWins || 0) + 1;
      if(p.daycareWins >= BUFFS.cpEnjoyer.need && !p.cpEnjoyer && claimSpecial(p, 'cpEnjoyer')){
        p.cpEnjoyer = true;
        buffFx(p, 'cpEnjoyer');
        log('🚨 <b>'+esc(p.name)+'</b>: 당신은 태윤성인가? <b>CP enjoyer</b> 능력 획득!', 'big');
        renderPlayers();
        modal('🚨 당신은 태윤성인가',
          '<div class="keycard" style="background:#3a1f1f;color:#f4e4e4"><div class="keytitle" style="color:#FF9382">당신은 태윤성인가</div>' +
          '<p>당신은 어린이들을 이기는 것을 좋아하는군요…. 지금 바로 태윤성을 연락하십시오.</p>' +
          '<p class="hint" style="color:#e0c4c4">이제 <b>CP enjoyer</b>입니다. 남에게 내는 <b>모든 통행료가 20% 할인</b>되고, 돈을 내야 하는 황금열쇠(반액대매출, 건물세 제외)와 우주왕복선 이용료를 면제받습니다.</p></div>',
          [{l:'확인', cls:'primary', fn:done}], '#3a1f1f');
        return;
      }
      done();
    } else {
      pay(p, 15, 'fund', '어린이집 주사위 패배', ()=>done());
    }
  }
  board('', true, [0, 0]);
}

/* ----- 최후 2인 규칙 (버프 교체판) -----
   열세(underdog): 상대에게 받는 통행료 25% 할증 (역전의 무기)
   우세(leader): 월급 3배 + 우대권 2장 (굳히기)
   자산 우열이 뒤집히면 두 버프가 서로 자리를 바꾼다. */
/* 최후 2인 규칙의 수치. AI끼리 수백 판을 돌린 결과로 정했다.
   예전 규칙(앞선 쪽 월급 3배와 우대권 2장)에서는 앞선 쪽이 91%를 이겼고 격차가 계속 벌어졌다.
   지금 수치에서는 비슷한 두 사람이면 거의 반반, 크게 앞선 쪽은 여전히 대부분 이기지만 역전도 나온다. */
const EG = Object.assign({
  richSalary: 1, richPass: 0,          /* 앞선 쪽: 월급 배수, 우대권 */
  poorSalary: 1.5, poorToll: 0.25,     /* 뒤진 쪽: 월급 배수, 받는 통행료 할증 */
  poorTollBig: 0.5, bigAt: 1.5,        /* 격차가 bigAt 배 이상이면 할증을 poorTollBig 로 */
  poorBuild: 0.75,                     /* 뒤진 쪽 건설비 배수 */
  maxRounds: 20                        /* 무제한 모드에서 최후 2인 결전이 이 라운드를 넘기면 판정승 (0 이면 끝없이) */
}, (/[?&]sim\b/.test(location.search) && window.__EG) || {});
/* 최후 2인 혜택 설명 (수치를 바꾸면 문구도 따라 바뀐다) */
function egPoorText(){
  const t = [];
  if(EG.poorSalary !== 1) t.push('월급 '+EG.poorSalary+'배');
  t.push('받는 통행료 +'+Math.round(EG.poorToll*100)+'%'+(EG.bigAt < 99 && EG.poorTollBig !== EG.poorToll ? ' (격차가 '+EG.bigAt+'배 이상이면 +'+Math.round(EG.poorTollBig*100)+'%)' : ''));
  if(EG.poorBuild !== 1) t.push('건설비 '+Math.round((1-EG.poorBuild)*100)+'% 할인');
  return t.join(', ');
}
function egRichText(){
  const t = [];
  if(EG.richSalary !== 1) t.push('월급 '+EG.richSalary+'배');
  if(EG.richPass) t.push('우대권 '+EG.richPass+'장');
  return t.length ? t.join(', ') : '추가 혜택 없음';
}
function egRatio(){ const r = endgameRanked(); return r ? assets(r.rich)/Math.max(1, assets(r.poor)) : 1; }
function applyEndgameRoles(poor, rich, announce){
  poor.underdog = true;  poor.leader = false;
  rich.underdog = false; rich.leader = true;
  poor.tollBuff = egRatio() >= EG.bigAt ? EG.poorTollBig : EG.poorToll;  poor.salaryMult = EG.poorSalary;
  rich.tollBuff = 0; rich.salaryMult = EG.richSalary;
  if(announce){
    rich.items.pass += EG.richPass;
    sfx('coin');
    fxScreen('rgba(122,62,158,.55)');
    fxShake();
    log('⚔️ 최후의 2인! 뒤진 <b>'+esc(poor.name)+'</b>에게 '+egPoorText()+(EG.richSalary !== 1 || EG.richPass ? ', 앞선 <b>'+esc(rich.name)+'</b>에게 '+egRichText() : '')+'이(가) 주어집니다.', 'big');
  }
  renderPlayers();
}
function endgameRanked(){
  const al = alivePlayers();
  if(al.length !== 2) return null;
  const a = al[0], b = al[1];
  return (assets(a) <= assets(b)) ? {poor:a, rich:b} : {poor:b, rich:a};
}
/* 매 자산 변동마다 우열이 바뀌었는지 확인하고 버프를 뒤바꾼다. */
function checkEndgameSwap(){
  if(!G.endgameApplied || G.over) return;
  const r = endgameRanked();
  if(!r) return;
  const tb = egRatio() >= EG.bigAt ? EG.poorTollBig : EG.poorToll;   /* 격차에 따라 할증이 달라진다 */
  if(r.poor.underdog && r.poor.tollBuff !== tb){ r.poor.tollBuff = tb; renderPlayers(); }
  if(!r.poor.underdog || !r.rich.leader){
    const swapped = r.rich.underdog;   /* 직전 열세였던 사람이 우세로 올라섰나 */
    /* 우대권은 재부여하지 않도록 announce=false */
    applyEndgameRoles(r.poor, r.rich, false);
    if(swapped){
      if(G.eg) G.eg.swaps++;
      sfx('win');
      fxScreen('rgba(255,214,102,.5)');
      log('🔄 역전! <b>'+esc(r.poor.name)+'</b>와(과) <b>'+esc(r.rich.name)+'</b>의 우열이 뒤바뀌어 버프가 서로 교체됩니다.', 'big');
    }
  }
}
function checkEndgame(){
  if(G.endgameApplied) return;
  const r = endgameRanked();
  if(!r) return;
  G.endgameApplied = true;
  G.eg = {turn:G.turnNo, round:G.round, rich:r.rich.i, poor:r.poor.i, ratio:assets(r.rich)/Math.max(1, assets(r.poor)), swaps:0};
  markEvent('eg', null, '최후 2인 결전 시작');
  if(!MODE.limit && EG.maxRounds) log('⏳ 최후 2인 결전은 '+EG.maxRounds+'라운드입니다. 그 안에 끝나지 않으면 총자산이 많은 쪽이 판정승합니다.', 'big');
  renderClock();
  applyEndgameRoles(r.poor, r.rich, true);
  modal('⚔️ 최후의 2인',
    '<p>이제 단둘이 남았습니다. 자산 격차에 따라 특별 규칙이 적용됩니다. <b>우열이 뒤바뀌면 두 혜택도 서로 교체됩니다.</b></p>' +
    '<p><span class="pdot sm" style="background:'+r.poor.color+'">'+PIECES[r.poor.piece].ic+'</span> <b>'+esc(r.poor.name)+'</b> <span class="hint">(자산 열세)</span><br>'+egPoorText()+'</p>' +
    '<p><span class="pdot sm" style="background:'+r.rich.color+'">'+PIECES[r.rich.piece].ic+'</span> <b>'+esc(r.rich.name)+'</b> <span class="hint">(자산 우세)</span><br>'+egRichText()+'</p>',
    [{l:'대결 시작', cls:'primary'}], '#7A3E9E');
}

    return '<div class="deed"><div class="deedhead" style="--gc:'+GROUPS.vh.c+'">'+sp.name+'<span class="deedg">교통수단</span></div>' +

    '<tr><td>별장 🏠</td><td>'+fmt(sp.bc[0])+'원</td><td>통행료</td><td>'+fmt(tollAt(1))+'원</td></tr>' +
    '<tr><td>빌딩 🏢</td><td>'+fmt(sp.bc[1])+'원</td><td>통행료</td><td>'+fmt(tollAt(2))+'원</td></tr>' +
    '<tr><td>호텔 🏨</td><td>'+fmt(sp.bc[2])+'원</td><td>통행료</td><td>'+fmt(tollAt(3))+'원</td></tr>' +
    '<tr class="fullr"><td colspan="2">🏰 랜드마크 통행료</td><td colspan="2">'+fmt(tollAt(4))+'원</td></tr>' +
