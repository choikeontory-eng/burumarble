};
let PICTO_RE = null;
try { PICTO_RE = new RegExp('(?:\\p{Extended_Pictographic}|\\u279C)(?:\\uFE0F|\\u200D\\p{Extended_Pictographic})*', 'gu'); } catch (e) { PICTO_RE = null; }
function iconize(html){
  if(!PICTO_RE) return html;
  return String(html).split(/(<[^>]*>)/).map(seg => {
    if(seg.charAt(0) === '<') return seg;          /* 태그 안은 건드리지 않는다 */
    return seg.replace(PICTO_RE, m => icon(EMOJI_IC[Array.from(m.replace(/️/g, ''))[0]] || ''));
  }).join('');
}
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 사운드 (WebAudio 합성음) ================= */
let AC = null, muted = false;
function sfx(kind) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const play = (f, dt, dur, type, vol) => {
      type = type || 'triangle'; vol = vol === undefined ? 0.12 : vol;
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.linearRampToValueAtTime(vol, t + dt + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t + dt); o.stop(t + dt + dur + 0.05);
    };
    if (kind === 'tick') play(920, 0, 0.05, 'square', 0.045);
    else if (kind === 'dice') { play(300,0,0.05,'square',0.07); play(430,0.06,0.05,'square',0.07); play(360,0.12,0.05,'square',0.07); }
    else if (kind === 'coin') { play(880,0,0.09); play(1318,0.09,0.15); }
    else if (kind === 'pay') { play(440,0,0.1); play(294,0.1,0.17); }
    else if (kind === 'buy') { play(659,0,0.08); play(880,0.08,0.08); play(1108,0.16,0.15); }
    else if (kind === 'card') { play(523,0,0.07,'sine',0.11); play(698,0.07,0.11,'sine',0.11); }
    else if (kind === 'bad') { play(220,0,0.18,'sawtooth',0.08); play(155,0.16,0.26,'sawtooth',0.08); }
    else if (kind === 'win') { [523,659,784,1046,1318].forEach((f,i)=>play(f,i*0.12,0.24,'triangle',0.13)); }
    /* --- 타일별 효과음 --- */
    else if (kind === 'jail') { play(160,0,0.14,'square',0.09); play(120,0.13,0.2,'square',0.09); play(90,0.3,0.32,'sawtooth',0.08); } /* 철창 쾅 */
    else if (kind === 'mine') { play(784,0,0.08,'sine',0.1); play(1046,0.08,0.14,'sine',0.1); } /* 내 땅: 포근한 도착음 */
    else if (kind === 'rentlow') { play(392,0,0.09,'triangle',0.09); play(330,0.09,0.14,'triangle',0.09); } /* 소액 지대 */
    else if (kind === 'renthigh') { play(233,0,0.12,'sawtooth',0.09); play(196,0.12,0.18,'sawtooth',0.09); play(147,0.28,0.28,'sawtooth',0.09); } /* 고액 지대: 묵직 */
    else if (kind === 'teleport') { for(let i=0;i<6;i++) play(500+i*140,i*0.04,0.09,'sine',0.08); play(1400,0.28,0.2,'sine',0.09); } /* 상승 스윕 */
    else if (kind === 'salary') { play(659,0,0.09,'triangle',0.11); play(988,0.09,0.16,'triangle',0.11); } /* 월급 팡파르 */
    else if (kind === 'fundget') { [784,988,1175,1568].forEach((f,i)=>play(f,i*0.07,0.16,'triangle',0.11)); } /* 기금 수령 */
    else if (kind === 'lotto') { for(let i=0;i<8;i++) play(600+Math.random()*900,i*0.05,0.08,'square',0.06); } /* 복권 룰렛 */
    else if (kind === 'space') { play(330,0,0.18,'sine',0.09); play(440,0.14,0.18,'sine',0.09); play(660,0.3,0.3,'sine',0.1); } /* 우주 발진 */
    else if (kind === 'build') { play(196,0,0.06,'square',0.09); play(262,0.06,0.06,'square',0.09); play(392,0.14,0.16,'triangle',0.1); } /* 망치질→완성 */
    else if (kind === 'landmark') { [523,659,784,1046,1318,1568].forEach((f,i)=>play(f,i*0.08,0.22,'triangle',0.12)); } /* 랜드마크 웅장 */
    else if (kind === 'rps') { play(700,0,0.06,'square',0.07); play(700,0.18,0.06,'square',0.07); play(700,0.36,0.06,'square',0.07); play(500,0.5,0.1,'square',0.08); } /* 가위바위보 리듬 */
    else if (kind === 'countdown') play(880, 0, 0.08, 'sine', 0.08); /* 카운트다운 틱 */
    else if (kind === 'reveal') { play(392,0,0.07,'triangle',0.09); play(587,0.07,0.14,'triangle',0.1); } /* 공개 */
    else if (kind === 'gamewin') { play(659,0,0.1,'triangle',0.12); play(880,0.1,0.18,'triangle',0.12); } /* 미니게임 승 */
    else if (kind === 'gamelose') { play(392,0,0.12,'sawtooth',0.09); play(262,0.12,0.2,'sawtooth',0.09); } /* 미니게임 패 */
    else if (kind === 'season') { [523,784,1046].forEach((f,i)=>play(f,i*0.11,0.34,'sine',0.09)); } /* 계절이 바뀌는 종소리 */

    else if (kind === 'special') { for(let i=0;i<7;i++) play([523,659,784,988,1175,1318,1568][i],i*0.09,0.26,'triangle',0.13); } /* 특별버프 획득 */

/* ================= 배경음악 (WebAudio 합성, 외부 파일 없음) ================= */
let musicOn = false, musTimer = null, musGain = null, musNext = 0, musStep = 0;
const MUS_BEAT = 60 / 88 / 2; /* 88 BPM 8분음표 길이(초) */
/* 코드 진행: C - G - Am - F (밝고 편안하며 매끄럽게 반복) */
const MUS = [
  { bass:130.81, pad:[261.63,329.63,392.00], arp:[261.63,329.63,392.00,523.25] }, /* C  */
  { bass: 98.00, pad:[196.00,293.66,392.00], arp:[293.66,392.00,493.88,587.33] }, /* G  */
  { bass:110.00, pad:[220.00,329.63,440.00], arp:[261.63,329.63,440.00,523.25] }, /* Am */
  { bass: 87.31, pad:[174.61,261.63,349.23], arp:[261.63,349.23,440.00,523.25] }  /* F  */
];
const ARP_SEQ = [0,1,2,3,2,3,1,2];
function ensureAC(){
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function musVoice(freq, at, dur, type, vol, atk){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq * MUS_KEY[G.season || 0];
  atk = atk || 0.015;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(musGain);
  o.start(at); o.stop(at + dur + 0.05);
}
const MUS_KEY = [1, 1.1225, 0.8909, 0.7937];   /* 봄 C, 여름 D, 가을 B♭, 겨울 A♭ */
function musSchedule(){
  const bar = Math.floor(musStep / 8) % 4, pos = musStep % 8, ch = MUS[bar], t = musNext;
  const MUS_8TH = MUS_BEAT * (G.finalPhase ? 0.8 : 1);              /* 막판에는 빨라진다 */
  musVoice(ch.arp[ARP_SEQ[pos]], t, MUS_8TH * 0.92, 'triangle', 0.05, 0.008);       /* 벨 아르페지오 */
  if (pos === 0 || pos === 4) musVoice(ch.bass, t, MUS_8TH * 1.9, 'sine', 0.11, 0.02); /* 베이스 */
  if (pos === 2 || pos === 6) musVoice(ch.bass * 1.5, t, MUS_8TH * 0.5, 'sine', 0.05, 0.01); /* 리듬 */
  if (pos === 0) ch.pad.forEach(f => musVoice(f, t, MUS_8TH * 7.4, 'sine', 0.03, 0.12));  /* 패드 코드 */
  musStep = (musStep + 1) % 32;
  musNext += MUS_8TH;
}
function musLoop(){ try { while (musNext < AC.currentTime + 0.25) musSchedule(); } catch (e) { stopMusic(); } }
function updateMusicBtn(){ const b = $('musicBtn'); if (b) b.classList.toggle('off', !musicOn); }
function startMusic(){
  if (musicOn) return;
  try {
    ensureAC();
    if (!musGain){ musGain = AC.createGain(); musGain.gain.value = 0; musGain.connect(AC.destination); }
    musicOn = true; musStep = 0; musNext = AC.currentTime + 0.12;
    const now = AC.currentTime;
    musGain.gain.cancelScheduledValues(now);
    musGain.gain.setValueAtTime(Math.max(0.0001, musGain.gain.value), now);
    musGain.gain.linearRampToValueAtTime(0.85, now + 0.9); /* 페이드 인 */
    musLoop();
    musTimer = setInterval(musLoop, 70);
  } catch (e) { musicOn = false; }
  updateMusicBtn();
}
function stopMusic(){
  musicOn = false;
  if (musTimer){ clearInterval(musTimer); musTimer = null; }
  try {
    if (musGain && AC){
      const now = AC.currentTime;
      musGain.gain.cancelScheduledValues(now);
      musGain.gain.setValueAtTime(musGain.gain.value, now);
      musGain.gain.linearRampToValueAtTime(0, now + 0.4); /* 페이드 아웃 */
    }
  } catch (e) {}
  updateMusicBtn();
}
function toggleMusic(){ if (musicOn) stopMusic(); else startMusic(); }

  turnNo:1, opts:{takeover:true, startCash:150}, over:false, endgameApplied:false, stepping:false, specialOwner:null
};

/* ================= 보드 렌더링 ================= */
function cellRC(i){
  if(i<=11) return [12, 12-i];
  if(i<=22) return [12-(i-11), 1];
  if(i<=33) return [1, i-21];
  return [i-32, 12];
}
function bandSide(i){
  if(i%11===0) return '';
  if(i<11) return 'side-b';
  if(i<22) return 'side-l';
  if(i<33) return 'side-t';
  return 'side-r';
}
function buildBoard(){
  const bd = $('board');
  const con = document.createElement('div');
  con.id = 'console';
  con.innerHTML =
    '<div class="c-head"><span class="c-brand">GLOBAL MARBLE</span><span class="c-hud"><span id="seasonChip"></span><span id="clock" class="hidden"></span><span id="turnNo"></span></span></div>' +
    '<div id="diceTray"><div id="diceStage"><div id="diceFloor"></div></div><div id="diceSum"></div><div id="diceHint"></div><div id="banner"></div></div>' +
    '<div class="c-bar"><div id="turnBanner"></div><div id="actions"></div><div id="shot"><i></i></div></div>' +
    '<div id="log"></div>';
  bd.appendChild(con);
  SP.forEach((sp,i)=>{
    const c = document.createElement('div');
    const rc = cellRC(i);
    c.className = 'cell ' + bandSide(i) + (i%11===0 ? ' corner' : '') + ' t-' + sp.type;
    c.style.gridArea = rc[0] + ' / ' + rc[1];
    c.dataset.idx = i;
    let inner = '';
    if(sp.type==='city' || sp.type==='veh'){
      /* 가장 긴 낱말의 글자 수에 따라 글자 크기를 줄인다 (좁은 위아래 줄 칸에서 잘리지 않게) */
      const wlen = Math.max.apply(null, sp.name.split(' ').map(w=>w.length));
      const wcls = wlen >= 6 ? ' w6' : wlen === 5 ? ' w5' : '';
      inner = '<div class="band" style="background:' + GROUPS[sp.g].c + '"></div>' +
        '<div class="lmwrap" style="color:' + GROUPS[sp.g].c + '">' + landmarkSVG(sp.name) + '</div>' +
        '<div class="inner"><div class="nm' + wcls + '">' + sp.name + '</div><div class="bslot"></div><div class="blds"></div><div class="pr">' + fmt(sp.price) + '</div></div>';
    } else if(sp.type==='key'){
      inner = '<div class="inner"><div class="key-ic">'+icon('key')+'</div><div class="nm sm">황금열쇠</div></div>';
    } else if(sp.type==='care'){
      inner = '<div class="inner"><div class="mini-ic">'+icon('care')+'</div><div class="nm sm">요양원</div><div class="mini-sub">미니게임</div></div>';
    } else if(sp.type==='daycare'){
      inner = '<div class="inner"><div class="mini-ic">'+icon('blocks')+'</div><div class="nm sm">어린이집</div><div class="mini-sub">미니게임</div></div>';
    } else if(sp.type==='teleport'){
      inner = '<div class="inner"><div class="mini-ic">'+icon('swap')+'</div><div class="nm sm">순간이동</div><div class="mini-sub">' + (i<11?'남':'북') + '</div></div>';
    } else if(sp.type==='cheongyeon'){
      inner = '<div class="inner"><div class="mini-ic">'+icon('ruler')+'</div><div class="nm sm">청연</div><div class="mini-sub">2턴 수업</div></div>';
    } else if(sp.type==='start'){
      inner = '<div class="inner"><div class="cor-ic">'+icon('flag')+'</div><div class="nm">출발</div><div class="cor-sub" id="salaryCell">월급 '+fmt(SALARY)+'원</div></div>';
    } else if(sp.type==='island'){
      inner = '<div class="inner"><div class="cor-ic">'+icon('lock')+'</div><div class="nm">감옥</div><div class="cor-sub">3턴 수감</div></div>';
    } else if(sp.type==='fund'){
      inner = '<div class="inner"><div class="cor-ic">'+icon('coins')+'</div><div class="nm">사회복지기금</div><div class="cor-sub" id="fundCell">0만</div></div><div class="fundpile" id="fundPile"></div>';
    } else if(sp.type==='space'){
      inner = '<div class="inner"><div class="cor-ic">'+icon('rocket')+'</div><div class="nm">우주여행</div><div class="cor-sub">원하는 곳으로</div></div>';
    }
    c.innerHTML = inner + (sp.type==='city' ? '<div class="festtag">축제</div>' : '') + '<div class="owndot"></div><div class="tokens"></div>';
    c.addEventListener('click', ()=>showCellInfo(i));
    bd.appendChild(c);
  });
}

const PIPS = {1:[5],2:[3,7],3:[3,5,7],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
/* 미니게임용 평면 주사위. v 가 없으면 아직 굴리지 않은 빈 주사위 */
function dieHTML(v){
  if(!v) return '<div class="die blank">?</div>';
  let h = '';
  for(let i=1;i<=9;i++) h += '<span class="'+(PIPS[v].indexOf(i)>=0?'pip':'')+'"></span>';
  return '<div class="die'+(v===1?' ace':'')+'">'+h+'</div>';
}

/* ================= 3D 건물 모형 =================
   보드게임 말처럼 칸 위에 작은 입체 건물을 세운다. 초록 별장, 파란 빌딩, 빨간 호텔, 금색 랜드마크.
   바닥에는 주인 색 받침을 깐다. 치수는 em 단위이고 칸 크기에 따라 함께 커진다. */
const HOUSE = {v:'#3FA36A', vRoof:'#2C7A4E', b:'#4A78C4', bTop:'#2F5597', h:'#D8442F', hRoof:'#9C2A1D', L:'#E0B341', Ld:'#B8892A'};
function buildingsStage(sp){
  const st = document.createElement('div');
  st.className = 'b3d';
  const sc = document.createElement('div');
  sc.className = 'bsc';
  const g = document.createElement('div');
  g.className = 'bgrp';
  const owner = G.players[sp.owner];
  addBox(g, 2.15, 0.8, 0.06, owner ? owner.color : '#999', TR(0, 0, 0));            /* 주인 색 받침 */
  if(sp.bl.L){
    addBox(g, 1.1, 0.8, 0.22, HOUSE.Ld, TR(0, 0.07, 0));
    addPrism(g, 8, 0.32, 0.95, HOUSE.L, TR(0, 0.29, 0), false, false);
    addPrism(g, 8, 0.4, 0.1, HOUSE.Ld, TR(0, 0.86, 0));
    addCone(g, 8, 0.32, 0.45, HOUSE.L, TR(0, 1.24, 0), false);
  } else {
    if(sp.bl.v){                                                                  /* 별장: 작은 집 + 박공지붕 */
      addBox(g, 0.5, 0.5, 0.36, HOUSE.v, TR(-0.72, 0.06, 0));
      addCone(g, 4, 0.36, 0.3, HOUSE.vRoof, TR(-0.72, 0.42, 0), false);
    }
    if(sp.bl.b){                                                                  /* 빌딩: 길쭉한 탑 */
      addBox(g, 0.46, 0.46, 0.95, HOUSE.b, TR(0, 0.06, 0));
      addBox(g, 0.5, 0.5, 0.06, HOUSE.bTop, TR(0, 1.02, 0));
    }
    if(sp.bl.h){                                                                  /* 호텔: 넓고 붉은 건물 */
      addBox(g, 0.62, 0.58, 0.58, HOUSE.h, TR(0.72, 0.06, 0));
      addCone(g, 4, 0.44, 0.22, HOUSE.hRoof, TR(0.72, 0.64, 0), false);
    }
  }
  sc.appendChild(g); st.appendChild(sc);
  return st;
}
/* ================= 3D 피규어 말 ================= */
/* 모든 치수는 em 단위. 바깥에서 font-size 만 바꾸면 그대로 확대, 축소된다. */
const PIECES = [
  {k:'hat',    n:'실크햇',   ic:icon('p-hat')},
  {k:'rocket', n:'로켓',     ic:icon('p-rocket')},
  {k:'crown',  n:'왕관',     ic:icon('p-crown')},
  {k:'gem',    n:'보석',     ic:icon('p-gem')},
  {k:'car',    n:'스포츠카', ic:icon('p-car')},
  {k:'die',    n:'주사위',   ic:icon('p-die')}
];
const IVORY = '#F4EEE0', DARK = '#2E2C32', GOLD = '#E0B341';
const emu = (v) => (Math.round(v*10000)/10000) + 'em';
const TR = (x,y,z) => 'translate3d('+emu(x)+','+emu(-y)+','+emu(z)+')';
/* 회전하는 피규어이므로 면 밝기는 모델에 고정된 스타일화된 광원으로 처리한다 */
const sideBright = (deg) => 0.66 + 0.56*(0.5 + 0.5*Math.cos((deg-35)*Math.PI/180));

function fFace(g, w, h, tf, col, b, cls){
  const d = document.createElement('div');
  d.className = 'fface' + (cls ? ' '+cls : '');
  d.style.width = emu(w); d.style.height = emu(h);
  d.style.marginLeft = emu(-w/2); d.style.marginTop = emu(-h/2);
  d.style.transform = tf; d.style.background = col;
  d.style.filter = 'brightness('+b.toFixed(3)+')';
  g.appendChild(d); return d;
}
function fTri(g, w, h, tf, col, b){
  const d = document.createElement('div');
  d.className = 'ftri';
  d.style.width = emu(w); d.style.height = emu(h);
  d.style.marginLeft = emu(-w/2); d.style.marginTop = '0';
  d.style.transform = tf; d.style.background = col;
  d.style.filter = 'brightness('+b.toFixed(3)+')';
  g.appendChild(d); return d;
}
function fDisc(g, r, tf, col, b){
  const d = fFace(g, 2*r, 2*r, tf, col, b, 'fdisc');
  return d;
}
/* 기둥: base 위치의 바닥 중심에서 위로 h 만큼 */
function addPrism(g, n, r, h, col, base, capTop, capBot){
  const a = r*Math.cos(Math.PI/n), w = 2*r*Math.sin(Math.PI/n);
  for(let i=0;i<n;i++){
    const th = i*360/n;
    fFace(g, w*1.03, h, base+' translateY('+emu(-h/2)+') rotateY('+th+'deg) translateZ('+emu(a)+')', col, sideBright(th));
  }
  if(capTop) fDisc(g, r, base+' translateY('+emu(-h)+') rotateX(90deg)', col, 1.24);
  if(capBot) fDisc(g, r, base+' rotateX(-90deg)', col, 0.5);
}
/* 원뿔: flip=false 면 꼭짓점이 위, true 면 아래 */
function addCone(g, n, r, h, col, base, flip){
  const a = r*Math.cos(Math.PI/n), w = 2*r*Math.sin(Math.PI/n);
  const L = Math.sqrt(h*h + a*a);
  const beta = Math.atan2(a, h) * 180/Math.PI;
  for(let i=0;i<n;i++){
    const th = i*360/n;
    const tf = flip
      ? base+' rotateY('+th+'deg) rotateX('+(180-beta).toFixed(3)+'deg)'
      : base+' translateY('+emu(-h)+') rotateY('+th+'deg) rotateX('+beta.toFixed(3)+'deg)';
    fTri(g, w*1.03, L, tf, col, sideBright(th));
  }
  fDisc(g, r, base+' translateY('+emu(flip?-h:0)+') rotateX(90deg)', col, flip?1.18:0.52);
}
/* 상자: base 위치의 바닥 중심에서 위로 h */
function addBox(g, w, d, h, col, base){
  const T = base+' translateY('+emu(-h/2)+') ';
  fFace(g, w, h, T+'translateZ('+emu(d/2)+')', col, 1.02);
  fFace(g, w, h, T+'rotateY(180deg) translateZ('+emu(d/2)+')', col, 0.70);
  fFace(g, d, h, T+'rotateY(90deg) translateZ('+emu(w/2)+')', col, 0.90);
  fFace(g, d, h, T+'rotateY(-90deg) translateZ('+emu(w/2)+')', col, 0.78);
  fFace(g, w, d, T+'rotateX(90deg) translateZ('+emu(h/2)+')', col, 1.20);
  fFace(g, w, d, T+'rotateX(-90deg) translateZ('+emu(h/2)+')', col, 0.48);
}
function addDieCube(g, s, col, base){
  const T = base+' translateY('+emu(-s/2)+') ';
  const put = (v, rot, b) => {
    const f = fFace(g, s, s, T+rot+' translateZ('+emu(s/2)+')', col, b, 'fdf');
    let h=''; for(let i=1;i<=9;i++) h += '<span class="'+(PIPS[v].indexOf(i)>=0?'pip':'')+'"></span>';
    f.innerHTML = h;
  };
  put(1,'',1.02); put(6,'rotateY(180deg)',0.70); put(3,'rotateY(90deg)',0.90);
  put(4,'rotateY(-90deg)',0.78); put(2,'rotateX(-90deg)',1.20); put(5,'rotateX(90deg)',0.48);
}

function buildFigure(kind, color){
  const g = document.createElement('div');
  g.className = 'fgrp';
  if(kind==='hat'){
    addPrism(g, 20, 0.62, 0.05, DARK, TR(0,0,0), false, true);   /* 챙 */
    addPrism(g, 16, 0.34, 0.88, DARK, TR(0,0.05,0), true, false);/* 통 */
    addPrism(g, 16, 0.356, 0.17, color, TR(0,0.11,0));           /* 리본 */
  } else if(kind==='rocket'){
    [0,120,240].forEach(ang=>{
      addBox(g, 0.05, 0.24, 0.32, color, 'rotateY('+ang+'deg) translateZ('+emu(0.22)+')');
    });
    addPrism(g, 14, 0.235, 0.95, IVORY, TR(0,0.02,0), false, true);
    addPrism(g, 14, 0.242, 0.18, color, TR(0,0.60,0));
    addCone(g, 14, 0.235, 0.44, color, TR(0,0.97,0), false);
  } else if(kind==='crown'){
    addPrism(g, 14, 0.40, 0.52, color, TR(0,0,0), false, true);
    addPrism(g, 14, 0.425, 0.09, GOLD, TR(0,0.50,0));
    for(let i=0;i<7;i++){
      const a = i*360/7 * Math.PI/180;
      addCone(g, 6, 0.095, 0.36, GOLD, TR(0.315*Math.cos(a), 0.58, 0.315*Math.sin(a)), false);
    }
  } else if(kind==='gem'){
    addCone(g, 8, 0.42, 0.62, color, TR(0,0,0), true);   /* 아래 뾰족 */
    addPrism(g, 8, 0.42, 0.08, color, TR(0,0.62,0));     /* 거들 */
    addCone(g, 8, 0.42, 0.34, color, TR(0,0.70,0), false);
  } else if(kind==='car'){
    addBox(g, 1.00, 0.46, 0.24, color, TR(0,0.09,0));
    addBox(g, 0.46, 0.40, 0.20, IVORY, TR(-0.06,0.33,0));
    [[0.32,0.25],[0.32,-0.25],[-0.32,0.25],[-0.32,-0.25]].forEach(w=>{
      addPrism(g, 10, 0.11, 0.07, DARK, TR(w[0],0.02,w[1])+' rotateZ(90deg)', true, true);
    });
  } else {
    addDieCube(g, 0.70, color, TR(0,0.02,0));
    addPrism(g, 18, 0.34, 0.04, DARK, TR(0,0,0), true, false);
  }
  return g;
}
function figureStage(kind, color, still){
  const st = document.createElement('div');
  st.className = 'fstage' + (still ? ' still' : '');
  const sc = document.createElement('div');
  sc.className = 'fscene';
  const pad = document.createElement('div');
  pad.className = 'fpad';
  sc.appendChild(pad);
  sc.appendChild(buildFigure(kind, color));
  st.appendChild(sc);
  return st;
}

/* 통행료: 실제 부루마불처럼 건물 단계별 절대 금액을 그대로 쓴다.
   t = [기본, 별장, 빌딩, 호텔]. 랜드마크는 호텔의 1.7배로 한 단계 더. */
const LANDMARK_MULT = 1.7;
function bldLevel(sp){
  if(sp.bl.L) return 4;
  if(sp.bl.h) return 3;
  if(sp.bl.b) return 2;
  if(sp.bl.v) return 1;
  return 0;
}
function tollAtLevel(sp, lv){
  if(lv <= 3) return sp.t[lv];
  return Math.round(sp.t[3] * LANDMARK_MULT);   /* 랜드마크 */
}
/* ================= 숨은 운 보정 =================
   1등이 2등보다 크게 앞서면 운이 조금씩 나빠지고, 꼴찌가 크게 뒤처지면 조금씩 좋아진다.
   주사위 눈은 건드리지 않고 황금열쇠, 미니게임, 복권, 코인 차트에만 작용한다. 화면에는 표시하지 않는다.
   값은 -1(가장 불리) ~ +0.6(가장 유리) */
function luck(p){
  if(!p || !p.alive) return 0;
  const al = alivePlayers();
  if(al.length < 2) return 0;
  const w = al.map(o=>({o:o, a:Math.max(1, assets(o))})).sort((x,y)=>y.a-x.a);
  const top = w[0], second = w[1], last = w[w.length-1];
  const ratio = top.a / second.a, gap = top.a - second.a;
  if(p === top.o){
    if(ratio < 1.35 || gap < 80) return 0;
    return -Math.min(1, 0.35 + (ratio - 1.35)*0.9);          /* 1.35배면 -0.35, 2배면 약 -0.94 */
  }
  if(p === last.o && al.length >= 2){
    const r = top.a / last.a;
    if(r < 1.8) return 0;
    return Math.min(0.6, 0.2 + (r - 1.8)*0.3);
  }
  return 0;
}
/* 지금 총자산 1등인가 (혼자 남았으면 아니다) */
function leaderOf(){
  const al = alivePlayers();
  if(al.length < 2) return null;
  return al.slice().sort((a,b)=>assets(b)-assets(a) || b.cash-a.cash)[0];
}
function isLeader(p){ return leaderOf() === p; }
/* 역전 월급: 1등 총자산의 70% 이하인 사람은 출발지 월급을 1.5배로 받는다 */
function catchUpSalary(p){
  const top = leaderOf();
  return !!top && top !== p && p.alive && assets(p) <= assets(top)*0.7;
}
/* 황금열쇠 풀 구분 (화면에는 보이지 않는다): 'top' 앞서가는 1등, 'low' 많이 뒤진 사람, 그 밖은 'mid' */
function keyTier(p){
  const al = alivePlayers();
  if(al.length < 2) return 'mid';
  const w = al.slice().sort((a,b)=>assets(b)-assets(a));
  const top = assets(w[0]), second = assets(w[1]);
  if(p === w[0]) return top > second*1.1 ? 'top' : 'mid';
  if(p === w[w.length-1] || assets(p) <= top*0.6) return 'low';
  return 'mid';
}
/* 기본 확률 base 를 운에 따라 옮긴다. k 는 운이 얼마나 크게 작용하는지 */
function luckProb(p, base, k){ return Math.max(0.03, Math.min(0.97, base + luck(p)*(k === undefined ? 0.25 : k))); }
const GOOD_CARDS = {world:1, gain:1, lotto:1, escape:1, pass:1, bday:1, mindset:1, reroll:1, hodl:1, gostart:1, freebuild:1, fundgo:1, space:1};
const BAD_CARDS  = {island:1, pay:1, perb:1, halfsale:1, back:1};
/* 1등 풀에만 들어 있는 악재 카드 */
const LEADER_CARDS = {bubble:1, rentcap:1, typhoon:1, audit:1, angel:1, permit:1};
/* 풀마다 카드 종류별 가중치. 같은 더미에서 뽑지만 순위에 따라 나올 확률이 다르다 */
const KEY_WEIGHT = {
  top: {good:0.5, bad:1.6, neutral:1, leader:2,  richtax:2},
  mid: {good:1,   bad:1,   neutral:1, leader:0,  richtax:1},

  });
}

/* 통행료 최종액: 소유자 측 할증(박카스, 최후2인) 적용 후, 납부자가 범죄자면 75만원 초과분 할인 */
function finalToll(payer, owner, sp){
  let toll = calcToll(sp);
  /* 박카스의 기운: 소유 타일에 건물 2채 이상이면 통행료 20% 증가 */
  if(owner && owner.bhacks && sp.type==='city' && bldCount(sp) >= 2){
    toll = Math.round(toll * 1.2);
  }
  /* 임대료 규제 카드: 소유자의 통행료 절반 */
  if(owner && owner.rentCap > 0) toll = Math.max(1, Math.round(toll * 0.5));
  /* 최후 2인 통행료 버프 소유자 */
  if(owner && owner.tollBuff && owner.alive){
    toll += Math.round(toll * owner.tollBuff);
  }
  /* CP enjoyer: 남에게 내는 통행료 20% 할인 (올림) */
  if(payer && payer.cpEnjoyer && toll > 0){
    toll = Math.ceil(toll * 0.8);
  }
  /* 범죄자: 75만원 초과 통행료 20% 할인 (올림) */
  if(payer && payer.criminal && toll > 75){
    toll = Math.ceil(toll * 0.8);
  }
  return toll;
}
function bldCount(sp){
  if(sp.type!=='city') return 0;
  return (sp.bl.v?1:0)+(sp.bl.b?1:0)+(sp.bl.h?1:0)+(sp.bl.L?1:0);
}

/* ================= 계절 배경 =================
   판 바깥 여백에 계절마다 다른 입자가 천천히 흐른다 (봄 꽃잎, 여름 빛, 가을 낙엽, 겨울 눈).
   움직임 줄이기 설정에서는 그리지 않는다. */
/* ================= 계절 풍경 =================
   하늘 아래쪽에 깔리는 언덕, 바다, 산, 나무. 시작할 때 한 번 SVG 로 그려 계절 층마다 넣는다.
   움직이는 것이 없어 다시 그릴 일이 없고, 계절이 바뀌면 층째 서서히 바뀐다.
   (봄: 벚꽃 언덕과 무지개 / 여름: 바다, 모래사장, 야자수, 돛단배 / 가을: 노을, 보랏빛 산, 단풍 / 겨울: 달, 별, 설산, 눈 덮인 전나무와 오두막) */
const Scenery = (()=>{
  const W = 1600, H = 720;
  let seed = 11;
  const rnd = ()=>{ seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const r = (a, b)=>a + rnd()*(b - a);
  const f = (v)=>String(Math.round(v*10)/10);
  /* 완만한 능선: 사인파 몇 개를 겹친다 */
  function ridge(base, waves){
    const ph = waves.map(()=>r(0, Math.PI*2)), pts = [];
    for(let x=-20;x<=W+20;x+=20){
      let y = base;
      waves.forEach((w, i)=>{ y += w[0]*Math.sin(x/w[1]*Math.PI*2 + ph[i]); });
      pts.push([x, y]);
    }
    return pts;
  }
  function smooth(pts){
    let d = 'L'+f(pts[0][0])+' '+f(pts[0][1]);
    for(let i=1;i<pts.length;i++){
      const a = pts[i-1], b = pts[i];
      d += ' Q'+f(a[0])+' '+f(a[1])+' '+f((a[0]+b[0])/2)+' '+f((a[1]+b[1])/2);
    }
    return d;
  }
  function hill(pts, fill, extra){
    const z = pts[pts.length-1];
    return '<path d="M'+f(pts[0][0])+' '+H+' '+smooth(pts)+' L'+f(z[0])+' '+f(z[1])+' L'+f(z[0])+' '+H+' Z" fill="'+fill+'"'+(extra || '')+'/>';
  }
  function edge(pts, stroke, w, extra){
    return '<path d="M'+f(pts[0][0])+' '+f(pts[0][1])+' '+smooth(pts).slice(1)+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'"'+(extra || '')+'/>';
  }
  function yAt(pts, x){
    for(let i=1;i<pts.length;i++) if(pts[i][0] >= x){ const a = pts[i-1], b = pts[i], t = (x - a[0])/(b[0] - a[0]); return a[1] + (b[1] - a[1])*t; }
    return pts[pts.length-1][1];
  }
  /* 뾰족한 산줄기와 눈 덮인 봉우리 */
  function peaks(base, hmin, hmax, n){
    const pts = [[-60, base]], span = (W + 120)/n;
    for(let i=0;i<n;i++){
      pts.push([-60 + span*(i + r(0.35, 0.65)), base - r(hmin, hmax)]);
      pts.push([-60 + span*(i + 1), base - r(0, hmin*0.45)]);
    }
    return pts;
  }
  function range(pts, fill, cap, extra){
    let s = '<path d="M'+f(pts[0][0])+' '+H+' '+pts.map(p=>'L'+f(p[0])+' '+f(p[1])).join(' ')+' L'+f(pts[pts.length-1][0])+' '+H+' Z" fill="'+fill+'"'+(extra || '')+'/>';
    if(cap){
      for(let i=1;i<pts.length-1;i+=2){
        const P = pts[i], L = pts[i-1], R = pts[i+1], k = r(0.24, 0.34);
        const a = [P[0] + (L[0]-P[0])*k, P[1] + (L[1]-P[1])*k], b = [P[0] + (R[0]-P[0])*k, P[1] + (R[1]-P[1])*k];
        const m1 = [a[0] + (b[0]-a[0])*0.3, Math.max(a[1], b[1]) - r(4, 12)], m2 = [a[0] + (b[0]-a[0])*0.62, Math.max(a[1], b[1]) + r(-2, 6)];
        s += '<path d="M'+f(P[0])+' '+f(P[1])+' L'+f(a[0])+' '+f(a[1])+' L'+f(m1[0])+' '+f(m1[1])+' L'+f(m2[0])+' '+f(m2[1])+' L'+f(b[0])+' '+f(b[1])+' Z" fill="'+cap+'"/>';
      }
    }
    return s;
  }
  /* --- 나무와 소품 --- */
  function blossomTree(x, y, sc, pal, trunk){
    const h = 74*sc;
    let g = '<path d="M'+f(x-5*sc)+' '+f(y+2)+' Q'+f(x-1*sc)+' '+f(y-h*0.45)+' '+f(x-9*sc)+' '+f(y-h*0.82)+' L'+f(x-2*sc)+' '+f(y-h*0.84)+' Q'+f(x+4*sc)+' '+f(y-h*0.45)+' '+f(x+5*sc)+' '+f(y+2)+' Z" fill="'+trunk+'"/>' +
      '<path d="M'+f(x+1*sc)+' '+f(y-h*0.5)+' q'+f(12*sc)+' '+f(-8*sc)+' '+f(22*sc)+' '+f(-26*sc)+'" stroke="'+trunk+'" stroke-width="'+f(3.2*sc)+'" fill="none" stroke-linecap="round"/>';
    /* 아래쪽 그늘 덩어리 → 밝은 덩어리 → 하이라이트 */
    for(let k=0;k<7;k++){ const a = r(0, Math.PI*2), d = r(6, 26)*sc; g += '<circle cx="'+f(x + Math.cos(a)*d*1.35)+'" cy="'+f(y - h + 6*sc + Math.sin(a)*d*0.6)+'" r="'+f(r(15, 21)*sc)+'" fill="'+pal[0]+'"/>'; }
    for(let k=0;k<8;k++){ const a = r(0, Math.PI*2), d = r(0, 22)*sc; g += '<circle cx="'+f(x - 3*sc + Math.cos(a)*d*1.3)+'" cy="'+f(y - h - 2*sc + Math.sin(a)*d*0.6)+'" r="'+f(r(11, 17)*sc)+'" fill="'+pal[1 + (k % (pal.length - 2))]+'"/>'; }
    for(let k=0;k<7;k++) g += '<circle cx="'+f(x + r(-26, 22)*sc)+'" cy="'+f(y - h + r(-20, 4)*sc)+'" r="'+f(r(2, 4.2)*sc)+'" fill="'+pal[pal.length-1]+'" opacity=".85"/>';
    return g;
  }
  function pine(x, y, sc, snow){
    const h = 96*sc, w = 30*sc;
    let g = '<rect x="'+f(x-3.5*sc)+'" y="'+f(y-14*sc)+'" width="'+f(7*sc)+'" height="'+f(16*sc)+'" fill="#3B2A22"/>';
    for(let k=0;k<4;k++){
      const ty = y - 10*sc - k*h*0.19, tw = w*(1 - k*0.2), th = h*0.34;
      g += '<path d="M'+f(x-tw)+' '+f(ty)+' L'+f(x)+' '+f(ty-th)+' L'+f(x+tw)+' '+f(ty)+' Z" fill="'+(k % 2 ? '#1D4A52' : '#16404A')+'"/>';
      if(snow) g += '<path d="M'+f(x-tw*0.52)+' '+f(ty-th*0.48)+' L'+f(x)+' '+f(ty-th)+' L'+f(x+tw*0.52)+' '+f(ty-th*0.48)+' Q'+f(x+tw*0.26)+' '+f(ty-th*0.38)+' '+f(x)+' '+f(ty-th*0.5)+' Q'+f(x-tw*0.26)+' '+f(ty-th*0.38)+' '+f(x-tw*0.52)+' '+f(ty-th*0.48)+' Z" fill="#F2F6FF"/>' +
        '<path d="M'+f(x-tw*0.95)+' '+f(ty-1)+' Q'+f(x-tw*0.6)+' '+f(ty-5*sc)+' '+f(x-tw*0.3)+' '+f(ty-2*sc)+'" stroke="#EEF3FF" stroke-width="'+f(2.4*sc)+'" fill="none" stroke-linecap="round"/>';
    }
    return g;
  }
  function palm(x, y, sc, lean){
    const h = 150*sc, tx = x + lean*h*0.4, ty = y - h, cxp = x + lean*h*0.04, cyp = y - h*0.62;
    const trunk = 'M'+f(x)+' '+f(y)+' Q'+f(cxp)+' '+f(cyp)+' '+f(tx)+' '+f(ty);
    let g = '<path d="'+trunk+'" stroke="#9A6B43" stroke-width="'+f(10*sc)+'" fill="none" stroke-linecap="round"/>' +
      '<path d="'+trunk+'" stroke="#74502F" stroke-width="'+f(10*sc)+'" fill="none" stroke-dasharray="'+f(2.5*sc)+' '+f(7*sc)+'"/>';
    [-168, -140, -112, -84, -58, -30, -6, 16].forEach((a, i)=>{
      const rad = a*Math.PI/180, len = r(66, 86)*sc;
      const ex = tx + Math.cos(rad)*len, ey = ty + Math.sin(rad)*len*0.55 + len*0.42;
      const dx = ex - tx, dy = ey - ty, L = Math.hypot(dx, dy) || 1, nx = -dy/L, ny = dx/L, wd = 10*sc;
      const mx = (tx + ex)/2, my = (ty + ey)/2 - len*0.24;
      g += '<path d="M'+f(tx)+' '+f(ty)+' Q'+f(mx + nx*wd)+' '+f(my + ny*wd)+' '+f(ex)+' '+f(ey)+' Q'+f(mx - nx*wd*0.4)+' '+f(my - ny*wd*0.4)+' '+f(tx)+' '+f(ty)+' Z" fill="'+(i % 2 ? '#2E8B57' : '#22704A')+'"/>';
    });
    return g + '<circle cx="'+f(tx-5*sc)+'" cy="'+f(ty+6*sc)+'" r="'+f(5.5*sc)+'" fill="#6B4A2A"/><circle cx="'+f(tx+5*sc)+'" cy="'+f(ty+7*sc)+'" r="'+f(5.5*sc)+'" fill="#7C5632"/>';
  }
  function boat(x, y, sc){
    return '<path d="M'+f(x-24*sc)+' '+f(y)+' L'+f(x+24*sc)+' '+f(y)+' L'+f(x+16*sc)+' '+f(y+8*sc)+' L'+f(x-16*sc)+' '+f(y+8*sc)+' Z" fill="#2C4766"/>' +
      '<path d="M'+f(x)+' '+f(y-2*sc)+' L'+f(x)+' '+f(y-50*sc)+' L'+f(x+22*sc)+' '+f(y-6*sc)+' Z" fill="#FFFFFF"/>' +
      '<path d="M'+f(x-2.5*sc)+' '+f(y-5*sc)+' L'+f(x-2.5*sc)+' '+f(y-40*sc)+' L'+f(x-19*sc)+' '+f(y-6*sc)+' Z" fill="#FFD9A0"/>' +
      '<path d="M'+f(x-30*sc)+' '+f(y+10*sc)+' h'+f(60*sc)+'" stroke="#FFFFFF" stroke-width="'+f(1.6*sc)+'" opacity=".6"/>';

    }
    return g + '<path d="M'+f(x-40*sc)+' '+f(y+2*sc)+' h'+f(30*sc)+'" stroke="#3E8FC4" stroke-width="'+f(7*sc)+'" stroke-linecap="round"/>';
  }
  function cabin(x, y, sc){
    return '<circle cx="'+f(x-9*sc)+'" cy="'+f(y-14*sc)+'" r="'+f(30*sc)+'" fill="url(#wGlow)"/>' +
      '<rect x="'+f(x+9*sc)+'" y="'+f(y-52*sc)+'" width="'+f(7*sc)+'" height="'+f(16*sc)+'" fill="#4E2C21"/>' +

      '<rect x="'+f(x-15*sc)+'" y="'+f(y-20*sc)+'" width="'+f(11*sc)+'" height="'+f(10*sc)+'" fill="#FFD27A"/>' +
      '<path d="M'+f(x-9.5*sc)+' '+f(y-20*sc)+' v'+f(10*sc)+' M'+f(x-15*sc)+' '+f(y-15*sc)+' h'+f(11*sc)+'" stroke="#6B3B2B" stroke-width="'+f(1.4*sc)+'"/>' +

  }
  function dots(pts, n, cols, rmin, rmax, depth){

    for(let k=0;k<n;k++){

  /* 가장자리(보드 옆으로 보이는 자리)에 나무를 몰아 심는다 */
  const sides = (n)=>{ const xs = []; for(let k=0;k<n;k++) xs.push(k % 2 ? r(W - 340, W + 10) : r(-10, 340)); return xs; };

  function spring(){
    const far = ridge(430, [[24, 900], [12, 360]]), mid = ridge(505, [[26, 700], [11, 260]]), near = ridge(600, [[22, 820], [9, 300]]);

      '<linearGradient id="spM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ACD99E"/><stop offset="1" stop-color="#8CC583"/></linearGradient>' +

    ['#FF6B6B', '#FFA94D', '#FFE066', '#69DB7C', '#4DABF7', '#9775FA'].forEach((c, i)=>{

    });

  }
  function summer(){
    const horizon = 470, beachL = ridge(628, [[16, 900], [7, 300]]);
    let g = '<defs><linearGradient id="suS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B9CC4"/><stop offset=".45" stop-color="#3FC0DA"/><stop offset="1" stop-color="#9BE9E4"/></linearGradient>' +
      '<linearGradient id="suB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E6B4"/><stop offset="1" stop-color="#E8C487"/></linearGradient>' +
      '<radialGradient id="suG" cx=".72" cy="0" r=".6"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient></defs>';
    g += '<path d="M180 '+horizon+' q60 -34 140 -8 q40 -22 90 8 Z" fill="#3E8C86" opacity=".55"/>';

      g += '<path d="M'+f(x)+' '+f(y)+' h'+f(r(6, 34))+'" stroke="#FFFFFF" stroke-width="'+f(r(1, 2.4))+'" stroke-linecap="round" opacity="'+f(r(0.35, 0.9))+'"/>';

  function autumn(){

    let g = '<defs><radialGradient id="auSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF1C2"/><stop offset=".25" stop-color="#FFD27A" stop-opacity=".95"/><stop offset=".6" stop-color="#FFB25E" stop-opacity=".35"/><stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/></radialGradient>' +

  }
  function winter(){
    const far = peaks(470, 100, 240, 6), mid = peaks(545, 50, 120, 9), near = ridge(620, [[18, 800], [8, 300]]);
    let g = '<defs><radialGradient id="wiMoon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFBE6" stop-opacity=".9"/><stop offset=".3" stop-color="#E9F0FF" stop-opacity=".35"/><stop offset="1" stop-color="#E9F0FF" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="wGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD27A" stop-opacity=".7"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>' +
      '<linearGradient id="wiN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F9FF"/><stop offset="1" stop-color="#C6D3EE"/></linearGradient></defs>';
    for(let k=0;k<90;k++) g += '<circle cx="'+f(r(0, W))+'" cy="'+f(Math.pow(rnd(), 1.3)*400)+'" r="'+f(r(0.7, 1.9))+'" fill="#FFFFFF" opacity="'+f(r(0.3, 0.95))+'"/>';
    g += '<circle cx="1490" cy="250" r="150" fill="url(#wiMoon)"/><circle cx="1490" cy="250" r="40" fill="#FFF8DE"/>' +
      '<circle cx="1478" cy="240" r="8" fill="#EDE3C2" opacity=".6"/><circle cx="1502" cy="264" r="5.5" fill="#EDE3C2" opacity=".5"/><circle cx="1500" cy="234" r="3.5" fill="#EDE3C2" opacity=".5"/>';
    g += range(far, '#3A5596', '#DCE6FF', ' opacity=".9"');
    g += range(mid, '#56719F', '#EEF3FF');
    g += hill(near, 'url(#wiN)');
    g += edge(near.map(p=>[p[0], p[1] + 1]), '#FFFFFF', 3, ' opacity=".9"');
    for(const x of sides(10)) g += pine(x, yAt(near, x) + 12, r(0.7, 1.15), true);
    g += cabin(1360, yAt(near, 1360) + 16, 1.05);
    return g;
  }
  return {
    mount(){
      const make = {spring:spring, summer:summer, autumn:autumn, winter:winter};
      Object.keys(make).forEach(k=>{
        const layer = document.querySelector('.sky-'+k);
        if(!layer || layer.querySelector('.land')) return;
        seed = 11 + k.length*7;
        const svg = '<svg class="land" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+make[k]()+'</svg>';
        layer.insertAdjacentHTML('beforeend', svg);
      });
    }
  };
})();

const Ambient = (()=>{
  /* 계절 입자. 입자 모양은 시작할 때 작은 캔버스(스프라이트)로 한 번만 그려 두고, 매 프레임에는 회전, 크기만 바꿔 찍는다. */
  let cv = null, ctx = null, W = 0, H = 0, parts = [], kind = '', running = false, last = 0, skip = false;
  const TAU = Math.PI * 2, SPR = {};
  function sprite(size, draw){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    if(x) draw(x, size);
    return c;
  }
  function makeSprites(){
    if(SPR.ready) return;
    /* 봄: 벚꽃잎 (끝이 살짝 갈라진 꽃잎), 반짝임 */
    SPR.petal = ['#FFC1D6', '#FF9EC1', '#FFD9E6', '#F7A8D8'].map(col=>sprite(48, (x, s)=>{
      const g = x.createLinearGradient(0, 0, s, s); g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.45, col); g.addColorStop(1, col);
      x.fillStyle = g; x.translate(s/2, s/2);
      x.beginPath(); x.moveTo(0, -18); x.bezierCurveTo(14, -16, 16, 6, 0, 18); x.bezierCurveTo(-16, 6, -14, -16, 0, -18); x.fill();
      x.globalCompositeOperation = 'destination-out';
      x.beginPath(); x.moveTo(-3, -19); x.lineTo(0, -13); x.lineTo(3, -19); x.fill();
    }));
    SPR.sparkle = sprite(32, (x, s)=>{
      const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,240,250,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, s, s);
      x.fillStyle = 'rgba(255,255,255,.95)'; x.fillRect(s/2-0.75, 3, 1.5, s-6); x.fillRect(3, s/2-0.75, s-6, 1.5);
    });
    /* 여름: 빛망울 (가장자리가 진한 둥근 빛) */
    SPR.bokeh = ['255,250,210', '200,255,245', '255,225,160', '190,235,255'].map(rgb=>sprite(96, (x, s)=>{
      const g = x.createRadialGradient(s/2, s/2, s*0.1, s/2, s/2, s/2);
      g.addColorStop(0, 'rgba('+rgb+',.10)'); g.addColorStop(0.78, 'rgba('+rgb+',.28)'); g.addColorStop(0.92, 'rgba('+rgb+',.55)'); g.addColorStop(1, 'rgba('+rgb+',0)');
      x.fillStyle = g; x.beginPath(); x.arc(s/2, s/2, s/2, 0, TAU); x.fill();
    }));
    /* 가을: 단풍잎 (다섯 갈래) */
    SPR.leaf = ['#E2452B', '#F2782D', '#F6A623', '#B8322E', '#D85A1E'].map(col=>sprite(56, (x, s)=>{
      x.translate(s/2, s/2 + 2);
      const g = x.createLinearGradient(-20, -20, 20, 20); g.addColorStop(0, col); g.addColorStop(1, '#7A1F14');
      x.fillStyle = g; x.beginPath();
      const lobes = [[0, -22], [15, -12], [20, 3], [9, 4], [12, 14], [0, 8], [-12, 14], [-9, 4], [-20, 3], [-15, -12]];
      x.moveTo(0, -22);
      for(let i=1;i<=lobes.length;i++){ const a = lobes[i % lobes.length], b = lobes[i-1]; x.quadraticCurveTo((a[0]+b[0])/2*1.15, (a[1]+b[1])/2*1.15, a[0], a[1]); }
      x.fill();
      x.strokeStyle = 'rgba(90,20,10,.55)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(0, 18); x.lineTo(0, -16); x.moveTo(0, 0); x.lineTo(13, -9); x.moveTo(0, 0); x.lineTo(-13, -9); x.stroke();
    }));
    /* 겨울: 눈송이 (육각 결정과 둥근 눈), 별 */
    SPR.flake = sprite(48, (x, s)=>{
      x.translate(s/2, s/2); x.strokeStyle = 'rgba(255,255,255,.95)'; x.lineWidth = 2; x.lineCap = 'round';
      for(let i=0;i<6;i++){ x.rotate(TAU/6); x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -19); x.moveTo(0, -11); x.lineTo(5, -15); x.moveTo(0, -11); x.lineTo(-5, -15); x.stroke(); }
    });
    SPR.snow = sprite(32, (x, s)=>{
      const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.45, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, s, s);
    });
    SPR.ready = true;
  }
  function size(){
    if(!cv) return;
    const dpr = 1;                                 /* 부드러운 입자라 1배 해상도로 충분하다 (성능) */
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const pick = (arr)=>arr[Math.floor(Math.random()*arr.length)];
  function spawn(p, anywhere){
    p.x = Math.random()*W;
    p.y = anywhere ? Math.random()*H : (kind==='summer' ? H + 40 : -40);
    p.r = Math.random()*TAU; p.vr = (Math.random()-0.5)*2.2;
    p.ph = Math.random()*TAU; p.v = 0.6 + Math.random()*0.8;
    if(kind==='spring'){ p.img = Math.random() < 0.18 ? SPR.sparkle : pick(SPR.petal); p.s = p.img===SPR.sparkle ? 10 + Math.random()*10 : 12 + Math.random()*12; }
    else if(kind==='summer'){ p.img = pick(SPR.bokeh); p.s = 30 + Math.random()*90; p.a = 0.35 + Math.random()*0.55; }
    else if(kind==='autumn'){ p.img = pick(SPR.leaf); p.s = 16 + Math.random()*18; }
    else { const f = Math.random() < 0.3; p.img = f ? SPR.flake : SPR.snow; p.s = f ? 12 + Math.random()*14 : 4 + Math.random()*10; }
    return p;
  }
  /* 계절 손님: 봄 나비, 여름 갈매기, 가을 철새 떼, 겨울 반짝이는 별과 별똥별 */
  let critters = [], stars = [], shoot = null, nextShoot = 0, nextFlock = 0;
  /* 나비 한 마리를 색깔별로 미리 그려 두고, 매 장면에는 날개 폭만 바꿔 찍는다 */
  const FLY = {};
  function flySprite(c){
    if(FLY[c]) return FLY[c];
    return FLY[c] = sprite(40, (x, s)=>{
      x.translate(s/2, s/2); x.fillStyle = c;
      const e = (cx, cy, rx, ry, rot)=>{ x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, TAU); x.fill(); };
      e(-9, -5, 10, 7.5, -0.5); e(9, -5, 10, 7.5, 0.5); e(-7, 6, 6.6, 5, 0.5); e(7, 6, 6.6, 5, -0.5);
      x.fillStyle = 'rgba(255,255,255,.35)'; e(-10, -7, 4, 2.6, -0.5); e(10, -7, 4, 2.6, 0.5);
      x.fillStyle = 'rgba(70,52,70,.9)'; x.fillRect(-1.2, -8, 2.4, 16);
    });
  }
  function makeCritters(){
    critters = []; stars = []; shoot = null;
    const t = nowMs()/1000;
    nextShoot = t + 2 + Math.random()*4; nextFlock = t + 1.5;
    if(kind==='spring'){
      const cols = ['#FFE27A', '#FFB3D1', '#C9B6FF', '#FFFFFF', '#9FE3C8'];
      for(let i=0;i<4;i++) critters.push({x:Math.random()*W, y:H*(0.25 + Math.random()*0.6), a:Math.random()*TAU, s:7 + Math.random()*5, c:cols[i % cols.length], ph:Math.random()*TAU, v:28 + Math.random()*22});
    } else if(kind==='summer'){
      for(let i=0;i<3;i++) critters.push({x:Math.random()*W, y:H*(0.08 + Math.random()*0.3), s:11 + Math.random()*7, ph:Math.random()*TAU, v:(Math.random() < 0.5 ? -1 : 1)*(22 + Math.random()*16)});
    } else if(kind==='winter'){
      const n = Math.round(Math.min(70, W*H/26000));
      for(let i=0;i<n;i++) stars.push({x:Math.random()*W, y:Math.pow(Math.random(), 1.4)*H*0.5, r:0.6 + Math.random()*1.3, ph:Math.random()*TAU, sp:0.8 + Math.random()*2.2});
    }
  }
  function gull(x, y, s, flap, col, lw){
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const wy = flap*s*0.45;
    ctx.beginPath(); ctx.moveTo(x - s, y + wy); ctx.quadraticCurveTo(x - s*0.45, y - s*0.42 + wy*0.3, x, y); ctx.quadraticCurveTo(x + s*0.45, y - s*0.42 + wy*0.3, x + s, y + wy); ctx.stroke();
  }
  function drawCritters(ts, dt){
    if(kind==='spring'){
      for(const b of critters){
        b.a += (Math.sin(ts*0.7 + b.ph)*1.6)*dt;
        b.x += Math.cos(b.a)*b.v*dt; b.y += Math.sin(b.a)*b.v*dt*0.7 + Math.sin(ts*3 + b.ph)*10*dt;
        if(b.x < -30) b.x = W + 20; else if(b.x > W + 30) b.x = -20;
        if(b.y < H*0.12) b.a = Math.abs(b.a); else if(b.y > H*0.92) b.a = -Math.abs(b.a);
        const w = Math.max(0.18, Math.abs(Math.sin(ts*11 + b.ph))), d = b.s*2.6;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.cos(b.a)*0.3); ctx.scale(w, 1);
        ctx.globalAlpha = 0.92;
        ctx.drawImage(flySprite(b.c), -d/2, -d/2, d, d);
        ctx.restore();
      }
    } else if(kind==='summer'){
      ctx.globalAlpha = 0.75;
      for(const g of critters){
        g.x += g.v*dt; g.y += Math.sin(ts*0.9 + g.ph)*6*dt;
        if(g.x < -40) g.x = W + 30; else if(g.x > W + 40) g.x = -30;
        gull(g.x, g.y, g.s, Math.sin(ts*2.4 + g.ph)*0.6, '#2F4E60', 2);
      }
      ctx.globalAlpha = 1;
    } else if(kind==='autumn'){
      if(!critters.length && ts > nextFlock){
        const dir = Math.random() < 0.5 ? 1 : -1, y0 = H*(0.1 + Math.random()*0.22), n = 5 + Math.floor(Math.random()*4);
        for(let i=0;i<n;i++){ const k = Math.ceil(i/2)*(i % 2 ? 1 : -1); critters.push({x:(dir > 0 ? -60 : W + 60) - dir*Math.abs(k)*26, y:y0 + Math.abs(k)*14 + k*2, v:dir*(60 + Math.random()*4), ph:Math.random()*TAU, s:7 + Math.random()*2}); }
      }
      ctx.globalAlpha = 0.8;
      for(const b of critters){ b.x += b.v*dt; gull(b.x, b.y + Math.sin(ts*2 + b.ph)*2, b.s, Math.sin(ts*9 + b.ph), '#4A1F2A', 1.8); }
      ctx.globalAlpha = 1;
      if(critters.length && critters.every(b=>b.x < -120 || b.x > W + 120)){ critters = []; nextFlock = ts + 9 + Math.random()*8; }
    } else if(kind==='winter'){
      ctx.fillStyle = '#FFFFFF';
      for(const st of stars){
        ctx.globalAlpha = 0.25 + 0.6*(0.5 + 0.5*Math.sin(ts*st.sp + st.ph));
        ctx.fillRect(st.x - st.r, st.y - st.r, st.r*2, st.r*2);
      }
      if(!shoot && ts > nextShoot){
        const dir = Math.random() < 0.5 ? 1 : -1;
        shoot = {x:W*(0.15 + Math.random()*0.7), y:H*(0.04 + Math.random()*0.25), vx:dir*620, vy:300, life:0};
      }
      if(shoot){
        shoot.life += dt; shoot.x += shoot.vx*dt; shoot.y += shoot.vy*dt;
        const k = 1 - shoot.life/0.9, len = 0.22;
        if(k <= 0){ shoot = null; nextShoot = ts + 5 + Math.random()*7; }
        else {
          const tx = shoot.x - shoot.vx*len, ty = shoot.y - shoot.vy*len;
          const gr = ctx.createLinearGradient(shoot.x, shoot.y, tx, ty);
          gr.addColorStop(0, 'rgba(255,255,255,'+(0.95*k).toFixed(2)+')'); gr.addColorStop(1, 'rgba(180,210,255,0)');
          ctx.globalAlpha = 1; ctx.strokeStyle = gr; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(tx, ty); ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }
  }
  function fill(){
    makeCritters();
    const per = {spring:22000, summer:42000, autumn:26000, winter:12000}[kind] || 30000;
    const n = Math.round(Math.min(140, Math.max(28, W*H/per)));
    parts = [];
    for(let i=0;i<n;i++) parts.push(spawn({}, true));
  }
  function frame(){
    if(!running) return;
    RAF(frame);
    skip = !skip;
    if(skip) return;                               /* 초당 30장이면 충분하다 */
    const t = nowMs();
    let dt = (t - last)/1000; last = t;
    if(dt > 0.1) dt = 0.1;
    if(document.hidden || !kind) return;
    ctx.clearRect(0, 0, W, H);
    const ts = t/1000;
    for(const p of parts){
      const sway = Math.sin(ts*0.8 + p.ph);
      let flip = 1, alpha = 1;
      if(kind==='spring'){ p.y += 38*p.v*dt; p.x += (22 + sway*30)*dt; p.r += p.vr*dt; flip = Math.cos(ts*1.6 + p.ph); }
      else if(kind==='summer'){ p.y -= 10*p.v*dt; p.x += sway*12*dt; alpha = p.a * (0.65 + 0.35*Math.sin(ts*1.1 + p.ph)); }
      else if(kind==='autumn'){ p.y += 58*p.v*dt; p.x += (sway*48 - 14)*dt; p.r += p.vr*1.5*dt; flip = Math.cos(ts*2.2 + p.ph); }
      else { p.y += (p.img===SPR.flake ? 34 : 46)*p.v*dt; p.x += sway*18*dt; p.r += p.vr*0.4*dt; }
      if(p.y > H + 60 || p.y < -60) spawn(p, false);
      if(p.x > W + 60) p.x = -60; else if(p.x < -60) p.x = W + 60;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.scale(Math.max(0.15, Math.abs(flip)), 1);
      ctx.drawImage(p.img, -p.s/2, -p.s/2, p.s, p.s);
      ctx.restore();
    }
    drawCritters(ts, dt);
  }
  return {
    start(){
      if(REDUCED || running) return;
      cv = $('ambient');
      if(!cv || !cv.getContext) return;
      ctx = cv.getContext('2d');
      if(!ctx) return;
      makeSprites();
      size();
      window.addEventListener('resize', ()=>{ size(); fill(); });
      running = true; last = nowMs();
      if(kind) fill();
      RAF(frame);
    },
    set(k){ kind = k; if(running) fill(); }
  };
})();

/* ================= 게임 모드 =================
   모노폴리 공식 규칙의 '시간제한 게임'(정한 시각에 가장 부유한 사람이 승리)과
   '짧은 게임'(시작할 때 땅을 나눠 주고 시작)을 따랐다. 자산은 그 규칙처럼 현금 + 땅값 + 건설비로 센다. */
const MODES = {
  blitz:    {n:'번개전', sub:'약 2분',  limit:120, final:30,  deal:3, toll:2, seasonEvery:1, stepMs:95,  aiDelay:330, autoEnd:true,  shot:12,
             d:'도시 3곳을 받고 시작합니다. 통행료는 2배, 턴은 자동으로 넘어가며 12초 안에 결정해야 합니다. 2분이 지나면 그 라운드까지 하고 총자산 1위가 이깁니다.'},
  standard: {n:'표준전', sub:'약 10분', limit:600, final:120, deal:0, toll:1, seasonEvery:2, stepMs:140, aiDelay:520, autoEnd:false, shot:0,
             d:'10분이 지나면 그 라운드까지 하고 총자산 1위가 이깁니다. 마지막 2분은 통행료가 1.5배로 오릅니다.'},
  classic:  {n:'무제한', sub:'파산전',  limit:0,   final:0,   deal:0, toll:1, seasonEvery:3, stepMs:170, aiDelay:700, autoEnd:false, shot:0,
             d:'시간 제한 없이 마지막 한 명이 남을 때까지 겨룹니다. 해가 바뀔 때마다 물가가 올라 판이 끝없이 늘어지지 않습니다.'}
};
let MODE = MODES.standard;

/* ================= 계절 =================
   몇 라운드마다 계절이 바뀌며 규칙 하나가 달라지고, 배경과 축제 도시도 함께 바뀐다. */
const SEASONS = [
  {k:'spring', n:'봄',   ic:'sprout', t:'개발의 계절', d:'건설비 20% 할인', c:'#58A86F'},
  {k:'summer', n:'여름', ic:'sun',    t:'여행 성수기', d:'모든 통행료 +25%', c:'#3F9CC0'},
  {k:'autumn', n:'가을', ic:'leaf',   t:'결실의 계절', d:'월급 1.5배', c:'#D07A35'},
  {k:'winter', n:'겨울', ic:'snow',   t:'부동산 세일', d:'빈 땅 20% 할인', c:'#7C8DB5'}
];
const curSeason = () => SEASONS[G.season || 0];
function buyPrice(sp){
  return (sp.owner===null && curSeason().k==='winter') ? Math.max(1, Math.round(sp.price*0.8)) : sp.price;
}
/* k = 0 별장, 1 빌딩, 2 호텔, 'L' 랜드마크 */
function buildCost(sp, k){
  let c = (k==='L') ? sp.price*2 : sp.bc[k];
  if(curSeason().k==='spring') c *= 0.8;
  const o = sp.owner!==null && sp.owner!==undefined ? G.players[sp.owner] : null;
  if(o && o.underdog && EG.poorBuild !== 1) c *= EG.poorBuild;          /* 최후 2인의 뒤진 쪽 */
  return Math.max(1, Math.round(c));
}
function salaryNow(){ return Math.round(SALARY * (curSeason().k==='autumn' ? 1.5 : 1)); }
/* 해가 바뀔 때마다 통행료가 15%씩 오른다 (최대 2.5배). 오래 끄는 판을 끝내는 장치 */
function inflation(){ return Math.min(2.5, 1 + 0.15*((G.year || 1) - 1)); }

/* 한 지역(색)의 도시를 모두 가진 사람의 번호. 없으면 null */
function groupOwner(g){
  let owner = null, n = 0;
  for(const sp of SP){
    if(sp.type!=='city' || sp.g!==g) continue;
    n++;
    if(sp.owner===null) return null;
    if(owner===null) owner = sp.owner; else if(owner!==sp.owner) return null;
  }
  return n ? owner : null;
}
function monopolies(p){ return Object.keys(GROUPS).filter(g=>g!=='vh' && groupOwner(g)===p.i); }
function vehCount(i){ return SP.filter(sp=>sp.type==='veh' && sp.owner===i).length; }

/* 통행료 배수와 그 이유. 화면 표시와 실제 계산이 같은 값을 쓴다 */
function tollMult(sp){
  const parts = []; let m = 1;
  if(sp.owner!==null){
    if(sp.type==='city' && groupOwner(sp.g)===sp.owner){ m *= 2; parts.push('지역 독점 2배'); }
    if(sp.type==='veh'){ const c = vehCount(sp.owner); if(c > 1){ m *= 1 + 0.5*(c-1); parts.push('교통수단 '+c+'개 '+(1 + 0.5*(c-1))+'배'); } }
  }
  if(G.festival === SP.indexOf(sp)){ m *= 2; parts.push('축제 2배'); }
  if(curSeason().k==='summer'){ m *= 1.25; parts.push('여름 +25%'); }
  const inf = inflation();
  if(inf > 1){ m *= inf; parts.push('물가 +'+Math.round((inf-1)*100)+'%'); }
  if(MODE.toll !== 1){ m *= MODE.toll; parts.push(MODE.n+' '+MODE.toll+'배'); }
  if(G.finalPhase){ m *= 1.5; parts.push('막판 1.5배'); }
  if(m > 6){ m = 6; parts.push('상한 6배'); }
  return {m:m, parts:parts};
}
function baseToll(sp){ return sp.type==='veh' ? sp.toll : tollAtLevel(sp, bldLevel(sp)); }
function calcToll(sp){ return Math.max(1, Math.round(baseToll(sp) * tollMult(sp).m)); }
/* 건물 단계가 lv 일 때의 통행료 (건설 미리보기용) */
function tollAtNow(sp, lv){ return Math.max(1, Math.round(tollAtLevel(sp, lv) * tollMult(sp).m)); }
function tollNote(sp){
  const t = tollMult(sp);
  return t.parts.length ? '<p class="hint">지금 적용 중: '+t.parts.join(', ')+'</p>' : '';
}

/* 독점 현황을 다시 계산한다. 새로 생긴 독점은 알리고, 세 지역을 독점한 사람이 있으면 즉시 승리 */
function syncMonopolies(announce){
  const now = {};
  Object.keys(GROUPS).forEach(g=>{ if(g==='vh') return; const o = groupOwner(g); if(o!==null) now[g] = o; });
  const prev = G.mono || {};
  G.mono = now;
  renderCells();
  if(G.over || !G.players.length) return;
  if(announce){
    Object.keys(now).forEach(g=>{
      if(prev[g] === now[g]) return;
      const p = G.players[now[g]];
      markEvent('mono', p, p.name+', '+GROUPS[g].n+' 독점');
      fxMonoWave(g, GROUPS[g].c);
      sfx('special');
      log('🏆 <b>'+esc(p.name)+'</b>이(가) <b>'+GROUPS[g].n+'</b> 지역을 독점했습니다! 이 지역 통행료가 2배가 됩니다.', 'big');
      showBanner(GROUPS[g].n+' 독점', esc(p.name)+' · 통행료 2배', GROUPS[g].c);
    });
  }
  for(const p of alivePlayers()){
    if(monopolies(p).length >= 3){ endGame('triple', p); return; }
  }
}

/* --- 계절과 축제 --- */
function pickFestival(){
  const cities = [];
  SP.forEach((sp,i)=>{ if(sp.type==='city' && i!==G.festival) cities.push(i); });
  G.festival = cities[Math.floor(Math.random()*cities.length)];
}
function applySeason(announce){
  const sn = curSeason();
  document.body.dataset.season = sn.k;
  Ambient.set(sn.k);
  renderHud(); renderCells();
  if(!announce) return;
  sfx('season');
  fxSeasonSweep(sn.k);
  log(icon(sn.ic)+'<b>'+sn.n+'</b>이 왔습니다. '+sn.t+': '+sn.d+'. 이번 축제 도시는 <b>'+SP[G.festival].name+'</b> (통행료 2배)', 'big');
  showBanner(sn.n+' · '+sn.t, sn.d+' · 축제 '+SP[G.festival].name, sn.c);
}
function advanceSeason(){
  G.season = ((G.season || 0) + 1) % 4;
  const newYear = G.season === 0;
  if(newYear) G.year++;
  pickFestival();
  applySeason(true);
  if(newYear && inflation() > 1) log('⏳ '+G.year+'년차가 되어 물가가 올랐습니다. 모든 통행료 +'+Math.round((inflation()-1)*100)+'%');
}
/* 경기 기록: 라운드가 끝날 때마다 모두의 총자산을 적어 둔다 (종료 통계와 그래프에 쓴다) */
function recordRound(){
  G.hist = G.hist || [];
  G.hist.push(G.players.map(p=>p.alive ? assets(p) : 0));
  (G.histCash = G.histCash || []).push(G.players.map(p=>p.alive ? Math.max(0, p.cash) : 0));
  (G.histSeason = G.histSeason || []).push(G.season || 0);
  G.players.forEach(p=>{ if(p.alive) p.stat.peak = Math.max(p.stat.peak || 0, assets(p)); });
  /* 1위가 바뀐 횟수 */
  const al = alivePlayers();
  if(al.length > 1){
    const top = al.slice().sort((a,b)=>assets(b)-assets(a))[0];
    if(G.topNow !== undefined && G.topNow !== top.i) G.leadChanges = (G.leadChanges || 0) + 1;
    G.topNow = top.i;
    top.stat.roundsLed = (top.stat.roundsLed || 0) + 1;
  }
}
/* 돈이 어디서 들어오고 어디로 나갔는지 (종료 통계의 수입, 지출 그래프)
   salary 월급 / toll 통행료 / prop 부동산 (사고 짓고 인수한 돈, 판 돈) / luck 황금열쇠, 미니게임, 기금, 세금 / gift 송금, 축하금, 기부 */
const LEDGER_CATS = ['salary','toll','prop','luck','gift'];
function ledgerOf(i){
  G.ledger = G.ledger || [];
  if(!G.ledger[i]){
    const z = ()=>({salary:0, toll:0, prop:0, luck:0, gift:0});
    G.ledger[i] = {in:z(), out:z()};
  }
  return G.ledger[i];
}
function book(p, dir, cat, amt){
  if(!p || typeof p !== 'object' || !(amt > 0)) return;
  const L = ledgerOf(p.i);
  L[dir][cat] = (L[dir][cat] || 0) + amt;
}
function payCat(dest, why){
  if(dest==='bank' || dest==='fund') return 'luck';
  return /통행료|이용료/.test(String(why || '')) ? 'toll' : 'gift';
}
function tollMat(from, to, amt){
  G.tollMatrix = G.tollMatrix || [];
  const row = G.tollMatrix[from.i] = G.tollMatrix[from.i] || [];
  row[to.i] = (row[to.i] || 0) + amt;
}
/* 경기 중 큰 사건 (그래프 위 표시와 라운드별 설명에 쓴다). r: 몇 번째 라운드에 일어났는지 (0부터) */
function markEvent(t, p, txt){
  (G.events = G.events || []).push({r:(G.hist || []).length, t:t, p:(p && typeof p === 'object') ? p.i : -1, txt:txt, turn:G.turnNo});
}
function nextRound(){
  recordRound();
  G.round++;
  if(G.eg && !MODE.limit && EG.maxRounds){
    const left = G.eg.round + EG.maxRounds - G.round;
    if(left <= 0){ endGame('decision'); return; }
    if(left === 3) showBanner('결전 3라운드 남음', '끝나지 않으면 총자산으로 판정합니다', '#FFD27A');
    renderClock();
  }
  if((G.round - 1) % MODE.seasonEvery === 0) advanceSeason();
}

/* --- 시계 --- */
let clockT = null;
function fmtClock(ms){ const t = Math.ceil(ms/1000); return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); }
function stopClock(){ if(clockT){ clearInterval(clockT); clockT = null; } }
function startClock(){
  stopClock();
  if(!MODE.limit) return;
  let last = nowMs();
  clockT = setInterval(()=>{
    const t = nowMs(), dt = Math.min(1000, t - last); last = t;
    if(G.over || G.timeUp || G.hold > 0 || infoOpen() || document.hidden) return;   /* 미니게임 중이거나, 규칙을 읽거나, 화면을 떠난 동안은 멈춘다 */
    G.timeLeft = Math.max(0, G.timeLeft - dt);
    if(!G.finalPhase && MODE.final && G.timeLeft <= MODE.final*1000) enterFinal();
    if(G.timeLeft <= 0) timeUp();
    renderClock();
  }, 200);
}
function enterFinal(){
  if(G.finalPhase) return;
  G.finalPhase = true;
  document.body.classList.add('final');
  sfx('alarm');
  log('⏳ 막판 스퍼트! 남은 시간 동안 모든 통행료가 1.5배가 됩니다.', 'big');
  showBanner('막판 스퍼트', '통행료 1.5배', '#E5533D');
}
function timeUp(){
  if(G.timeUp) return;
  G.timeUp = true; G.timeLeft = 0;
  sfx('alarm');
  log('⏳ 시간 종료! 이번 라운드가 끝나면 총자산 순위로 승부를 가립니다.', 'big');
  showBanner('시간 종료', '이번 라운드까지 진행합니다', '#F1EFEA');
  renderClock();
}

/* --- 승부 --- */
function standings(){
  const al = alivePlayers().slice().sort((a,b)=>assets(b)-assets(a) || b.cash-a.cash);
  const dead = G.players.filter(p=>!p.alive).sort((a,b)=>(b.outAt||0)-(a.outAt||0));
  return al.concat(dead);
}
/* reason: 'time' 시간 종료 / 'triple' 세 지역 독점 / 'last' 마지막 생존 */
function endGame(reason, winner){
  if(G.over) return;
  recordRound();
  G.over = true;
  G.endReason = reason;
  stopAuto(); stopClock(); shotStop(); disarmFlick();
  if(autoEndT){ clearTimeout(autoEndT); autoEndT = null; }
  let order = standings();
  if(winner) order = [winner].concat(order.filter(p=>p!==winner));
  const w = order[0];
  setActions([]);
  renderAll();
  sfx('win');
  fxWin(w.color);
  const why = reason==='time' ? '시간이 끝났습니다. 총자산이 가장 많은 <b>'+esc(w.name)+'</b>이(가) 이겼습니다.'
    : reason==='triple' ? '<b>'+esc(w.name)+'</b>이(가) 세 지역을 독점해 그 자리에서 이겼습니다.'
    : reason==='decision' ? '최후 2인 결전이 '+EG.maxRounds+'라운드 안에 끝나지 않아, 총자산이 많은 <b>'+esc(w.name)+'</b>이(가) 판정승했습니다.'
    : '<b>'+esc(w.name)+'</b>이(가) 마지막까지 살아남았습니다.';
  log('🏆 '+why, 'big');
  const rows = order.map((p,i)=>
    '<div class="rk-row'+(i===0?' first':'')+(p.alive?'':' out')+'">' +
      '<span class="rk-no">'+(i+1)+'</span>' +
      '<span class="pdot" style="background:'+p.color+'">'+PIECES[p.piece].ic+'</span>' +
      '<span class="rk-main"><b>'+esc(p.name)+'</b><i>'+(p.alive ? '현금 '+fmt(p.cash)+'원 · 부동산 '+ownedProps(p).length+'곳 · 받은 통행료 '+fmt(p.stat.tollIn)+'원' : '파산 ('+p.outAt+'턴)')+'</i></span>' +
      '<span class="rk-amt">'+(p.alive ? fmt(assets(p))+'원' : '탈락')+'</span>' +
    '</div>').join('');
  G.result = {title:'🏆 '+esc(w.name)+' 승리', color:w.color, body:'<p>'+why+'</p><div class="rk-list">'+rows+'</div>' + matchReport(order)};
  showResult();
}
function showResult(){
  const r = G.result;
  if(!r) return;
  modal(r.title, r.body, [
    {l:'보드 보기', cls:'ghost', fn:()=>setActions([{l:'🏆 결과 다시 보기', cls:'primary', fn:showResult}, {l:'새 게임', cls:'ghost', fn:newGame}])},
    {l:'새 게임', cls:'primary', fn:newGame}
  ], r.color);
  $('mBox').classList.add('wide');
  initReport();
}
/* ---------- 경기 통계 ----------
   결과 창 아래의 탭 네 개.
   흐름: 라운드별 총자산, 현금, 순위 그래프. 마우스, 손가락, 방향키로 라운드를 짚으면 모든 참가자의 값과 그 라운드의 사건이 뜬다.
   돈: 들어온 돈과 나간 돈의 내역, 누가 누구에게 통행료를 냈는지.
   도시: 통행료를 가장 많이 번 도시, 마지막 땅 주인 지도.
   기록: 참가자 기록표와 하이라이트. */
const CATS = [
  {k:'salary', n:'월급',   c:'#2a78d6', d:'출발지 월급과 보너스'},
  {k:'toll',   n:'통행료', c:'#eb6834', d:'통행료, 우주여행 이용료'},
  {k:'prop',   n:'부동산', c:'#1baf7a', d:'땅, 건물, 인수에 쓴 돈과 팔아서 받은 돈'},
  {k:'luck',   n:'이벤트', c:'#eda100', d:'황금열쇠, 미니게임, 복권, 기금, 세금'},
  {k:'gift',   n:'송금',   c:'#e87ba4', d:'송금, 생일 축하금, 기부'}
];
const EV_IC = {eg:'versus', bankrupt:'chartdown', mono:'trophy', landmark:'star', lotto:'ticket', takeover:'swap'};
const EV_N = {eg:'최후 2인', bankrupt:'파산', mono:'독점', landmark:'랜드마크', lotto:'복권 대박', takeover:'인수'};
const EV_MARK = ['eg', 'bankrupt', 'mono', 'landmark', 'lotto'];   /* 그래프 위에 표시하는 사건 (인수는 잦아서 라운드 설명에만 넣는다) */
const SEASON_TINT = ['#BFE0C6', '#BCDDEB', '#F1CFAE', '#CDD5E8'];
const HEAT = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];
const METRIC_N = {assets:'총자산', cash:'현금', rank:'순위'};

function matchReport(order){
  const P = G.players;
  const keep = [];
  (G.hist || []).forEach((row, i)=>{ if(row.some(v=>v > 0)) keep.push(i); });
  const at = (r)=>{ for(let k=0;k<keep.length;k++) if(keep[k] >= r) return k; return Math.max(0, keep.length - 1); };
  const R = G.report = {
    order: order.map(p=>p.i),
    H: keep.map(i=>G.hist[i]),
    C: keep.map(i=>(G.histCash || [])[i] || P.map(()=>0)),
    S: keep.map(i=>(G.histSeason || [])[i] || 0),
    ev: (G.events || []).map(e=>({t:e.t, p:e.p, txt:e.txt, x:at(e.r)})),
    metric:'assets', hidden:{}, tab:'flow', table:false, idx:-1, geo:null
  };
  const tabs = [['flow','흐름'], ['money','돈'], ['city','도시'], ['rec','기록']];
  return '<p class="hint">'+MODE.n+'</p>' +
    '<div class="st-root">' +
      '<div class="st-tabs" role="tablist" aria-label="경기 통계">' +
        tabs.map(([k, n], i)=>'<button type="button" role="tab" class="st-tab" data-tab="'+k+'" aria-selected="'+(i===0)+'" tabindex="'+(i===0 ? 0 : -1)+'">'+n+'</button>').join('') +
      '</div>' +
      '<div class="st-pane" data-pane="flow" role="tabpanel">'+flowPane(R)+'</div>' +
      '<div class="st-pane hidden" data-pane="money" role="tabpanel">'+moneyPane(order)+'</div>' +
      '<div class="st-pane hidden" data-pane="city" role="tabpanel">'+cityPane(order)+'</div>' +
      '<div class="st-pane hidden" data-pane="rec" role="tabpanel">'+recPane(order, R)+'</div>' +
      '<div class="st-tip hidden" aria-live="polite"></div>' +
    '</div>';
}

/* --- 흐름 --- */
function flowPane(R){
  const P = G.players;
  const seg = Object.keys(METRIC_N).map(k=>'<button type="button" data-metric="'+k+'" aria-pressed="'+(R.metric===k)+'">'+METRIC_N[k]+'</button>').join('');
  const keys = R.order.map(i=>'<button type="button" class="st-key" data-pl="'+i+'" aria-pressed="true" title="눌러서 이 선을 숨기거나 보이기"><i style="background:'+P[i].color+'"></i>'+esc(P[i].name)+'</button>').join('');
  const evKinds = EV_MARK.filter(t=>R.ev.some(e=>e.t===t));

  const seasons = SEASONS.map((s, i)=>used[i] ? '<span><i class="st-sea" style="background:'+SEASON_TINT[i]+'"></i>'+s.n+'</span>' : '').join('');

  if(led && (led.stat.roundsLed || 0) > 0) cap += ' 가장 오래 1위를 지킨 사람은 <b>'+esc(led.name)+'</b>('+led.stat.roundsLed+'라운드)입니다.';
  const tk = R.ev.filter(e=>e.t==='takeover').length;
  if(tk) cap += ' 인수는 모두 '+tk+'번 있었습니다.';
  return '<div class="st-ctl"><div class="st-seg" role="group" aria-label="그래프 지표">'+seg+'</div>' +
      '<button type="button" class="st-tbtn" data-act="table" aria-pressed="false">표로 보기</button></div>' +
    '<div class="st-keys">'+keys+'</div>' +
    (extra ? '<div class="st-evks">'+extra+'</div>' : '') +
    '<div class="st-flow" tabindex="0" role="img" aria-label="라운드별 그래프. 왼쪽, 오른쪽 방향키로 라운드를 옮기면 값이 나옵니다."></div>' +
    '<div class="st-ftable hidden"></div>' +
    '<p class="st-cap">'+cap+' <span class="hint">그래프 위를 짚거나 방향키를 누르면 그 라운드의 값과 사건이 나옵니다.</span></p>';
}
function flowVals(R, metric){
  const P = G.players, n = R.H.length;
  return P.map(p=>{
    const out = new Array(n).fill(null);
    for(let i=0;i<n;i++){
      const a = R.H[i][p.i], alive = a > 0;
      if(metric==='rank'){
        if(alive){ let r = 1; P.forEach(o=>{ if(o!==p && R.H[i][o.i] > a) r++; }); out[i] = r; }
      } else if(alive) out[i] = metric==='cash' ? R.C[i][p.i] : a;
      else if(i > 0 && R.H[i-1][p.i] > 0) out[i] = 0;          /* 파산한 라운드까지만 0으로 떨어뜨리고 선을 끊는다 */
    }
    return out;
  });
}
function niceStep(max, count){
  const raw = max/count, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}
function drawFlow(root){
  const R = G.report, host = root.querySelector('.st-flow'), tbl = root.querySelector('.st-ftable');
  if(!R || !host) return;
  const P = G.players, n = R.H.length, metric = R.metric;
  if(tbl){
    tbl.classList.toggle('hidden', !R.table);
    host.classList.toggle('hidden', R.table);
    if(R.table){ tbl.innerHTML = flowTable(R); hideTip(root); return; }
  }
  if(n < 1){ host.innerHTML = '<p class="hint" style="padding:12px">기록된 라운드가 없습니다.</p>'; R.geo = null; return; }
  const W = Math.max(280, Math.round(host.clientWidth || 640)), Ht = W < 440 ? 220 : 260;
  const lab = W >= 440;                                  /* 넓으면 선 끝에 이름을 붙인다 */
  const x0 = metric==='rank' ? 36 : 58, x1 = W - (lab ? 94 : 16), y0 = 30, y1 = Ht - 40;
  const V = flowVals(R, metric);
  let ticks = [], Y;
  if(metric==='rank'){
    const N = Math.max(2, P.length);
    Y = (v)=>y0 + (v-1)/(N-1)*(y1-y0);
    for(let r=1;r<=N;r++) ticks.push({y:Y(r), t:r+'위'});
  } else {
    let mx = 0;
    V.forEach((s, k)=>{ if(R.hidden[k]) return; s.forEach(v=>{ if(v !== null && v > mx) mx = v; }); });
    const st = niceStep(Math.max(4, mx), 4), top = Math.max(st, Math.ceil(mx/st)*st);
    Y = (v)=>y1 - v/top*(y1-y0);
    for(let t=0;t<=top+1e-9;t+=st) ticks.push({y:Y(t), t:t ? fmt(t) : '0', base:t===0});
  }
  const X = (i)=>n > 1 ? x0 + i/(n-1)*(x1-x0) : (x0+x1)/2;
  const f1 = (v)=>(+v).toFixed(1);
  R.geo = {W:W, Ht:Ht, x0:x0, x1:x1, y0:y0, y1:y1, n:n, X:X, Y:Y, V:V};
  let s = '';
  /* 눈금선과 세로축 값 */
  s += '<g class="grid">' + ticks.map(t=>'<line class="g'+(t.base ? ' base' : '')+'" x1="'+x0+'" x2="'+x1+'" y1="'+f1(t.y)+'" y2="'+f1(t.y)+'"/><text class="yl" x="'+(x0-8)+'" y="'+f1(t.y+4)+'">'+t.t+'</text>').join('') + '</g>';
  /* 계절 띠 */
  const half = n > 1 ? (x1-x0)/(n-1)/2 : (x1-x0)/2;
  let band = '';
  for(let i=0;i<n;){
    let j = i; while(j+1 < n && R.S[j+1]===R.S[i]) j++;
    const a = Math.max(x0, X(i)-half), b = Math.min(x1, X(j)+half);
    band += '<rect x="'+f1(a)+'" y="'+(y1+7)+'" width="'+f1(Math.max(1, b-a-(j+1<n ? 1 : 0)))+'" height="5" fill="'+SEASON_TINT[R.S[i]]+'"/>';
    i = j + 1;
  }
  s += '<g class="sea">'+band+'</g>';
  /* 가로축: 라운드 */
  const steps = [1, 2, 5, 10, 20, 25, 50, 100], maxLab = Math.max(2, Math.floor((x1-x0)/44));
  const xs = steps.find(k=>Math.ceil(n/k) <= maxLab) || 100;
  let xl = '<text class="xt" x="'+(x0-8)+'" y="'+(y1+29)+'">라운드</text>';
  for(let i=0;i<n;i++){
    const r = i + 1;
    if(r===1 || r % xs===0) xl += '<text class="xl" x="'+f1(X(i))+'" y="'+(y1+29)+'">'+r+'</text>';
  }
  s += '<g>'+xl+'</g>';
  /* 사건 표시 (같은 자리에 겹치면 중요한 것만) */
  const evs = R.ev.filter(e=>EV_MARK.indexOf(e.t) >= 0).sort((a,b)=>EV_MARK.indexOf(a.t) - EV_MARK.indexOf(b.t));
  const drawn = [];
  let em = '';
  evs.forEach(e=>{
    const x = X(e.x);
    if(drawn.some(d=>Math.abs(d - x) < 17)) return;
    drawn.push(x);
    const who = e.p >= 0 ? P[e.p].color : 'var(--ink)';
    em += '<line class="evl" x1="'+f1(x)+'" x2="'+f1(x)+'" y1="'+(y0-6)+'" y2="'+y1+'"/>' +
      '<g class="evm" transform="translate('+f1(x)+','+(y0-15)+')"><circle r="9" style="stroke:'+who+'"/>' +
      '<svg class="ic" x="-6" y="-6" width="12" height="12" viewBox="0 0 24 24">'+ICONS[EV_IC[e.t]]+'</svg></g>';
  });
  s += '<g>'+em+'</g>';
  /* 선 */
  let lines = '', ends = [];
  P.forEach((p, k)=>{
    if(R.hidden[k]) return;
    let d = '', pen = false, last = -1;
    V[k].forEach((v, i)=>{
      if(v === null){ pen = false; return; }
      d += (pen ? 'L' : 'M') + f1(X(i)) + ' ' + f1(Y(v)) + ' ';
      pen = true; last = i;
    });
    if(last < 0) return;
    if(n===1) d += 'L' + f1(X(0)+0.1) + ' ' + f1(Y(V[k][0]));
    lines += '<path class="ln" d="'+d+'" style="stroke:'+p.color+'"/>';
    ends.push({k:k, i:last, y:Y(V[k][last]), full:last===n-1});
  });
  s += '<g>'+lines+'</g>';
  s += '<g>'+ends.map(e=>'<circle class="dot" cx="'+f1(X(e.i))+'" cy="'+f1(e.y)+'" r="4" style="fill:'+P[e.k].color+'"/>').join('')+'</g>';
  /* 선 끝 이름표 (겹치지 않게 위아래로 민다) */
  if(lab){
    const tags = ends.filter(e=>e.full).sort((a,b)=>a.y - b.y).map(e=>({k:e.k, y:e.y, ly:e.y}));
    for(let q=1;q<tags.length;q++) tags[q].ly = Math.max(tags[q].ly, tags[q-1].ly + 14);
    const over = tags.length ? tags[tags.length-1].ly - (y1 + 4) : 0;
    if(over > 0) tags.forEach(t=>{ t.ly -= over; });
    for(let q=tags.length-2;q>=0;q--) tags[q].ly = Math.min(tags[q].ly, tags[q+1].ly - 14);
    s += '<g>'+tags.map(t=>{
      const nm = P[t.k].name.length > 9 ? P[t.k].name.slice(0, 8)+'…' : P[t.k].name;
      return '<line class="tagk" x1="'+(x1+6)+'" x2="'+(x1+14)+'" y1="'+f1(t.ly)+'" y2="'+f1(t.ly)+'" style="stroke:'+P[t.k].color+'"/>' +
        '<text class="dl" x="'+(x1+18)+'" y="'+f1(t.ly+4)+'">'+esc(nm)+'</text>';
    }).join('')+'</g>';
  }
  s += '<g class="xh"></g>';
  host.innerHTML = '<svg viewBox="0 0 '+W+' '+Ht+'" width="'+W+'" height="'+Ht+'" aria-hidden="true">'+s+'</svg>';
  flowCross(root);
}
function flowCross(root){
  const R = G.report, g = R && R.geo, host = root.querySelector('.st-flow');
  if(!g || !host) return;
  const layer = host.querySelector('.xh');
  if(!layer) return;
  const i = R.idx;
  if(i < 0 || i >= g.n || R.table){ layer.innerHTML = ''; hideTip(root); return; }
  const P = G.players, x = g.X(i);
  let s = '<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(g.y0-4)+'" y2="'+g.y1+'"/>';
  const rows = [];
  P.forEach((p, k)=>{
    if(R.hidden[k]) return;
    const v = g.V[k][i];
    if(v === null) return;
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+g.Y(v).toFixed(1)+'" r="4.5" style="fill:'+p.color+'"/>';
    rows.push({c:p.color, line:true, v:R.metric==='rank' ? v+'위' : fmt(v)+'원', l:p.name + (v===0 && R.metric!=='rank' ? ' (파산)' : ''), o:R.metric==='rank' ? -v : v});
  });
  layer.innerHTML = s;
  rows.sort((a,b)=>b.o - a.o);
  const evs = R.ev.filter(e=>e.x===i);
  const notes = evs.slice(0, 5).map(e=>EV_N[e.t]+': '+josa(e.txt));
  if(evs.length > 5) notes.push('그 밖에 '+(evs.length-5)+'건');
  const tip = root.querySelector('.st-tip');
  if(!tip) return;
  renderTip(tip, {title:(i+1)+'라운드 · '+SEASONS[R.S[i] || 0].n+' · '+METRIC_N[R.metric], rows:rows, notes:notes});
  const svg = host.querySelector('svg');
  const rr = root.getBoundingClientRect(), sr = svg.getBoundingClientRect();
  const sc = sr.width ? sr.width/g.W : 1;
  const px = sr.left - rr.left + x*sc, py = sr.top - rr.top + g.y0*sc;
  tip.classList.remove('hidden');
  const rw = root.clientWidth || g.W;
  /* 좁은 화면에서는 그래프를 가리지 않게 그래프 바로 아래에 띄운다 */
  const under = rw < 480;
  tip.classList.toggle('under', under);
  if(under){ tip.style.left = '0px'; tip.style.top = (sr.bottom - rr.top + 6)+'px'; return; }
  const tw = tip.offsetWidth || 200;
  let left = px + 16;
  if(left + tw > rw) left = px - 16 - tw;
  tip.style.left = Math.max(0, left)+'px';
  tip.style.top = Math.max(0, py)+'px';
}
function flowTable(R){

  const legend = '<div class="st-legend sq">'+CATS.map(c=>'<span title="'+c.d+'"><i style="background:'+c.c+'"></i>'+c.n+'</span>').join('')+'</div>';

function tollMatrixHTML(order){

  hl.push(['진행', G.turnNo+'턴 · '+Math.max(1, R.H.length)+'라운드 · '+G.year+'년차 '+curSeason().n]);
  hl.push(['1위 교체', (G.leadChanges || 0)+'번']);
  if(G.biggest) hl.push(['최고 통행료', fmt(G.biggest.amt)+'원 · '+esc(P[G.biggest.to].name)+' ← '+esc(P[G.biggest.from].name)+' ('+G.biggest.city+', '+G.biggest.turn+'턴)']);
  const T = G.cityToll || {}, best = Object.keys(T).map(Number).sort((a,b)=>T[b] - T[a])[0];
  if(best !== undefined && T[best] > 0) hl.push(['효자 도시', SP[best].name+' · 통행료 '+fmt(T[best])+'원 ('+((G.cityHits || {})[best] || 0)+'번)']);
  const L = (i)=>(G.ledger || [])[i] || {in:{}, out:{}};
  const spender = P.slice().sort((a,b)=>(L(b.i).out.prop || 0) - (L(a.i).out.prop || 0))[0];
  if(spender && (L(spender.i).out.prop || 0) > 0) hl.push(['큰손', esc(spender.name)+' · 땅, 건물, 인수에 '+fmt(L(spender.i).out.prop)+'원']);
  const lucky = P.slice().sort((a,b)=>(L(b.i).in.luck || 0) - (L(a.i).in.luck || 0))[0];
  if(lucky && (L(lucky.i).in.luck || 0) > 0) hl.push(['행운아', esc(lucky.name)+' · 황금열쇠, 미니게임, 기금으로 '+fmt(L(lucky.i).in.luck)+'원']);
  const tk = R.ev.filter(e=>e.t==='takeover').length;
  if(tk) hl.push(['인수', tk+'번']);
  if(G.eg) hl.push(['최후 2인', G.eg.turn+'턴부터 · 시작 격차 '+G.eg.ratio.toFixed(2)+'배 · 역전 '+G.eg.swaps+'번']);
  const out = P.filter(p=>!p.alive).sort((a,b)=>a.outAt-b.outAt);
  if(out.length) hl.push(['파산', out.map(p=>esc(p.name)+' '+p.outAt+'턴').join(', ')]);
  const hlHTML = '<div class="st-sec"><h5>하이라이트</h5><div class="st-hl">'+hl.map(([k,v])=>'<div><span>'+k+'</span><b>'+v+'</b></div>').join('')+'</div></div>';
  return table + hlHTML;
}

/* --- 말풍선 (값은 textContent 로만 넣는다) --- */
function renderTip(tip, d){
  tip.textContent = '';
  if(d.title){ const h = document.createElement('div'); h.className = 'tt-h'; h.textContent = d.title; tip.appendChild(h); }
  (d.rows || []).forEach(r=>{
    const row = document.createElement('div'); row.className = 'tt-r';
    const k = document.createElement('i'); k.className = 'tt-k' + (r.line ? ' ln' : ''); k.style.background = r.c || 'transparent'; row.appendChild(k);
    const v = document.createElement('b'); v.textContent = r.v; row.appendChild(v);
    const l = document.createElement('span'); l.textContent = r.l; row.appendChild(l);
    tip.appendChild(row);
  });
  (d.notes || []).forEach(t=>{ const n = document.createElement('div'); n.className = 'tt-n'; n.textContent = t; tip.appendChild(n); });
}
function hideTip(root){ const t = root && root.querySelector('.st-tip'); if(t) t.classList.add('hidden'); }
function tipAt(root, el, d){
  const tip = root.querySelector('.st-tip');
  if(!tip || !d) return;
  renderTip(tip, d);
  tip.classList.remove('hidden', 'under');
  const rr = root.getBoundingClientRect(), er = el.getBoundingClientRect();
  const tw = tip.offsetWidth || 180, th = tip.offsetHeight || 60, rw = root.clientWidth || 600;
  const cx = er.left - rr.left + er.width/2;
  let top = er.top - rr.top - th - 8;
  if(top < 0) top = er.bottom - rr.top + 8;
  tip.style.left = Math.max(0, Math.min(rw - tw, cx - tw/2))+'px';
  tip.style.top = top+'px';
}

/* --- 결과 창이 열린 뒤에 그래프를 그리고 조작을 붙인다 --- */
function initReport(){
  const body = $('mBody'), root = body && body.querySelector('.st-root'), R = G.report;
  if(!root || !R) return;
  const tabs = [...root.querySelectorAll('.st-tab')];
  const show = (k, focus)=>{
    R.tab = k;
    tabs.forEach(t=>{ const on = t.dataset.tab===k; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; if(on && focus) t.focus(); });
    root.querySelectorAll('.st-pane').forEach(p=>p.classList.toggle('hidden', p.dataset.pane!==k));
    hideTip(root);
    if(k==='flow') drawFlow(root);
  };
  tabs.forEach((t, i)=>{
    t.addEventListener('click', ()=>show(t.dataset.tab));
    t.addEventListener('keydown', (e)=>{
      if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
      e.preventDefault();
      show(tabs[(i + (e.key==='ArrowRight' ? 1 : tabs.length - 1)) % tabs.length].dataset.tab, true);
    });
  });
  root.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click', ()=>{
    R.metric = b.dataset.metric;
    root.querySelectorAll('[data-metric]').forEach(x=>x.setAttribute('aria-pressed', x===b ? 'true' : 'false'));
    drawFlow(root);
  }));
  root.querySelectorAll('[data-pl]').forEach(b=>b.addEventListener('click', ()=>{
    const i = +b.dataset.pl;
    const shown = G.players.filter(p=>!R.hidden[p.i]).length;
    if(!R.hidden[i] && shown <= 1) return;                 /* 선 하나는 남긴다 */
    R.hidden[i] = !R.hidden[i];
    b.setAttribute('aria-pressed', R.hidden[i] ? 'false' : 'true');
    drawFlow(root);
  }));
  const tb = root.querySelector('[data-act="table"]');
  if(tb) tb.addEventListener('click', ()=>{
    R.table = !R.table;
    tb.setAttribute('aria-pressed', R.table ? 'true' : 'false');
    tb.textContent = R.table ? '그래프로 보기' : '표로 보기';
    drawFlow(root);
  });
  const host = root.querySelector('.st-flow');
  if(host){
    const pick = (e)=>{
      const g = R.geo, svg = host.querySelector('svg');
      if(!g || !svg) return;
      const r = svg.getBoundingClientRect();
      if(!r.width) return;
      const x = (e.clientX - r.left) * (g.W / r.width);
      R.idx = g.n > 1 ? Math.round(clamp((x - g.x0)/(g.x1 - g.x0), 0, 1)*(g.n - 1)) : 0;
      flowCross(root);
    };
    host.addEventListener('pointermove', pick);
    host.addEventListener('pointerdown', pick);
    host.addEventListener('pointerleave', (e)=>{ if(e.pointerType==='mouse'){ R.idx = -1; flowCross(root); } });
    host.addEventListener('keydown', (e)=>{
      const n = R.H.length;
      if(!n) return;
      if(e.key==='ArrowRight' || e.key==='ArrowLeft'){ e.preventDefault(); R.idx = R.idx < 0 ? n-1 : clamp(R.idx + (e.key==='ArrowRight' ? 1 : -1), 0, n-1); }
      else if(e.key==='Home'){ e.preventDefault(); R.idx = 0; }
      else if(e.key==='End'){ e.preventDefault(); R.idx = n-1; }
      else if(e.key==='Escape'){ R.idx = -1; }
      else return;
      flowCross(root);
    });
    host.addEventListener('focus', ()=>{ if(R.idx < 0){ R.idx = R.H.length - 1; flowCross(root); } });
    host.addEventListener('blur', ()=>{ R.idx = -1; flowCross(root); });
  }
  /* 손가락으로 누른 경우에는 손을 떼도 말풍선을 남기고, 다른 곳을 누르면 닫는다 */
  const bindTip = (sel, fn)=>root.querySelectorAll(sel).forEach(el=>{
    const on = ()=>tipAt(root, el, fn(el));
    el.addEventListener('pointerenter', on);
    el.addEventListener('pointerdown', on);
    el.addEventListener('focus', on);
    el.addEventListener('pointerleave', (e)=>{ if(e.pointerType==='mouse') hideTip(root); });
    el.addEventListener('blur', ()=>hideTip(root));
  });
  root.addEventListener('pointerdown', (e)=>{
    if(e.target.closest && e.target.closest('.st-flow, [data-mn], [data-mx], [data-ct], [data-om]')) return;
    if(R.idx >= 0){ R.idx = -1; flowCross(root); }
    hideTip(root);
  });
  bindTip('[data-mn]', el=>moneyTip(el.dataset.mn));
  bindTip('[data-mx]', el=>matTip(el.dataset.mx));
  bindTip('[data-ct]', el=>cityTip(+el.dataset.ct));
  bindTip('[data-om]', el=>cityTip(+el.dataset.om));
  show(R.tab || 'flow');
  if(R.metric!=='assets') root.querySelectorAll('[data-metric]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.metric===R.metric ? 'true' : 'false'));
  root.querySelectorAll('[data-pl]').forEach(b=>b.setAttribute('aria-pressed', R.hidden[+b.dataset.pl] ? 'false' : 'true'));
  if(tb && R.table){ tb.setAttribute('aria-pressed', 'true'); tb.textContent = '그래프로 보기'; }
}
window.addEventListener('resize', ()=>{
  const body = $('mBody'), root = body && body.querySelector('.st-root');
  if(root && G.report && G.report.tab==='flow' && modalOpen()) drawFlow(root);
});

/* --- 결정 제한 시간 (번개전) ---
   사람이 시간 안에 고르지 않으면 가장 무난한 선택(던지기, 사지 않기, 턴 넘기기)을 대신 누른다 */
let shotT = null, autoEndT = null;
function shotStop(){
  if(shotT){ clearTimeout(shotT); shotT = null; }
  const b = $('shot'); if(b) b.classList.remove('run');
}
function shotStart(){
  shotStop();
  if(!MODE.shot || G.over || !G.players.length) return;
  const who = (modalOpen() && modalWho) || curP();
  if(!who || who.ai) return;
  const b = $('shot');
  if(b){ b.style.setProperty('--shot', MODE.shot+'s'); void b.offsetWidth; b.classList.add('run'); }
  shotT = setTimeout(shotFire, MODE.shot*1000);
}
function shotFire(){
  shotT = null;
  if(G.over) return;
  if(infoOpen() || rolling || G.stepping){ shotT = setTimeout(shotFire, 800); return; }
  forceDefault();
}
function forceDefault(){
  if(G.over) return;
  if(modalOpen()){
    const who = modalWho || curP(), body = $('mBody');
    const sellList = body.querySelector('.selllist[data-need]');
    if(sellList){
      const i = aiPickSell(who, parseInt(sellList.dataset.need, 10) || 0);
      const b = body.querySelector('[data-sell="'+i+'"]') || body.querySelector('[data-sell]');
      if(b) b.click();
      return;
    }
    const halfs = [...body.querySelectorAll('[data-hs]')];
    if(halfs.length){ halfs.sort((x,y)=>invested(SP[+x.dataset.hs]) - invested(SP[+y.dataset.hs])); halfs[0].click(); return; }
    if(body.querySelector('.rps-btn,[data-selfpaced]')) return;   /* 미니게임은 자체 제한 시간이 있다 */
    const btns = [...$('mBtns').querySelectorAll('.btn:not([disabled])')];
    const pick = G.manualPrompt ? btns[btns.length-1] : ($('mBtns').querySelector('[data-auto="1"]:not([disabled])') || btns[btns.length-1]);
    if(pick) pick.click();
    return;
  }
  const act = $('actions').querySelector('[data-auto="1"]:not([disabled])') || $('actions').querySelector('.btn:not([disabled])');
  if(act) act.click();
}

function offerEndTurn(){
