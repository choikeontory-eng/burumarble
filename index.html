<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ECEAE4">
<title>글로벌 마블 | 세계 도시 보드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAE4; --ink:#16171B; --ink2:#22242A;
  --paper:#FBFAF7; --tile2:#F2F0EA; --card:#FFFFFF;
  --line:#DCD9D0; --line2:#ECE9E2;
  --text:#1A1B1F; --mut:#72747D;
  --on-d:#F1EFEA; --mut-d:#8B8D97; --line-d:rgba(255,255,255,.10);
  --accent:#E5533D; --pos-c:#1E8A54; --neg-c:#C8372D; --gold:#B58E33;
  --sans:'IBM Plex Sans KR','Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
b{font-weight:700}
.pos{color:var(--pos-c)}
.neg{color:var(--neg-c)}

/* ---------- 아이콘 (선으로 그린 SVG, 글자 크기를 따른다) ---------- */
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.solid{fill:currentColor;stroke:none}

/* ---------- 버튼 ---------- */
.btn{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  font-size:14.5px;font-weight:600;line-height:1.2;letter-spacing:-.01em;
  background:var(--card);color:var(--text);
  transition:background .12s,border-color .12s,color .12s,transform .06s,opacity .12s;
}
.btn:hover{border-color:#B9B5AA}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.36;cursor:not-allowed;transform:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000;border-color:#000}
.btn.alt{border-color:var(--ink);color:var(--ink)}
.btn.alt:hover{background:var(--tile2)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--tile2)}
.btn.danger{background:var(--neg-c);border-color:var(--neg-c);color:#fff}
.btn.danger:hover{background:#B02F26;border-color:#B02F26}
.btn.mini{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.big{font-size:16px;padding:15px 20px;width:100%;border-radius:12px}
.icon-btn{
  width:33px;height:33px;display:inline-flex;align-items:center;justify-content:center;padding:0;
  border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:16px;
  transition:background .12s,border-color .12s,color .12s;
}
.icon-btn:hover{border-color:#B9B5AA}
.icon-btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.icon-btn.mo.off{color:#B5B2A9}

/* ---------- 시작 화면 ---------- */
#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.setup-card{
  width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:34px 32px 26px;box-shadow:0 40px 80px -48px rgba(22,23,27,.55);
}
.brand-en{font-size:11px;font-weight:600;letter-spacing:.34em;color:var(--mut)}
.logo{margin:8px 0 0;font-family:var(--serif);font-weight:900;font-size:clamp(34px,10vw,46px);line-height:1.08;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.tagline{margin:10px 0 0;color:var(--mut);font-size:14px}
.stripe{display:flex;height:3px;margin:22px 0 2px;gap:3px}
.stripe span{flex:1;border-radius:2px}
.sec-label{font-size:11.5px;font-weight:600;color:var(--mut);letter-spacing:.14em;margin:22px 0 8px}
.mode-row{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--tile2)}
.mode-btn{
  flex:1;padding:10px 4px;border-radius:9px;border:0;background:transparent;
  font-size:14.5px;font-weight:600;color:var(--mut);transition:background .12s,color .12s;
}
.mode-btn.sel{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nrow{display:flex;align-items:center;gap:9px;margin-top:8px}
.nrow input{
  flex:1;min-width:0;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:15px;font-family:inherit;color:var(--text);transition:border-color .12s;
}
.nrow input::placeholder{color:#A9A7A0}
.nrow input:focus{outline:none;border-color:var(--ink)}
.nrow.ai input[type="text"]{flex:1 1 40px;background:var(--tile2);color:var(--mut)}
.aitoggle{
  flex:none;height:42px;padding:0 11px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;font-weight:600;color:var(--text);
}
.aitoggle .ic{font-size:15px}
.aitoggle.on{background:var(--ink);border-color:var(--ink);color:#fff}
.diffsel{display:flex;gap:0;flex:none;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--tile2)}
.diffbtn{width:28px;height:34px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:var(--mut)}
.diffbtn.sel{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cash-row{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--tile2)}
.cashopt{
  flex:1;display:flex;align-items:center;justify-content:center;padding:10px 4px;border-radius:9px;
  font-size:14.5px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;
  font-variant-numeric:tabular-nums;transition:background .12s,color .12s;
}
.cashopt input{position:absolute;opacity:0;pointer-events:none}
.cashopt:has(input:checked){background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cashopt:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:1px}
.opt-row{display:flex;align-items:flex-start;gap:10px;margin-top:20px;font-size:13.5px;line-height:1.55;color:var(--mut);cursor:pointer}
.opt-row b{color:var(--text)}
.opt-row input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--ink);flex:none}
#startBtn{margin-top:22px}
#rulesBtn0{width:100%;margin-top:8px;border-color:transparent;color:var(--mut);font-weight:500}
#rulesBtn0:hover{color:var(--text)}

/* ---------- 게임 레이아웃 ---------- */
.game-wrap{display:flex;gap:22px;align-items:flex-start;justify-content:center;padding:16px;flex-wrap:wrap}
#board{
  width:min(96vw, calc(100vh - 32px), 880px);
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:1.55fr repeat(10,1fr) 1.55fr;
  grid-template-rows:1.55fr repeat(10,1fr) 1.55fr;
  gap:1px;background:var(--ink);border:5px solid var(--ink);border-radius:20px;overflow:hidden;
  box-shadow:0 44px 70px -46px rgba(22,23,27,.75);
  container-type:size;
}

/* ---------- 칸 ---------- */
.cell{position:relative;background:var(--paper);overflow:hidden;cursor:pointer;transition:background .12s}
.cell:hover{background:#fff}
.cell .band{position:absolute;background:var(--gc,#999)}
.side-b .band{top:0;left:0;right:0;height:10%}
.side-t .band{bottom:0;left:0;right:0;height:10%}
.side-l .band{right:0;top:0;bottom:0;width:9%}
.side-r .band{left:0;top:0;bottom:0;width:9%}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.28cqw;padding:2px 3px;text-align:center}
.side-b .inner{padding-top:11%}
.side-t .inner{padding-bottom:11%}
.side-l .inner{padding-right:10%}
.side-r .inner{padding-left:10%}
.nm{font-weight:600;font-size:9.5px;font-size:1.46cqw;line-height:1.14;letter-spacing:-.03em;word-break:keep-all;color:var(--text)}
.nm.sm{font-size:8px;font-size:1.2cqw;color:var(--mut)}
.pr{font-size:8px;font-size:1.18cqw;color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* 건물 표시: 낮은 막대(별장), 중간 막대(빌딩), 높은 막대(호텔). 지은 것만 진하게 칠한다 */
.blds{display:flex;gap:.2cqw;align-items:flex-end;justify-content:center;height:1.5cqw;min-height:1.5cqw}
.bar{display:block;width:.62cqw;min-width:3px;background:rgba(22,23,27,.14);border-radius:1px 1px 0 0}
.bar.b1{height:42%}.bar.b2{height:70%}.bar.b3{height:100%}
.bar.on{background:var(--ink)}
.cell.has-landmark .bar.on{background:var(--gold)}
.lmstar{font-size:1.5cqw;color:var(--gold);margin-left:.15cqw;align-self:center}
.key-ic,.mini-ic{font-size:13px;font-size:2.15cqw;line-height:1;color:var(--ink);display:flex}
.cell.t-key .key-ic{color:var(--gold)}
.mini-sub{font-size:7.5px;font-size:1.06cqw;color:#A5A39B;font-weight:500}
.corner .cor-ic{font-size:18px;font-size:2.9cqw;line-height:1;display:flex;color:var(--ink)}
.corner .nm{font-size:10px;font-size:1.58cqw;font-weight:700}
.corner .cor-sub{font-size:7.5px;font-size:1.1cqw;color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.corner .inner{gap:.45cqw;justify-content:flex-start;padding-top:1.5cqw}
.cell.corner,.cell.t-key,.cell.t-care,.cell.t-daycare,.cell.t-teleport,.cell.t-cheongyeon{background:var(--tile2)}
.cell.corner:hover,.cell.t-key:hover,.cell.t-care:hover,.cell.t-daycare:hover,.cell.t-teleport:hover,.cell.t-cheongyeon:hover{background:#F8F6F1}
/* 소유 표시: 주인 색으로 옅게 물들이고 테두리를 두른다 */
.cell.owned::before{content:'';position:absolute;inset:0;background:var(--oc);opacity:.13;pointer-events:none}
.cell.owned::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 .34cqw var(--oc);pointer-events:none;z-index:2}
.cell .owndot{display:none}
.tokens{position:absolute;bottom:1px;left:0;right:0;display:flex;gap:1px;justify-content:center;align-items:flex-end;flex-wrap:wrap;pointer-events:none;z-index:3}
/* 위아래 줄 칸은 폭이 좁다. 글자 수가 많은 이름은 크기를 줄여 잘리지 않게 한다 */
.side-b .nm.w5,.side-t .nm.w5{font-size:8px;font-size:1.26cqw;letter-spacing:-.04em}
.side-b .nm.w6,.side-t .nm.w6{font-size:7px;font-size:1.08cqw;letter-spacing:-.05em}

/* ---------- 중앙 콘솔 ---------- */
#console{
  grid-area:2/2/12/12;background:var(--ink);color:var(--on-d);
  display:flex;flex-direction:column;align-items:stretch;gap:1.3cqw;padding:1.9cqw 2.3cqw 1.6cqw;
  overflow:hidden;min-height:0;
}
.c-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex:none}
.c-brand{font-size:9px;font-size:max(9px,1.16cqw);font-weight:600;letter-spacing:.36em;color:var(--mut-d)}
#turnNo{font-size:10px;font-size:max(10px,1.3cqw);color:var(--mut-d);font-variant-numeric:tabular-nums;font-weight:500}
.c-bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;flex:none;min-height:42px;padding-bottom:1.3cqw;border-bottom:1px solid var(--line-d)}
#turnBanner{display:flex;align-items:center;gap:.55em;font-size:14px;font-size:max(12.5px,1.85cqw);font-weight:500;color:#C9C7C1;min-width:0}
#turnBanner b{font-weight:700;color:#fff}
#actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;margin-left:auto}
#actions .btn{font-size:14px;font-size:max(13px,1.65cqw);padding:.72em 1.25em;border-color:rgba(255,255,255,.26);background:transparent;color:var(--on-d)}
#actions .btn:hover{border-color:rgba(255,255,255,.5)}
#actions .btn.primary{background:var(--turn,#fff);border-color:transparent;color:#fff}
#actions .btn.primary:hover{filter:brightness(1.08)}
#actions .btn.ghost{background:#fff;border-color:#fff;color:var(--ink)}
#actions .btn.ghost:hover{background:#ECEAE4;border-color:#ECEAE4}
#actions .btn.alt{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
#log{
  flex:1;overflow-y:auto;min-height:0;padding:.2cqw .2cqw 0 0;
  font-size:12px;font-size:max(11.5px,1.52cqw);line-height:1.62;color:#BDBBB5;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px);mask-image:linear-gradient(to bottom, transparent 0, #000 16px);
}
#log .ln{padding:.16em 0}
#log .ln b{color:#EDEBE6;font-weight:600}
#log .ln .ic{color:var(--mut-d);margin-right:.4em}
#log .ln.big{color:#fff}
#log .ln.big b{color:#fff;font-weight:700}
#log .turnline{display:flex;align-items:center;gap:.6em;margin-top:.55em;padding-top:.6em;border-top:1px solid var(--line-d);color:var(--mut-d);font-size:.86em;letter-spacing:.03em;font-variant-numeric:tabular-nums}
#log .turnline b{color:#D5D3CD;font-weight:600}
#log .ln:first-child .turnline{margin-top:0;padding-top:0;border-top:0}
.tl-dot{width:.62em;height:.62em;border-radius:50%;flex:none;display:inline-block}
#log .dblmark{color:#FFD27A}
#log .pos{color:#62D197}
#log .neg{color:#FF8B7B}
#log b.pos{color:#62D197}
#log b.neg{color:#FF8B7B}

/* ---------- 사이드 패널 ---------- */
#side{width:340px;max-width:96vw;display:flex;flex-direction:column;gap:10px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.side-title{font-size:11.5px;font-weight:600;color:var(--mut);letter-spacing:.16em;white-space:nowrap}
.tools{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
#players{display:flex;flex-direction:column;gap:8px}
.pcard{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 16px;
  transition:border-color .15s, box-shadow .15s;
}
.pcard::before{content:'';position:absolute;left:-1px;top:13px;bottom:13px;width:3px;border-radius:0 3px 3px 0;background:var(--pc,transparent);opacity:0;transition:opacity .15s}
.pcard.now{border-color:var(--ink);box-shadow:0 14px 26px -18px rgba(22,23,27,.6)}
.pcard.now::before{opacity:1}
.pcard.dead{opacity:.45}
.prow1{display:flex;align-items:center;gap:8px;min-width:0}
.pname{font-size:15px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:auto;white-space:nowrap;background:var(--tile2);color:var(--mut);display:inline-flex;align-items:center;gap:4px}
.st.isl{background:#F5ECDC;color:#7D5718}
.st.trv{background:#E5ECF9;color:#2D57A6}
.st.cy{background:#F2ECD3;color:#75601A}
.st.dead{background:#F6E3E0;color:#A83228}
.prow2{display:flex;justify-content:space-between;align-items:baseline;gap:0 10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px}
.prow2 b{font-size:17px;font-weight:700;color:var(--text);margin-left:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prow2 .tot{font-size:12px;font-variant-numeric:tabular-nums}
.prow3{display:flex;gap:3px;flex-wrap:wrap;margin-top:9px;min-height:12px}
.chip{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.nochip{font-size:11.5px;color:#A9A7A0}
.prow4{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.itm{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--tile2);color:#54565E;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.itm.dark{background:var(--ink);color:#F1EFEA}
.pdot{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  color:#fff;font-weight:700;font-size:12px;line-height:1;flex:none;
}
.pdot.sm{width:17px;height:17px;font-size:10px}
.fund-box{
  border:1px dashed #C6C2B8;border-radius:14px;padding:11px 16px;font-size:13px;color:var(--mut);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.fund-box span{display:inline-flex;align-items:center;gap:7px}
.fund-box b{color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}

/* ---------- 모달 ---------- */
#mBack,#iBack{
  position:fixed;inset:0;background:rgba(18,19,23,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
}
#iBack{z-index:60}
#mBox,#iBox{
  width:min(440px,94vw);max-height:88vh;max-height:88dvh;background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 50px 90px -40px rgba(8,9,12,.75);display:flex;flex-direction:column;
  animation:boxin .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes boxin{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
#mTitle,#iTitle{
  display:flex;align-items:center;gap:10px;flex:none;padding:20px 22px 8px;
  font-size:17px;font-weight:700;letter-spacing:-.015em;color:var(--text);
}
#mTitle::before,#iTitle::before{content:'';width:4px;height:17px;border-radius:2px;background:var(--hc,var(--ink));flex:none}
#mTitle .ic,#iTitle .ic{display:none}
#mBody,#iBody{padding:8px 22px 4px;font-size:14.5px;line-height:1.66;overflow-y:auto;color:#34363C}
#mBody p,#iBody p{margin:6px 0}
#mBtns,#iBtns{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 20px;flex-wrap:wrap;flex:none}
#mBtns:empty,#iBtns:empty{padding-bottom:8px}
.hint{font-size:12.5px;color:var(--mut)}
.big-amt{font-size:17px;text-align:center;margin:12px 0!important;font-variant-numeric:tabular-nums}
.scoreline{text-align:center;font-size:15px;margin:8px 0;color:var(--mut);font-variant-numeric:tabular-nums}
.scoreline b{font-size:20px;color:var(--text);margin:0 3px}
.winline{font-size:17px;display:flex;align-items:center;gap:9px}

/* 증서 */
.deed{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px;background:var(--card)}
.deedhead{
  display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
  font-weight:700;font-size:15.5px;letter-spacing:-.01em;background:var(--tile2);border-left:5px solid var(--gc,#999);
}
.deedg{font-size:11.5px;font-weight:500;color:var(--mut)}
.deedtbl{width:100%;border-collapse:collapse;font-size:13px}
.deedtbl td{padding:7px 14px;border-top:1px solid var(--line2);color:var(--mut)}
.deedtbl td .ic{font-size:14px;margin-left:3px;color:#9A988F}
.deedtbl td:nth-child(2n){text-align:right;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.deedtbl .fullr td{background:#FAF6EA;color:#6B5718;font-weight:600}
.deedtbl .fullr td .ic{color:var(--gold)}
.deedtbl .fullr td:last-child{text-align:right;color:#4E3F0F;font-weight:700}

/* 황금열쇠 카드 */
.keycard{
  border:1px solid #E4DBBE;border-radius:14px;background:#FCFAF2;padding:20px 18px 16px;text-align:center;
  animation:cardin .36s cubic-bezier(.2,.8,.3,1);
}
@keyframes cardin{0%{transform:translateY(8px) scale(.98);opacity:0}100%{transform:none;opacity:1}}
.keytitle{font-family:var(--serif);font-weight:900;font-size:21px;color:#58460F;margin-bottom:6px;letter-spacing:-.02em}

/* 건설 목록 */
.btotal{text-align:right;font-size:13.5px;color:var(--mut)}
.btotal b{color:var(--text)}
.cashbar{margin:10px 0;padding:9px 12px;border-radius:10px;background:var(--tile2);font-size:13.5px;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.blist2{margin:10px 0 8px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brow2{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13.5px;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.brow2:first-child{border-top:0}
.brow2 .bname{font-weight:700;flex:0 0 auto;min-width:70px;display:inline-flex;align-items:center;gap:6px}
.brow2 .bcost{color:var(--mut);flex:0 0 auto}
.brow2 .btoll{margin-left:auto;color:var(--pos-c);font-weight:600}
.brow2.na{opacity:.42}

/* 목적지, 매각 선택 */
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:44vh;overflow-y:auto;padding:2px}
.pickgrid.one{grid-template-columns:1fr}
.pick{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);padding:7px 9px;font-size:12.5px;text-align:left;color:var(--text);
  transition:border-color .12s,background .12s;
}
.pick:hover{border-color:var(--ink);background:var(--tile2)}
.pickband{width:4px;height:18px;border-radius:2px;flex:none}
.pickn{font-weight:600;word-break:keep-all}
.picks{margin-left:auto;color:var(--mut);font-size:11px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.sellrow{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;margin-bottom:5px}
.sellrow .srn{font-weight:600;display:inline-flex;align-items:center;gap:4px}
.sellrow .btn{margin-left:auto}
.selllist{max-height:38vh;overflow-y:auto}

/* 규칙 */
.rules h4{margin:16px 0 4px;font-size:14px;color:var(--text);display:flex;align-items:center;gap:7px}
.rules h4 .ic{font-size:16px;color:var(--mut)}
.rules h4:first-child{margin-top:4px}
.rules p{margin:3px 0;font-size:13.5px;color:#4A4C53}

/* ---------- 숨은 관리자 입력칸과 관리자 패널 ---------- */
.secret-row{margin-top:4px;display:flex;justify-content:center}
#secretIn{
  width:78px;height:20px;text-align:center;letter-spacing:.28em;font:inherit;font-size:11px;
  border:1px dashed rgba(22,23,27,.18);background:transparent;color:var(--mut);
  border-radius:6px;opacity:.04;transition:opacity .25s;outline:none;
}
#secretIn:hover,#secretIn:focus{opacity:.8}
body.admin-on .secret-row{display:none}
.rigtag{margin-left:4px;background:rgba(255,255,255,.12);color:#FFD27A;border-radius:6px;padding:1px 7px;font-size:.78em;font-weight:600;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.admtag{background:rgba(255,255,255,.12);color:#FFD27A;border-radius:5px;padding:0 5px;font-size:.86em}
.adm{font-size:13px;max-height:56vh;overflow:auto;padding-right:4px}
.adm-sec{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line2)}
.adm-sec h5{margin:0 0 6px;font-size:11.5px;letter-spacing:.08em;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.adm-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0}
.adm input,.adm select{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font:inherit;font-size:12.5px;background:var(--card);color:var(--text)}
.adm input[type=number]{width:92px}
.adm select{max-width:160px}
.adm .btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.adm .pbtn{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:4px 9px;
  font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--text)}
.adm .pbtn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.adm .pbtn.dead{opacity:.42;text-decoration:line-through}
.adm .lbl{font-size:12px;color:var(--mut);font-weight:600}
.adm .hintline{font-size:11.5px;color:var(--mut);margin:2px 0 0;width:100%}

/* ================================================================
   3D 피규어 말 (순수 CSS 3D, 크기는 font-size 로 조절)
   ================================================================ */
/* 피규어 면은 클릭을 받지 않는다. 3D로 투영된 면이 이웃 버튼의 클릭을 가로채는 일을 막는다 */
.fstage{position:relative;width:100%;height:100%;perspective:360px;perspective-origin:50% 44%;pointer-events:none}
.fscene{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-15deg)}
.fgrp{position:absolute;left:50%;top:76%;transform-style:preserve-3d;animation:figspin 7s linear infinite}
@keyframes figspin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
.fstage.still .fgrp{animation:none;transform:rotateY(-26deg)}
.fface,.ftri{position:absolute;left:50%;top:50%}
.ftri{transform-origin:50% 0;clip-path:polygon(50% 0%,100% 100%,0% 100%)}
.fdisc{border-radius:50%}
.fdf{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9%}
.fdf span{display:flex;align-items:center;justify-content:center}
.fdf .pip{width:76%;aspect-ratio:1;margin:auto;border-radius:50%;background:rgba(255,255,255,.94)}
.fpad{position:absolute;left:50%;top:76%;width:1.5em;height:.5em;margin:-.25em 0 0 -.75em;border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.34), transparent 78%)}

/* 피규어 선택 버튼과 선택 그리드 */
.figbtn{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--tile2);padding:0;position:relative;transition:border-color .12s}
.figbtn:hover{border-color:var(--ink)}
.figbtn .fstage{font-size:21px}
.figpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.figopt{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:border-color .12s}
.figopt:hover{border-color:#B9B5AA}
.figopt .fwrap{width:100%;height:70px;position:relative;font-size:32px}
.figopt .flabel{font-size:12px;font-weight:600;color:var(--mut)}
.figopt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.figopt.sel .flabel{color:var(--text)}
.figopt.taken{opacity:.32;cursor:not-allowed;filter:grayscale(.85)}

/* 보드 위의 말 */
.token{
  position:relative;flex:none;
  width:3.7cqw;min-width:26px;max-width:42px;
  height:5.9cqw;min-height:40px;max-height:64px;
  font-size:3.7cqw;
}
.token .fgrp{animation:none;transform:rotateY(-24deg)}
.token.cur .fgrp{animation:figspin 5.5s linear infinite}
.token .fstage{perspective:220px}
.token .fgrp,.token .fpad{top:88%}
.token .fpad{background:radial-gradient(closest-side, rgba(0,0,0,.42), transparent 76%)}
@keyframes tokhop{0%,100%{transform:translateY(0)}45%{transform:translateY(-24%)}}
.token.hop{animation:tokhop .17s ease-in-out}

/* ================================================================
   시각 이펙트 레이어 (절제된 강조만 남긴다)
   ================================================================ */
#fx{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.fxp{position:absolute;width:6px;height:10px;border-radius:1px;will-change:transform,opacity;
  animation:fxfall var(--d,900ms) cubic-bezier(.18,.62,.3,1) forwards}
@keyframes fxfall{
  0%{transform:translate3d(-50%,-50%,0) rotate(0);opacity:1}
  100%{transform:translate3d(calc(-50% + var(--dx)),calc(-50% + var(--dy)),0) rotate(var(--rz));opacity:0}
}
.fxf{position:absolute;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  padding:3px 9px;border-radius:99px;background:var(--ink);box-shadow:0 8px 18px -8px rgba(0,0,0,.6);
  animation:fxrise 1150ms ease-out forwards}
@keyframes fxrise{
  0%{opacity:0;transform:translate(-50%,-40%)}
  14%{opacity:1;transform:translate(-50%,-70%)}
  78%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-170%)}
}
.fxf.big{font-size:19px;padding:5px 13px}
.fxr{position:absolute;border-radius:50%;border:2px solid var(--c);transform:translate(-50%,-50%);
  animation:fxring 620ms ease-out forwards}
@keyframes fxring{0%{width:10px;height:10px;opacity:.8}100%{width:130px;height:130px;opacity:0}}
.fxs{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c);
  animation:fxspark 620ms ease-out forwards}
@keyframes fxspark{
  0%{transform:translate(-50%,-50%) scale(1);opacity:.95}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}
}
.fxflash{position:absolute;inset:0;background:var(--c);animation:fxfade 700ms ease-out forwards}
@keyframes fxfade{0%{opacity:.16}100%{opacity:0}}
.cell.flash{animation:cellflash .7s ease-out}
@keyframes cellflash{0%{box-shadow:inset 0 0 0 .5cqw var(--ink)}100%{box-shadow:inset 0 0 0 0 transparent}}
.shaking{animation:shk .36s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{
  10%,90%{transform:translate3d(-1px,0,0)} 20%,80%{transform:translate3d(2px,0,0)}
  30%,50%,70%{transform:translate3d(-4px,0,0)} 40%,60%{transform:translate3d(4px,0,0)}
}
.claimbanner{position:absolute;transform:translate(-50%,-50%);z-index:46;pointer-events:none;
  padding:5px 11px;border-radius:99px;font-weight:700;font-size:13px;color:#fff;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 10px 20px -10px rgba(0,0,0,.6);
  animation:claimpop 1.25s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes claimpop{
  0%{opacity:0;transform:translate(-50%,-80%)}
  16%{opacity:1;transform:translate(-50%,-140%)}
  76%{opacity:1;transform:translate(-50%,-150%)}
  100%{opacity:0;transform:translate(-50%,-190%)}
}

/* ================================================================
   3D 물리 주사위
   바닥은 30도만 기울여 윗면(나온 눈)이 가장 잘 보이게 한다.
   기울기와 배율은 스크립트(fitDice)가 트레이 크기에 맞춰 넣는다.
   ================================================================ */
#diceTray{
  position:relative;flex:none;height:150px;height:clamp(112px,24cqw,210px);
  border-radius:14px;border-radius:max(10px,1.5cqw);
  background:radial-gradient(75% 95% at 50% 40%, var(--tray1,#33363E), var(--tray2,#1D1F25) 82%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  touch-action:none;user-select:none;-webkit-user-select:none;
  transition:box-shadow .2s;
}
#diceTray.armed.human{cursor:grab;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
#diceTray.holding{cursor:grabbing!important}
#diceTray.dbl{animation:dblring .9s ease-out}
@keyframes dblring{0%{box-shadow:inset 0 0 0 2px #FFD27A}100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}}
#diceStage{position:absolute;inset:0;perspective:900px;perspective-origin:50% 12%;pointer-events:none}
#diceFloor{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(30deg)}
#diceHint{
  position:absolute;left:0;right:0;bottom:8px;bottom:max(6px,.9cqw);text-align:center;pointer-events:none;
  font-size:10.5px;font-size:max(10.5px,1.22cqw);font-weight:500;letter-spacing:.02em;
  color:var(--mut-d);opacity:0;transition:opacity .25s;
}
#diceTray.armed.human #diceHint{opacity:1}
#diceTray.holding #diceHint{opacity:0}
#diceSum{
  position:absolute;right:14px;top:10px;right:max(10px,1.5cqw);top:max(8px,1.2cqw);
  display:flex;align-items:baseline;gap:.55em;pointer-events:none;z-index:2;
  padding:.5em .85em .45em;border-radius:99px;background:rgba(18,19,23,.72);
  font-size:11px;font-size:max(11px,1.3cqw);color:#A9ABB4;font-variant-numeric:tabular-nums;font-weight:500;
  opacity:0;transform:translateY(4px);transition:opacity .22s,transform .22s;
}
#diceSum.show{opacity:1;transform:none}
#diceSum b{font-size:1.9em;font-weight:700;color:#fff;line-height:.9;letter-spacing:-.03em}
#diceSum .tag{font-style:normal;font-size:.86em;font-weight:700;color:#16171B;background:#FFD27A;border-radius:99px;padding:1px 8px;align-self:center}
#diceSum.dbl b{color:#FFD27A}

.d3{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;transform-style:preserve-3d;will-change:transform}
.d3 .face{
  position:absolute;left:0;top:0;width:46px;height:46px;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;
  background:#F8F6F1;border-radius:8px;backface-visibility:hidden;
  box-shadow:inset 0 0 0 1px rgba(60,50,30,.08), inset 0 0 8px rgba(60,50,30,.09);
}
/* 면마다 빛을 받는 정도를 --sh 로 받아 어둡게 덮는다 (매 프레임 갱신) */
.d3 .face::after{content:'';position:absolute;inset:0;border-radius:inherit;background:#0B0D16;opacity:var(--sh,0);pointer-events:none}
.d3 .face span{display:flex;align-items:center;justify-content:center}
.d3 .face .pip{
  width:80%;aspect-ratio:1;margin:auto;border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #3B3D45, #111216 72%);
  box-shadow:inset 0 1px 1.5px rgba(0,0,0,.65), 0 .6px 0 rgba(255,255,255,.75);
}
.d3 .face.f1 .pip{background:radial-gradient(circle at 36% 30%, #F1735F, #BF3421 72%);transform:scale(1.5)}
/* 모서리를 둥글린 틈으로 속이 비쳐 보이지 않게 채우는 안쪽 정육면체 */
.d3 .core{position:absolute;left:2px;top:2px;width:42px;height:42px;background:#DDD9D0;backface-visibility:hidden}
/* 정육면체 여섯 면 (반쪽 = 23px, 안쪽 = 21px) */
.d3 .f1{transform:translateZ(23px)}
.d3 .f6{transform:rotateY(180deg) translateZ(23px)}
.d3 .f3{transform:rotateY(90deg) translateZ(23px)}
.d3 .f4{transform:rotateY(-90deg) translateZ(23px)}
.d3 .f2{transform:rotateX(-90deg) translateZ(23px)}
.d3 .f5{transform:rotateX(90deg) translateZ(23px)}
.d3 .c1{transform:translateZ(21px)}
.d3 .c6{transform:rotateY(180deg) translateZ(21px)}
.d3 .c3{transform:rotateY(90deg) translateZ(21px)}
.d3 .c4{transform:rotateY(-90deg) translateZ(21px)}
.d3 .c2{transform:rotateX(-90deg) translateZ(21px)}
.d3 .c5{transform:rotateX(90deg) translateZ(21px)}
.dshadow{
  position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
  border-radius:34%;background:rgba(0,0,0,.72);filter:blur(6px);pointer-events:none;will-change:transform,opacity;
}

/* 미니게임과 안내용 평면 주사위 */
.die{
  width:56px;height:56px;flex:none;background:#FBFAF7;border:1px solid var(--line);border-radius:14px;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:0 10px 18px -12px rgba(0,0,0,.45);
}
.die span{display:flex;align-items:center;justify-content:center}
.die .pip{background:var(--ink);border-radius:50%;width:76%;aspect-ratio:1;margin:auto}
.die.ace .pip{background:var(--accent);transform:scale(1.45)}
.die.blank{display:flex;align-items:center;justify-content:center;color:#B5B2A9;font-size:24px;font-weight:600}

/* --- 미니게임 UI --- */
.mg-dice{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.mg-side{display:flex;flex-direction:column;align-items:center;gap:6px}
.mg-lab{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.06em}
.mg-face{width:56px;height:56px;display:flex}
.mg-vs{font-weight:600;color:#B5B2A9;font-size:12px;letter-spacing:.12em}
.mg-status{text-align:center;font-size:14px;margin:8px 0 2px;font-weight:600;min-height:1.2em}
.mg-reveal{text-align:center;font-size:17px;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut)}
.mg-reveal .ic{font-size:30px;color:var(--text)}
.mg-reveal b{font-size:15px}
.mg-timer{text-align:center;font-size:40px;font-weight:700;color:var(--text);margin:6px 0;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mg-timer .ic{font-size:36px;color:var(--mut)}
.rps-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
.rps-btn{flex:1;max-width:104px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 0 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;
  font-size:30px;line-height:1;color:var(--text);transition:border-color .12s, background .12s}
.rps-btn span{font-size:12.5px;font-weight:600;color:var(--mut)}
.rps-btn:hover{border-color:#B9B5AA}
.rps-btn.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--tile2)}
.rps-btn.sel span{color:var(--text)}


/* ================================================================
   황금열쇠 미니게임: 승부차기, 사다리 타기, 홀짝, 코인 차트
   ================================================================ */
.pk{display:flex;flex-direction:column;gap:10px}
.pk-dots{display:flex;gap:7px;justify-content:center}
.pk-dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid #C9C6BD}
.pk-dots i.now{border-color:var(--ink)}
.pk-dots i.in{background:var(--pos-c);border-color:var(--pos-c)}
.pk-dots i.out{background:#D8D5CC;border-color:#D8D5CC}
/* 잔디와 골대. 골라인은 108px 높이에 있다 */
.pk-field{position:relative;height:168px;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#2F7D56 0 12.5%,#2A7550 12.5% 25%)}
.pk-field::after{content:'';position:absolute;left:0;right:0;top:108px;height:2px;background:rgba(255,255,255,.75)}
.pk-frame{position:absolute;left:8%;right:8%;top:16px;height:92px;border:4px solid #F4F2EC;border-bottom:0;border-radius:4px 4px 0 0;
  background-color:rgba(8,28,18,.3);
  background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);
  background-size:12px 12px}
.pk-zones{position:absolute;inset:0;display:flex}
.pk-zone{flex:1;border:0;background:transparent;color:#fff;font-size:12.5px;font-weight:600;font-family:inherit;
  display:flex;align-items:flex-start;justify-content:center;padding-top:8px;cursor:pointer;transition:background .12s}
.pk-zone + .pk-zone{border-left:1px dashed rgba(255,255,255,.35)}
.pk-zone:hover:not(:disabled),.pk-zone.sel{background:rgba(255,255,255,.22)}
.pk-zone:disabled{cursor:default}
.pk-zone span{background:rgba(8,28,18,.6);border-radius:99px;padding:2px 9px}
.pk-keeper{position:absolute;left:50%;top:58px;width:34px;height:50px;margin-left:-17px;pointer-events:none;transform-origin:50% 100%;
  transition:left .32s cubic-bezier(.2,.8,.3,1),transform .32s cubic-bezier(.2,.8,.3,1)}
.pk-head{position:absolute;left:50%;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#F2D3B3}
.pk-body{position:absolute;left:50%;top:13px;width:22px;height:32px;margin-left:-11px;border-radius:7px 7px 4px 4px;background:#F2C230}
.pk-body::before,.pk-body::after{content:'';position:absolute;top:1px;width:8px;height:22px;border-radius:4px;background:#F2C230}
.pk-body::before{left:-8px;transform:rotate(22deg);transform-origin:top right}
.pk-body::after{right:-8px;transform:rotate(-22deg);transform-origin:top left}
.pk-keeper.dl{transform:rotate(-64deg) translateY(-8px)}
.pk-keeper.dr{transform:rotate(64deg) translateY(-8px)}
.pk-keeper.up{transform:translateY(-9px)}
.pk-spot{position:absolute;left:50%;top:146px;width:10px;height:4px;margin-left:-5px;border-radius:50%;background:rgba(255,255,255,.8)}
.pk-ball{position:absolute;left:50%;top:136px;z-index:2;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff 0 52%,#D9D6CE 100%);box-shadow:inset 0 0 0 1.5px #16171B, 0 3px 5px rgba(0,0,0,.35);
  transition:left .36s cubic-bezier(.3,.6,.4,1),top .36s cubic-bezier(.3,.6,.4,1),transform .36s}
.pk-ball.fly{transform:scale(.72)}
.pk-ball.weak{transition-duration:.72s}
.pk-gauge{position:relative;height:14px;display:flex;transition:opacity .2s}
.pk-gauge i{display:block;height:100%}
.pk-gauge.idle{opacity:.35}
.g-weak{width:22%;background:#D8D5CC;border-radius:99px 0 0 99px}
.g-ok{width:40%;background:#A6D3B8}
.g-power{width:24%;background:var(--pos-c)}
.g-over{width:14%;background:#E9A59D;border-radius:0 99px 99px 0}
.pk-gauge b{position:absolute;left:0;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px #fff}
.pk-legend{display:flex;margin-top:-5px;font-size:11px;color:var(--mut)}
.pk-legend span{text-align:center}
.pk-legend span:nth-child(1){width:22%}.pk-legend span:nth-child(2){width:40%}.pk-legend span:nth-child(3){width:24%}.pk-legend span:nth-child(4){width:14%}
.pk-legend .pw{color:var(--pos-c);font-weight:700}

.ld{display:flex;flex-direction:column;gap:6px}
.ld-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center}
.ld-pick{width:64px;padding:7px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;transition:border-color .12s,background .12s}
.ld-pick:hover:not(:disabled){border-color:var(--ink)}
.ld-pick.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.ld-pick:disabled{cursor:default}
.ld-svg{width:100%;height:auto;display:block}
.ld-base line{stroke:#C9C6BD;stroke-width:3;stroke-linecap:round}
#ldPath{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ld-prize{min-width:64px;text-align:center;padding:6px 8px;border-radius:10px;background:var(--tile2);font-size:13.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.ld-prize.pos{color:var(--pos-c)}
.ld-prize.neg{color:var(--neg-c)}
.ld-prize.hit{box-shadow:inset 0 0 0 2px var(--ink);background:var(--card)}

.oe-btn{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 11px;
  border:1px solid var(--line);border-radius:14px;background:var(--card);font:inherit;font-size:22px;font-weight:700;color:var(--text);cursor:pointer;
  transition:border-color .12s,background .12s}
.oe-btn span{font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:.04em}
.oe-btn:hover:not(:disabled){border-color:#B9B5AA}
.oe-btn.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--tile2)}
.oe-btn:disabled{cursor:default}

.cn{display:flex;flex-direction:column;gap:8px}
.cn-top{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.cn-top b{color:var(--text)}
.cn-chart{position:relative;height:132px;border-radius:14px;overflow:hidden;background:var(--ink)}
.cn-chart svg{position:absolute;inset:0;width:100%;height:100%}
#cnLine{fill:none;stroke:#62D197;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cn.crash #cnLine{stroke:#FF8B7B}
.cn-mult{position:absolute;left:14px;top:10px;font-size:26px;font-weight:700;color:#fff;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cn.crash .cn-mult{color:#FF8B7B}

/* 특수 능력 표시 */
.itm.buff{background:var(--bc);color:#fff}
.itm.prog{background:transparent;border:1px dashed #C6C2B8;color:var(--mut)}
.token.buffed .fpad{background:radial-gradient(closest-side, rgba(255,210,122,.95), rgba(255,210,122,.35) 55%, transparent 78%);animation:aura 1.6s ease-in-out infinite}
@keyframes aura{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.35);opacity:1}}

/* 송금 */
.sd{display:flex;flex-direction:column;gap:10px}
.sd-to{display:flex;flex-wrap:wrap;gap:6px}
.sd-pick{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.sd-pick.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--tile2)}
.sd-amt{display:flex;align-items:center;gap:8px}
.sd-amt input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);background:var(--card)}
.sd-amt input:focus{outline:none;border-color:var(--ink)}
.sd-amt span{font-size:14px;color:var(--mut)}
.sd-quick{display:flex;flex-wrap:wrap;gap:6px}
.sd-quick button{padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--tile2);font:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer}
.sd-quick button:hover{border-color:var(--ink)}

/* 경기 통계 */
#mBox.wide{width:min(780px,96vw)}
.st-root{position:relative;margin-top:14px}
.st-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.st-tab{appearance:none;flex:none;border:0;background:none;padding:9px 14px 10px;font:inherit;font-size:13.5px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.st-tab:hover{color:var(--text)}
.st-tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--ink)}
.st-tab:focus-visible{outline:2px solid var(--ink);outline-offset:-3px;border-radius:8px}
.st-pane .st-sec:first-child{margin-top:4px}
.st-ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.st-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--tile2)}
.st-seg button{border:0;background:none;min-height:28px;padding:4px 13px;border-radius:8px;font:inherit;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer}
.st-seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(22,23,27,.14)}
.st-tbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:30px;padding:4px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer}
.st-tbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.st-seg button:focus-visible,.st-tbtn:focus-visible,.st-key:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.st-keys{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:6px}
.st-key{display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:3px 11px 3px 9px;border:1px solid var(--line);border-radius:99px;background:var(--card);font:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.st-key i{width:14px;height:3px;border-radius:2px;flex:none}
.st-key[aria-pressed="false"]{color:var(--mut);background:var(--tile2);text-decoration:line-through}
.st-key[aria-pressed="false"] i{opacity:.3}
.st-evks{display:flex;flex-wrap:wrap;gap:3px 12px;margin:0 2px 7px;font-size:11.5px;color:var(--mut)}
.st-evks span{display:inline-flex;align-items:center;gap:4px}
.st-evks .ic{font-size:13px;color:var(--text)}
.st-evks .st-sea{width:12px;height:6px;border-radius:2px;display:inline-block}
.st-flow{position:relative;border:1px solid var(--line2);border-radius:12px;background:var(--card);touch-action:pan-y;outline:none;overflow:hidden;cursor:crosshair}
.st-flow:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.st-flow svg{display:block;width:100%;height:auto}
.st-flow .g{stroke:var(--line2);stroke-width:1}
.st-flow .g.base{stroke:var(--line)}
.st-flow text{font-family:var(--sans);font-size:11px;fill:var(--mut);font-variant-numeric:tabular-nums}
.st-flow .yl,.st-flow .xt{text-anchor:end}
.st-flow .xl{text-anchor:middle}
.st-flow .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.st-flow .dot{stroke:var(--card);stroke-width:2}
.st-flow .tagk{stroke-width:2;stroke-linecap:round}
.st-flow .dl{fill:var(--text);font-weight:600;font-size:11.5px}
.st-flow .evl{stroke:var(--line2);stroke-width:1}
.st-flow .evm circle{fill:var(--card);stroke-width:1.5}
.st-flow .evm .ic{color:var(--text);stroke-width:2.1}
.st-flow .xh line{stroke:var(--ink);stroke-width:1}
.st-flow .xh circle{stroke:var(--card);stroke-width:2}
.st-cap{margin:8px 2px 0;font-size:12.5px;color:#4A4C53;line-height:1.6}
.st-tall{max-height:300px;overflow:auto}
.st-tall thead th{position:sticky;top:0;z-index:1}
.st-tip{position:absolute;z-index:5;min-width:150px;max-width:270px;padding:9px 11px;border-radius:10px;background:var(--ink);color:#F1EFEA;font-size:12px;line-height:1.5;pointer-events:none;box-shadow:0 14px 30px -12px rgba(8,9,12,.55)}
.st-tip.under{max-width:none;width:100%}
.tt-h{font-weight:600;color:#fff;margin-bottom:4px;font-size:12px}
.tt-r{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt-r b{font-weight:700;color:#fff;min-width:66px}
.tt-r span{color:#B9BBC3;overflow:hidden;text-overflow:ellipsis}
.tt-k{width:9px;height:9px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.tt-k.ln{width:13px;height:3px;border-radius:2px;box-shadow:none}
.tt-n{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.14);color:#D9DAE0;white-space:normal}
.tt-n + .tt-n{margin-top:2px;padding-top:0;border-top:0}
.st-legend.sq i{width:10px;height:10px;border-radius:3px}
.mn{margin-top:4px}
.mn-row{padding:10px 0 8px;border-top:1px solid var(--line2)}
.mn-row:first-child{border-top:0;padding-top:4px}
.mn-who{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:13px}
.mn-who > b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-net{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.mn-line{display:grid;grid-template-columns:62px minmax(0,1fr) 96px;align-items:center;gap:8px;min-height:24px;border-radius:6px;outline:none;cursor:default}
.mn-line:hover .mn-lab,.mn-line:focus-visible .mn-lab{color:var(--text)}
.mn-line:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.mn-lab{font-size:11.5px;color:var(--mut)}
.mn-track{display:block;height:14px}
.mn-bar{display:flex;gap:2px;height:100%;min-width:3px}
.mn-bar i{display:block;height:100%;min-width:2px}
.mn-bar i:last-child{border-radius:0 4px 4px 0}
.mn-val{text-align:right;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx-wrap{border:0;border-radius:0}
.mx{width:100%;border-collapse:separate;border-spacing:2px;font-size:12px;font-variant-numeric:tabular-nums}
.mx th{font-weight:600;font-size:11.5px;color:var(--mut);padding:4px 6px;text-align:center;white-space:nowrap}
.mx th .pdot{margin-right:5px;vertical-align:-3px}
.mx th.rh{text-align:left;color:var(--text)}
.mx th.mx-corner{text-align:left;font-weight:500;font-size:11px}
.mx td{height:36px;text-align:center;border-radius:6px;background:var(--tile2);color:var(--text);font-weight:600;white-space:nowrap;padding:0 8px;outline:none}
.mx td.mx-c{cursor:default}
.mx td.mx-c:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.mx td.dk{color:#fff}
.mx td.self{background:none;color:var(--line)}
.mx td.sum{background:none;color:var(--mut)}
.mx-leg{display:flex;align-items:center;gap:3px;justify-content:flex-end;margin-top:6px;font-size:11px;color:var(--mut)}
.mx-leg i{width:18px;height:8px;border-radius:2px}
.mx-leg span{margin:0 4px}
.ct{display:flex;flex-direction:column;gap:2px}
.ct-row{display:grid;grid-template-columns:16px 40px minmax(0,1fr) auto;grid-template-rows:auto 12px;column-gap:10px;row-gap:3px;align-items:center;padding:6px 6px;border-radius:10px;outline:none}
.ct-row:hover{background:var(--tile2)}
.ct-row:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.ct-no{grid-row:1/3;font-size:12px;font-weight:700;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.ct-lm{grid-row:1/3;display:flex;align-items:center;justify-content:center}
.ct-lm .lmk{width:40px;height:27px;fill:currentColor}
.ct-lm .ic{font-size:24px}
.ct-name{grid-column:3;display:flex;align-items:baseline;gap:8px;min-width:0}
.ct-name b{font-size:13px;font-weight:600;white-space:nowrap}
.ct-name i{font-style:normal;font-size:11px;color:var(--mut);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.ct-name em{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.ct-val{grid-column:4;grid-row:1;text-align:right;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.ct-track{grid-column:3/5;grid-row:2;height:12px}
.ct-bar{display:block;height:100%;background:#2a78d6;border-radius:0 4px 4px 0;min-width:3px}
.om{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:2px;width:min(100%,420px);aspect-ratio:1;margin:6px auto 0}
.om-c{position:relative;border-radius:4px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);outline:none}
.om-c[data-om]{cursor:default}
.om-c.own{background:var(--oc);box-shadow:none}
.om-c.om-x{background:repeating-linear-gradient(45deg,var(--line2) 0 2px,transparent 2px 5px);box-shadow:none}
.om-c[data-om]:hover,.om-c:focus-visible{box-shadow:0 0 0 2px var(--ink);z-index:1}
.om-b{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:2px}
.om-b i{width:4px;height:4px;border-radius:1px;background:#fff}
.om-lm{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.om-mid{grid-area:2/2/12/12;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:0 14%;font-size:12px;color:var(--mut)}
.om-mid span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.om-mid i{width:11px;height:11px;border-radius:3px;flex:none}
.om-mid i.om-free{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.om-mid b{color:var(--text);font-weight:600}
.om-note{margin-top:4px;font-size:11px}
.om-b.static,.om-lm.static{position:relative;left:auto;right:auto;bottom:auto;top:auto;transform:none;display:inline-flex}
.om-b.static i{background:var(--mut)}
.om-lm.static{width:11px;height:11px;background:var(--mut);margin-left:6px}
@media (max-width:560px){
  .st-tab{padding:9px 11px 10px}
  .mn-line{grid-template-columns:54px minmax(0,1fr) 82px;gap:6px}
  .om-mid{padding:0 6%;font-size:11px;gap:3px}
  .om-note{display:none}
}
.st-sec{margin-top:16px}
.st-sec h5{margin:0 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--mut)}
.st-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:var(--mut)}
.st-legend span{display:inline-flex;align-items:center;gap:5px}
.st-legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.st-scroll{overflow-x:auto;border:1px solid var(--line2);border-radius:12px}
.st-tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.st-tbl th,.st-tbl td{padding:7px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line2)}
.st-tbl thead th{border-top:0;font-weight:600;background:var(--tile2)}
.st-tbl th b{font-weight:600;margin-left:5px}
.st-tbl th:first-child,.st-tbl td:first-child{text-align:left;color:var(--mut);position:sticky;left:0;background:var(--card)}
.st-tbl thead th:first-child{background:var(--tile2)}
.st-tbl td.best{font-weight:700;color:var(--text);background:#FAF6EA}
.st-hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.st-hl div{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:10px;background:var(--tile2)}
.st-hl span{font-size:11.5px;color:var(--mut)}
.st-hl b{font-size:13px;font-weight:600;line-height:1.45}
@media (max-width:560px){ .st-hl{grid-template-columns:minmax(0,1fr)} }

/* ---------- 작은 보드용 로그 자리 (평소에는 숨김) ---------- */
#logDock{width:min(96vw,880px);display:flex;background:var(--ink);border-radius:14px;padding:8px 14px 10px}
#logDock.hidden{display:none!important}
#logDock #log{flex:1;height:112px;font-size:12.5px;padding:0}


/* ================================================================
   모드, 계절, 축제, 독점
   ================================================================ */
/* 계절마다 바탕색과 트레이 색조가 바뀐다 */
body{transition:background-color 1.4s ease}
body[data-season="spring"]{--bg:#E6ECDF;--sc:#58A86F;--tray1:#31403A;--tray2:#1B2320}
body[data-season="summer"]{--bg:#E0EBEF;--sc:#3F9CC0;--tray1:#2C3D47;--tray2:#19232A}
body[data-season="autumn"]{--bg:#F1E6D5;--sc:#D07A35;--tray1:#463A2F;--tray2:#27201A}
body[data-season="winter"]{--bg:#E4E8F0;--sc:#7C8DB5;--tray1:#353C4D;--tray2:#1D212C}
#ambient{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
#setup,#game{position:relative;z-index:1}
#console{position:relative}
#console::before{
  content:'';position:absolute;left:0;right:0;top:0;height:44%;z-index:0;pointer-events:none;
  background:linear-gradient(to bottom, var(--sc,transparent), transparent);opacity:.15;
}
#console > *{position:relative;z-index:1}
body.final #console::before{background:linear-gradient(to bottom, #E5533D, transparent);opacity:.22}

/* 시작 화면: 게임 방식 */
.gm-btn{
  flex:1;padding:9px 4px 8px;border-radius:9px;border:0;background:transparent;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:14.5px;font-weight:600;color:var(--mut);transition:background .12s,color .12s;
}
.gm-btn small{font-size:11px;font-weight:500;opacity:.85}
.gm-btn.sel{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mode-desc{margin:9px 2px 0;font-size:12.5px;line-height:1.55;color:var(--mut);min-height:3.1em}

/* 콘솔 머리줄: 계절, 남은 시간, 턴 */
.c-hud{display:flex;align-items:center;gap:.9em;min-width:0;font-size:10px;font-size:max(10px,1.3cqw);color:var(--mut-d)}
#seasonChip{display:inline-flex;align-items:center;gap:.45em;min-width:0;padding:.32em .85em .32em .65em;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
#seasonChip .ic{color:var(--sc,#fff);font-size:1.15em}
#seasonChip b{color:#fff;font-weight:600}
#seasonChip span{color:#B4B6BF}
#seasonChip em{font-style:normal;color:#FFD27A}
#clock{font-variant-numeric:tabular-nums;font-weight:700;color:#fff;font-size:1.3em;letter-spacing:-.01em;white-space:nowrap}
#clock.final{color:#FF8B7B;animation:clockpulse 1s ease-in-out infinite}
@keyframes clockpulse{50%{opacity:.5}}

/* 알림 띠: 계절이 바뀌거나 독점이 생기면 트레이 위에 잠깐 뜬다 */
#banner{
  position:absolute;left:50%;top:50%;z-index:4;pointer-events:none;opacity:0;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:.3em;max-width:94%;
  padding:.9em 1.7em;border-radius:1.2em;background:rgba(13,14,17,.88);text-align:center;white-space:nowrap;
  box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 24px 40px -20px rgba(0,0,0,.9);
}
#banner b{font-size:15px;font-size:max(15px,2.3cqw);font-weight:700;color:var(--bc,#fff);letter-spacing:-.01em}
#banner span{font-size:11px;font-size:max(11px,1.35cqw);color:#C9C7C1}
#banner.show{opacity:1;animation:bannerin 2.6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes bannerin{
  0%{opacity:0;transform:translate(-50%,-38%) scale(.96)}
  9%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  86%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-60%) scale(1)}
}

/* 결정 제한 시간 막대 (번개전) */
#shot{flex:1 0 100%;height:3px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden;display:none}
#shot.run{display:block}
#shot i{display:block;width:100%;height:100%;background:var(--turn,#fff);transform-origin:left center}
#shot.run i{animation:shotbar var(--shot,12s) linear forwards}
@keyframes shotbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* 축제 도시: 꼬리표와 은은히 뛰는 테두리 */
.festtag{
  display:none;position:absolute;top:.4cqw;left:.4cqw;z-index:3;pointer-events:none;
  font-size:7px;font-size:.92cqw;font-weight:700;line-height:1.35;color:#fff;background:var(--accent);
  border-radius:99px;padding:.05em .55em;
}
.cell.fest .festtag{display:block}
.cell.fest{animation:festpulse 1.8s ease-in-out infinite}
@keyframes festpulse{0%,100%{box-shadow:inset 0 0 0 .2cqw rgba(229,83,61,.18)}50%{box-shadow:inset 0 0 0 .34cqw rgba(229,83,61,.7)}}
/* 지역 독점: 색 띠가 두꺼워지고 빗금이 들어간다 */
.side-b.mono .band,.side-t.mono .band{height:17%}
.side-l.mono .band,.side-r.mono .band{width:15%}
.cell.mono .band::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg, rgba(255,255,255,.34) 0 .32cqw, transparent .32cqw .8cqw)}
.side-b.mono .inner{padding-top:17%}
.side-t.mono .inner{padding-bottom:17%}
.side-l.mono .inner{padding-right:15%}
.side-r.mono .inner{padding-left:15%}
.pr.sale{color:var(--neg-c);font-weight:700}

/* 참가자 카드의 순위 */
.rk{font-style:normal;font-size:11px;font-weight:700;color:var(--text);background:var(--tile2);border-radius:99px;padding:1px 7px;margin-left:6px}

/* 결과 화면 */
.rk-list{display:flex;flex-direction:column;gap:6px;margin:12px 0 8px}
.rk-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.rk-row.first{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rk-row.out{opacity:.5}
#mBox.wide .rk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
#mBox.wide .rk-row{padding:8px 12px}
@media (max-width:620px){ #mBox.wide .rk-list{grid-template-columns:minmax(0,1fr)} }
.rk-no{width:1.1em;flex:none;text-align:center;font-size:18px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.rk-row.first .rk-no{color:var(--text)}
.rk-main{display:flex;flex-direction:column;flex:1;min-width:0}
.rk-main b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-main i{font-style:normal;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-amt{flex:none;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}


/* ================================================================
   다듬기: 시작 화면 히어로, 칸 아이콘 배지, 모서리 칸, 소유 표시, 콘솔 질감
   ================================================================ */


/* 시작 화면: 왼쪽 어두운 히어로 + 오른쪽 설정 카드 */
.setup-shell{width:min(980px,100%);min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);border-radius:26px;overflow:hidden;
  box-shadow:0 60px 110px -60px rgba(22,23,27,.7), 0 0 0 1px rgba(22,23,27,.06)}
.setup-hero{position:relative;overflow:hidden;background:#16171B;color:#F1EFEA;padding:40px 36px 34px;display:flex;flex-direction:column}
.setup-hero::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.09) 1px, transparent 1.2px);background-size:16px 16px;
  -webkit-mask-image:radial-gradient(120% 80% at 30% 20%, #000, transparent 75%);mask-image:radial-gradient(120% 80% at 30% 20%, #000, transparent 75%)}
.setup-hero > *{position:relative}
.setup-hero .brand-en{color:#8B8D97}
.setup-hero .logo{color:#fff;margin-top:10px}
.setup-hero .tagline{color:#A9ABB4}
.hero-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:26px 0 8px}
.hero-fig{height:100px;font-size:38px;position:relative;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);animation:herobob 3.4s ease-in-out infinite}
@keyframes herobob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero-feats{list-style:none;margin:auto 0 0;padding:18px 0 0;display:flex;flex-direction:column;gap:12px;border-top:1px solid rgba(255,255,255,.1)}
.hero-feats li{display:flex;flex-direction:column;gap:2px;padding-left:14px;position:relative}
.hero-feats li::before{content:'';position:absolute;left:0;top:.5em;width:5px;height:5px;border-radius:50%;background:#FFD27A}
.hero-feats b{font-size:14px;font-weight:600;color:#fff}
.hero-feats span{font-size:12.5px;color:#9EA0A9}
.setup-shell .setup-card{width:auto;border:0;border-radius:0;box-shadow:none;padding:34px 34px 26px}
.sec-label.first{margin-top:0}

/* 칸 아이콘: 옅은 원 배지 안에 */
.key-ic,.mini-ic{width:3.2cqw;height:3.2cqw;align-items:center;justify-content:center;border-radius:50%;background:rgba(22,23,27,.06);font-size:1.75cqw}
.cell.t-key .key-ic{background:rgba(181,142,51,.14)}
.cell.t-care .mini-ic{background:rgba(46,123,85,.13);color:#2E7B55}
.cell.t-daycare .mini-ic{background:rgba(201,135,26,.15);color:#A86C10}
.cell.t-teleport .mini-ic{background:rgba(122,98,182,.14);color:#6A52A8}
.cell.t-cheongyeon .mini-ic{background:rgba(47,88,166,.12);color:#2F58A6}

/* 모서리 칸: 저마다의 색 */
.corner .cor-ic{width:4.6cqw;height:4.6cqw;align-items:center;justify-content:center;border-radius:50%;font-size:2.5cqw;color:#fff}
.cell.t-start{background:#EAF3EC}.cell.t-start .cor-ic{background:#2E7B55}
.cell.t-island{background:#ECEDF1}.cell.t-island .cor-ic{background:#4A4E5C}
.cell.t-fund{background:#F7F0DC}.cell.t-fund .cor-ic{background:#B58E33}
.cell.t-space{background:#EEEAF7}.cell.t-space .cor-ic{background:#6A52A8}
.cell.t-start:hover{background:#E1EEE4}.cell.t-island:hover{background:#E4E6EB}.cell.t-fund:hover{background:#F3EAD0}.cell.t-space:hover{background:#E7E1F3}

/* 소유 표시: 옅은 물들임 + 얇은 테두리 + 오른쪽 위 깃발 모서리 */
.cell.owned::before{opacity:.1}
.cell.owned::after{box-shadow:inset 0 0 0 .2cqw var(--oc)}
.cell.owned .owndot{display:block;position:absolute;top:0;right:0;left:auto;width:1.9cqw;height:1.9cqw;border:0;border-radius:0;box-shadow:none;
  background:var(--oc);clip-path:polygon(0 0,100% 0,100% 100%);z-index:3}
.cell.mono.owned::after{box-shadow:inset 0 0 0 .32cqw var(--oc)}

/* 말: 글자를 덜 가리도록 조금 작게 */
.token{width:3.3cqw;height:5.3cqw;font-size:3.3cqw}

/* 콘솔: 깊은 남색 + 은은한 점무늬 */
#console{background:radial-gradient(120% 90% at 50% 0%, #22252D, #16171B 62%)}
#console::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.2px);background-size:1.6cqw 1.6cqw;
  -webkit-mask-image:linear-gradient(to bottom, #000, transparent 55%);mask-image:linear-gradient(to bottom, #000, transparent 55%)}
#diceTray{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), inset 0 18px 40px -24px rgba(0,0,0,.8)}

/* 참가자 카드: 총자산 비율 막대 */
.pbar{height:4px;border-radius:2px;background:var(--tile2);margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.pcard{transition:border-color .15s, box-shadow .15s, transform .15s}
.pcard.now{transform:translateY(-1px)}

@media (max-width:820px){
  .setup-shell{grid-template-columns:minmax(0,1fr);border-radius:22px}
  .setup-hero,.setup-shell .setup-card{min-width:0}
  .hero-fig{min-width:0}
  .setup-hero{padding:26px 22px 20px}
  .hero-figs{grid-template-columns:repeat(6,1fr);gap:4px;margin:18px 0 0}
  .hero-fig{height:58px;font-size:22px;border-radius:10px}
  .hero-feats{display:none}
  .setup-shell .setup-card{padding:24px 20px 20px}
}

/* ================================================================
   큰 보드, 랜드마크 칸, 3D 건물
   ================================================================ */
/* 보드를 키운다: 넓은 화면에서는 오른쪽 패널을 뺀 폭을 거의 다 쓴다 (세로는 스크롤) */
#board{width:min(calc(100vw - 396px), 1100px);grid-template-columns:1.42fr repeat(10,1fr) 1.42fr;grid-template-rows:1.42fr repeat(10,1fr) 1.42fr}
.game-wrap{align-items:flex-start}
#side{position:sticky;top:16px}

/* 랜드마크 실루엣: 칸 아래쪽에 옅게 깔린다 */
.lmwrap{position:absolute;left:6%;right:6%;bottom:3%;height:52%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:.2;z-index:0;transition:opacity .2s}
.side-l .lmwrap{right:13%}.side-r .lmwrap{left:13%}
.side-t .lmwrap{bottom:13%}
.lmwrap .lmk{width:100%;height:100%;fill:currentColor}
.cell:hover .lmwrap{opacity:.34}
.cell.built .lmwrap{opacity:.12}
.cell .inner{z-index:1}
.cell .nm{text-shadow:0 0 .4cqw var(--paper), 0 0 .4cqw var(--paper)}
.cell .pr{background:rgba(251,250,247,.82);border-radius:99px;padding:0 .5cqw}

/* 3D 건물 */
.bslot{width:100%;height:0;transition:height .25s}
.cell.built .bslot{height:4.2cqw}
.cell.built .blds{display:none}
.b3d{position:relative;width:100%;height:100%;font-size:2.25cqw;perspective:460px;perspective-origin:50% 25%;pointer-events:none}
.bsc{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-24deg)}
.bgrp{position:absolute;left:50%;top:86%;transform-style:preserve-3d;transform:rotateY(-20deg)}
.bslot.rise .bgrp{animation:bldrise .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bldrise{0%{transform:rotateY(-20deg) translateY(-1.2em) scale(.6);opacity:0}100%{transform:rotateY(-20deg);opacity:1}}
.cell.has-landmark .bslot{background:radial-gradient(50% 60% at 50% 70%, rgba(255,210,122,.55), transparent 70%)}
.bgrp .fface,.bgrp .ftri{backface-visibility:hidden}

/* ================================================================
   계절 하늘: 네 장의 배경을 겹쳐 두고 지금 계절만 보이게 한다 (부드럽게 바뀐다)
   ================================================================ */
body{background:#E9E6EF}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.sky-l{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease}
.sky-l .land{position:absolute;left:0;bottom:0;width:100%;height:64vh;min-height:330px;display:block}
body[data-season="spring"] .sky-spring,body[data-season="summer"] .sky-summer,body[data-season="autumn"] .sky-autumn,body[data-season="winter"] .sky-winter{opacity:1}
.sky-spring{background:
  radial-gradient(900px 620px at 12% 8%, rgba(255,255,255,.8), transparent 60%),
  radial-gradient(800px 700px at 92% 88%, rgba(255,150,196,.6), transparent 62%),
  radial-gradient(700px 520px at 70% 20%, rgba(214,190,255,.55), transparent 60%),
  linear-gradient(150deg,#FFE0EC 0%,#FAD0EC 32%,#DCCFFF 68%,#C9E3FF 100%)}
.sky-summer{background:
  radial-gradient(560px 560px at 90% 4%, rgba(255,250,205,1), rgba(255,226,130,.55) 32%, transparent 62%),
  radial-gradient(900px 600px at 0% 100%, rgba(120,235,215,.55), transparent 60%),
  linear-gradient(176deg,#36B6E6 0%,#6FD3EE 30%,#AEEFE8 62%,#FFF0B8 100%)}
.sky-autumn{background:
  radial-gradient(900px 560px at 78% 0%, rgba(255,222,150,.9), transparent 60%),
  radial-gradient(900px 700px at 10% 100%, rgba(120,30,60,.55), transparent 60%),
  linear-gradient(164deg,#FFC15E 0%,#F6853F 34%,#D9504A 66%,#83294D 100%)}
.sky-winter{background:
  radial-gradient(1000px 600px at 50% 110%, rgba(170,200,255,.55), transparent 60%),
  linear-gradient(178deg,#0A1230 0%,#16275A 38%,#2F4B8E 72%,#7E9CD6 100%)}
.aurora{position:absolute;left:-20%;width:140%;height:46%;opacity:.7;animation:aurora 16s ease-in-out infinite alternate;animation-play-state:paused}
body[data-season="winter"] .aurora{animation-play-state:running;will-change:transform}
.aurora.a1{top:-8%;background:
  radial-gradient(40% 55% at 22% 50%, rgba(80,255,190,.55), transparent 70%),
  radial-gradient(38% 50% at 50% 42%, rgba(60,200,255,.45), transparent 70%),
  radial-gradient(40% 55% at 78% 55%, rgba(170,110,255,.45), transparent 70%)}
.aurora.a2{top:8%;opacity:.45;animation-duration:22s;animation-direction:alternate-reverse;background:
  radial-gradient(42% 45% at 35% 50%, rgba(120,255,160,.5), transparent 70%),
  radial-gradient(40% 45% at 70% 45%, rgba(90,160,255,.45), transparent 70%)}
@keyframes aurora{0%{transform:translateX(-6%) skewX(-6deg)}100%{transform:translateX(6%) skewX(6deg)}}
.blob{position:absolute;width:56vmax;height:56vmax;border-radius:50%;opacity:.55}
.blob.b1{left:-18vmax;top:14%;background:radial-gradient(circle, var(--blob1,#FFB3D1) 0%, transparent 68%)}
.blob.b2{right:-20vmax;top:-16%;background:radial-gradient(circle, var(--blob2,#C8B6FF) 0%, transparent 68%);animation-duration:32s}
.blob.b3{left:26%;bottom:-30vmax;background:radial-gradient(circle, var(--blob3,#9FD8FF) 0%, transparent 68%);animation-duration:38s}
@keyframes blobfloat{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-4vmax) scale(1.12)}100%{transform:translate(-4vmax,5vmax) scale(.94)}}
body[data-season="spring"]{--blob1:#FF9CC6;--blob2:#C9A8FF;--blob3:#9FD0FF;--glow:rgba(255,120,180,.45)}
body[data-season="summer"]{--blob1:#5FE0D0;--blob2:#FFE27A;--blob3:#4FB8FF;--glow:rgba(40,170,220,.5)}
body[data-season="autumn"]{--blob1:#FF7A3D;--blob2:#FFC857;--blob3:#B3364E;--glow:rgba(220,90,50,.55)}
body[data-season="winter"]{--blob1:#3E62D6;--blob2:#59E3C2;--blob3:#9A7BFF;--glow:rgba(90,140,255,.5)}

/* 보드와 패널은 어떤 배경 위에서도 읽히게 */
#board{box-shadow:0 50px 90px -40px rgba(10,12,20,.75), 0 0 0 1px rgba(255,255,255,.15), 0 0 120px -20px var(--glow, transparent)}
#side{background:rgba(255,255,255,.82);
  border-radius:22px;padding:14px;box-shadow:0 30px 60px -36px rgba(10,12,20,.6), inset 0 0 0 1px rgba(255,255,255,.6)}
.side-title{color:#3A3C44}
.fund-box{background:rgba(255,255,255,.7)}
#logDock{box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}

/* ================================================================
   칸 효과와 말의 상호작용
   ================================================================ */
.fxrocket{position:absolute;left:0;top:0;width:58px;height:58px;color:#fff;filter:drop-shadow(0 0 10px var(--c)) drop-shadow(0 6px 10px rgba(0,0,0,.4));will-change:transform}
.fxrocket .ic{width:100%;height:100%;color:#F7F5F0}
.fxrocket .flame{position:absolute;left:50%;top:76%;width:20px;height:40px;margin-left:-10px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;
  background:radial-gradient(ellipse at 50% 20%, #FFF6C8, #FFB347 45%, rgba(255,90,40,0) 75%);animation:flame .12s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.85)}to{transform:scaleY(1.2)}}
.fxwarp{position:absolute;width:0;height:0}
.fxwarp i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent, var(--c), transparent 40%, var(--c) 60%, transparent 80%);
  -webkit-mask:radial-gradient(circle, transparent 28%, #000 30%, #000 62%, transparent 66%);mask:radial-gradient(circle, transparent 28%, #000 30%, #000 62%, transparent 66%);
  animation:warp 1.2s cubic-bezier(.2,.8,.3,1) forwards}
.fxwarp i:nth-child(2){animation-delay:.1s;animation-direction:reverse;opacity:.7}
.fxwarp i:nth-child(3){animation-delay:.2s;transform:scale(.6)}
@keyframes warp{0%{transform:scale(.1) rotate(0);opacity:0}25%{opacity:1}100%{transform:scale(1.4) rotate(540deg);opacity:0}}
.fxbars{position:absolute;overflow:hidden;border-radius:6px;pointer-events:none}
.fxbars::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg, transparent 0 10%, #2B2E36 10% 15%);
  box-shadow:inset 0 6px 0 #2B2E36, inset 0 -6px 0 #2B2E36;animation:bars 1.7s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes bars{0%{transform:translateY(-105%)}22%{transform:translateY(0)}80%{opacity:1}100%{transform:translateY(0);opacity:0}}
.fxkey{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;color:#E0B341;filter:drop-shadow(0 0 12px rgba(255,210,122,.95));animation:keyrise 1.25s cubic-bezier(.2,.8,.3,1) forwards}
.fxkey .ic{width:100%;height:100%;stroke-width:2.2}
@keyframes keyrise{0%{transform:translateY(10px) rotate(-30deg) scale(.4);opacity:0}30%{transform:translateY(-26px) rotate(0) scale(1.15);opacity:1}100%{transform:translateY(-60px) rotate(20deg) scale(.9);opacity:0}}
.fxcoin{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #FFF4C2, #F2C230 45%, #B58A12 100%);box-shadow:inset 0 0 0 1.5px rgba(150,105,10,.6), 0 2px 4px rgba(0,0,0,.3);
  animation:coinfly var(--d,900ms) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes coinfly{0%{transform:translate(0,0) rotateY(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotateY(720deg) scale(1);opacity:0}}
.fxbubble{position:absolute;transform:translate(-50%,-100%);margin-top:-8px;padding:5px 11px;border-radius:12px;white-space:nowrap;
  background:#fff;color:#16171B;font-size:13px;font-weight:600;box-shadow:0 8px 18px -8px rgba(0,0,0,.5), inset 0 0 0 2px var(--c);
  animation:bubble 1.7s cubic-bezier(.2,.9,.3,1.2) forwards}
.fxbubble::after{content:'';position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;background:#fff;transform:rotate(45deg);box-shadow:2px 2px 0 0 var(--c)}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
.token.leap{animation:tokleap .26s ease-out}
@keyframes tokleap{0%,100%{transform:translateY(0)}50%{transform:translateY(-55%) scale(1.08)}}
.token.bump{animation:tokbump .6s ease-out}
@keyframes tokbump{0%{transform:translateX(0)}25%{transform:translateX(-18%) rotate(-12deg)}55%{transform:translateX(10%) rotate(6deg)}100%{transform:none}}
.token.knock{animation:tokknock .6s ease-out}
@keyframes tokknock{0%{transform:none}30%{transform:translateX(22%) rotate(18deg)}60%{transform:translateX(-6%) rotate(-6deg)}100%{transform:none}}
.token.cheer{animation:tokcheer .9s ease-out}

<script>
(() => {
'use strict';

/* ================= 유틸 ================= */
const $ = (id) => document.getElementById(id);
const fmt = (v) => {
  v = Math.round(v);
  const neg = v < 0; v = Math.abs(v);
  let s;
  if (v >= 10000) {
    const eok = Math.floor(v / 10000), man = v % 10000;
    s = man ? eok + '억 ' + man.toLocaleString('ko-KR') + '만' : eok + '억';
  } else s = v.toLocaleString('ko-KR') + '만';
  return (neg ? '-' : '') + s;
};
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= 조사 자동 선택 =================
   문구에 적어 둔 '이(가)', '을(를)', '은(는)', '와(과)', '(으)로' 를 바로 앞 글자의 받침에 맞춰 바꾼다.
   앞 글자가 한글이나 숫자가 아니면(영문 이름 등) 원래 표기를 그대로 둔다. */
const JOSA = {'이(가)':['이','가'], '을(를)':['을','를'], '은(는)':['은','는'], '와(과)':['과','와'], '(으)로':['으로','로']};
const DIGIT_JONG = [1,8,0,1,0,0,1,8,8,0];   /* 영 일 이 삼 사 오 육 칠 팔 구 의 받침 (0 없음, 8 ㄹ) */
function josa(html){
  html = String(html);
  return html.replace(/이\(가\)|을\(를\)|은\(는\)|와\(과\)|\(으\)로/g, (mark, at) => {
    let i = at - 1, jong = -1;
    while(i >= 0 && at - i < 80){
      const ch = html[i];
      if(ch === '>'){ const lt = html.lastIndexOf('<', i); if(lt < 0) break; i = lt - 1; continue; }   /* 태그 건너뛰기 */
      const code = ch.charCodeAt(0);
      if(code >= 0xAC00 && code <= 0xD7A3){ jong = (code - 0xAC00) % 28; break; }
      if(ch >= '0' && ch <= '9'){ jong = DIGIT_JONG[+ch]; break; }
      if(/[A-Za-z]/.test(ch)) break;      /* 영문은 발음을 알 수 없으니 그대로 둔다 */
      i--;                                 /* 괄호, 공백, 이모지 등은 건너뛴다 */
    }
    if(jong < 0) return mark;
    const pair = JOSA[mark];
    if(mark === '(으)로') return (jong === 0 || jong === 8) ? pair[1] : pair[0];
    return jong ? pair[0] : pair[1];
  });
}

const SOLID_IC = {star:1, play:1, fast:1, 'p-hat':1, 'p-rocket':1, 'p-crown':1, 'p-gem':1, 'p-car':1, 'p-die':1};
function icon(name, cls){
  if(!ICONS[name]) return '';
  return '<svg class="ic' + (SOLID_IC[name] ? ' solid' : '') + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';
}
/* 이모지 → 아이콘 이름. 여기 없는 그림 문자는 지운다. */
const EMOJI_IC = {

  '🏠':'house','🏚':'house','🏢':'building','🏙':'building','🏨':'hotel','👑':'crown','💵':'plus','💸':'minus','🥤':'cup',
  '🎉':'spark','✨':'spark','⚔':'versus','🤝':'swap','🔄':'refresh','🔊':'volume','🔇':'mute','🏁':'flag','🔥':'fire','🎯':'target',
  '🏆':'trophy','⏳':'clock','🎵':'music','❓':'help','❔':'help','🦶':'arrow','🏦':'bank','👆':'touch',
