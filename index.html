let setupN = 3;
let setupPieces = [0, 1, 2, 3];   /* 플레이어별 선택한 피규어 (PIECES 인덱스) */
let setupAI = [false, false, false, false];       /* 각 슬롯이 AI 인가 */
let setupDiff = ['mid', 'mid', 'mid', 'mid'];     /* AI 난이도: low/mid/high */
const DIFF_LABEL = {low:'하', mid:'중', high:'상'};

function renderNameInputs(){
  const box = $('nameInputs');
  const prev = [];
  box.querySelectorAll('input[type="text"]').forEach(inp=>prev.push(inp.value));
  box.innerHTML = '';
  /* 1인 모드면 최소 1명은 사람, 나머지는 자동으로 AI 기본값 */
  for(let i=0;i<setupN;i++){
    const row = document.createElement('div');
    row.className = 'nrow' + (setupAI[i] ? ' ai' : '');
    const btn = document.createElement('button');
    btn.className = 'figbtn';
    btn.type = 'button';
    btn.title = PIECES[setupPieces[i]].n + ' (눌러서 바꾸기)';
    btn.appendChild(figureStage(PIECES[setupPieces[i]].k, PCOLORS[i], false));
    btn.addEventListener('click', ()=>openPiecePicker(i));
    row.appendChild(btn);
    const dot = document.createElement('span');
    dot.className = 'pdot';
    dot.style.background = PCOLORS[i];
    dot.textContent = i+1;
    row.appendChild(dot);

    const inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 8; inp.id = 'pname'+i;
    inp.placeholder = setupAI[i] ? ('AI '+(i+1)) : ('플레이어 '+(i+1));
    inp.disabled = setupAI[i];
    if(prev[i]) inp.value = prev[i];
    row.appendChild(inp);

    /* 사람/AI 토글 */
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'aitoggle' + (setupAI[i] ? ' on' : '');
    toggle.innerHTML = setupAI[i] ? icon('bot')+'AI' : icon('user')+'사람';
    toggle.addEventListener('click', ()=>{
      setupAI[i] = !setupAI[i];
      renderNameInputs();
    });
    row.appendChild(toggle);

    /* AI 난이도 선택 */
    if(setupAI[i]){
      const diffWrap = document.createElement('div');
      diffWrap.className = 'diffsel';
      ['low','mid','high'].forEach(d=>{
        const db = document.createElement('button');
        db.type = 'button';
        db.className = 'diffbtn' + (setupDiff[i]===d ? ' sel' : '');
        db.textContent = DIFF_LABEL[d];
        db.title = {low:'하 (소극적)', mid:'중 (보통)', high:'상 (공격적)'}[d];
        db.addEventListener('click', ()=>{ setupDiff[i] = d; renderNameInputs(); });
        diffWrap.appendChild(db);
      });
      row.appendChild(diffWrap);
    }
    box.appendChild(row);
  }
}
function openPiecePicker(pi){
  const taken = {};
  for(let i=0;i<setupN;i++) if(i!==pi) taken[setupPieces[i]] = i;
  const wrap = document.createElement('div');
  wrap.className = 'figpick';
  PIECES.forEach((pc, idx)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'figopt' + (setupPieces[pi]===idx ? ' sel' : '') + (taken[idx]!==undefined ? ' taken' : '');
    if(taken[idx]!==undefined) b.disabled = true;
    const w = document.createElement('div');
    w.className = 'fwrap';
    w.appendChild(figureStage(pc.k, taken[idx]!==undefined ? '#9A9A9A' : PCOLORS[pi], false));
    b.appendChild(w);
    const lab = document.createElement('div');
    lab.className = 'flabel';
    lab.textContent = pc.n + (taken[idx]!==undefined ? ' (사용중)' : '');
    b.appendChild(lab);
    b.addEventListener('click', ()=>{
      if(taken[idx]!==undefined) return;
      setupPieces[pi] = idx;
      closeInfo();
      renderNameInputs();
      sfx('card');
    });
    wrap.appendChild(b);
  });
  infoModal('말 고르기: 플레이어 '+(pi+1),
    '<p class="hint">보드 위에서 이 피규어가 당신의 말이 됩니다. 다른 사람이 고른 말은 선택할 수 없습니다.</p>',
    [{l:'닫기', cls:'ghost'}], PCOLORS[pi]);
  $('iBody').appendChild(wrap);
}
/* 번개전: 도시를 값에 따라 세 묶음으로 나눠 묶음마다 한 곳씩 별장과 함께 나눠 준다.
   (모노폴리 '짧은 게임'처럼 땅을 갖고 시작해 첫 턴부터 통행료가 오간다) */
function dealProperties(){
  const cities = [];
  SP.forEach((sp,i)=>{ if(sp.type==='city') cities.push(i); });
  cities.sort((x,y)=>SP[x].price - SP[y].price);
  const tiers = MODE.deal, per = Math.floor(cities.length / tiers);
  const got = G.players.map(()=>[]);
  for(let t=0;t<tiers;t++){
    const pool = cities.slice(t*per, t===tiers-1 ? cities.length : (t+1)*per);
    for(let i=pool.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
    G.players.forEach((pl,k)=>{
      const idx = pool[k];
      if(idx === undefined) return;
      SP[idx].owner = pl.i; SP[idx].bl.v = 1;
      got[k].push(SP[idx].name);
    });
  }
  G.players.forEach((pl,k)=>log('📜 <b>'+esc(pl.name)+'</b>: '+got[k].join(', ')+'에 별장을 한 채씩 갖고 시작합니다.'));
}
function startGame(){
  G.n = setupN;
  MODE = MODES[setupMode] || MODES.standard;
  AI_DELAY = MODE.aiDelay;
  G.opts.takeover = $('optTakeover').checked;
  G.opts.startCash = parseInt(document.querySelector('input[name="scash"]:checked').value, 10);
  G.players = [];
  for(let i=0;i<G.n;i++){
    const inp = $('pname'+i);
    const isAI = !!setupAI[i];
    const defName = isAI ? ('AI '+(i+1)+' ['+DIFF_LABEL[setupDiff[i]]+']') : ('플레이어 '+(i+1));
    const nm = (!isAI && inp && inp.value.trim()) || defName;
    G.players.push({i:i, name:nm, color:PCOLORS[i], piece:setupPieces[i], cash:G.opts.startCash, pos:0, alive:true, island:0, travel:0, cheongyeon:0, trapped:0, trapName:'', trapIcon:'', salaryMult:1, leader:false, underdog:false, tollBuff:false, jailCount:0, careWins:0, daycareWins:0, criminal:false, cpEnjoyer:false, bhacks:false, items:{escape:0, pass:0}, ai:isAI, diff:setupDiff[i],
      stat:{tollIn:0, tollOut:0, laps:0}, outAt:0});
  }
  G.deck = CARDS.slice();
  for(let i=G.deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = G.deck[i]; G.deck[i] = G.deck[j]; G.deck[j] = tmp;
  }
  G.cur = 0; G.turnNo = 1; G.fund = 0; G.over = false; G.endgameApplied = false; G.stepping = false; G.specialOwner = null; G.manualPrompt = false;
  G.round = 1; G.season = 0; G.year = 1; G.festival = null; G.mono = {};
  G.timeLeft = MODE.limit*1000; G.timeUp = false; G.finalPhase = false;
  document.body.classList.remove('final');
  Object.keys(TOKELS).forEach(k=>{ const e=TOKELS[k]; if(e && e.parentNode) e.parentNode.removeChild(e); delete TOKELS[k]; });
  SP.forEach(sp=>{ if(sp.type==='city'){ sp.owner=null; sp.bl={v:0,b:0,h:0,L:0}; } if(sp.type==='veh') sp.owner=null; });
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('setup').classList.add('hidden');
  $('game').classList.remove('hidden');
  placeLog();
  fitDice();
  DICE.forEach(dieRender);
  startMusic();
  pickFestival();
  Ambient.start();
  log('🌍 <b>글로벌 마블</b> '+MODE.n+' 시작! '+G.n+'명이 시작 자금 '+fmt(G.opts.startCash)+'원으로 출발합니다.');
  log('🎯 '+MODE.d);
  if(G.opts.takeover) log('🤝 인수 규칙 적용: 건물 없는 상대 도시는 땅값의 2배에 인수할 수 있습니다.');
  if(MODE.deal) dealProperties();
  applySeason(false);
  syncMonopolies(false);
  renderAll();
  const sn = curSeason();
  log(icon(sn.ic)+'<b>'+sn.n+'</b>으로 시작합니다. '+sn.t+': '+sn.d+'. 축제 도시는 <b>'+SP[G.festival].name+'</b> (통행료 2배)');
  startClock();
  beginTurn();
}

/* 안내 모달은 바깥을 누르거나 Esc 로 닫는다 */
$('iBack').addEventListener('click', (e)=>{ if(e.target === $('iBack')) closeInfo(); });
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){ if(infoOpen()) closeInfo(); return; }
  /* 스페이스/엔터: 사람 차례의 진행 버튼(던지기, 턴 마치기)을 누른다 */
  if(e.key !== ' ' && e.key !== 'Enter') return;
  if(e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target, tag = tg && tg.tagName;
  const shown = tg && tg.offsetParent !== null;       /* 숨겨진 버튼에 남은 포커스는 무시한다 */
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if((tag === 'BUTTON' || tag === 'A') && shown) return;
  if(!G.players.length || G.over || infoOpen() || modalOpen() || rolling) return;
  const p = curP();
  if(!p || p.ai) return;
  const act = $('actions').querySelector('[data-auto="1"]:not([disabled])');
  if(act){ e.preventDefault(); act.click(); }
});

document.querySelectorAll('[data-ic]').forEach(el=>{ el.innerHTML = icon(el.dataset.ic); });
$('stripe').innerHTML = Object.keys(GROUPS).filter(k=>k!=='vh').map(k=>'<span style="background:'+GROUPS[k].c+'"></span>').join('');
window.addEventListener('resize', ()=>{ placeLog(); fitDice(); });
renderModes();
buildBoard();
buildDice();
renderNameInputs();
document.querySelector('.mode-btn[data-n="3"]').classList.add('sel');
})();
</script>
